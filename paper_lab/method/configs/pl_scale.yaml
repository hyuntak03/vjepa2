# =============================================================================
# paper_lab 확대 학습 (진행자 2, 2026-10-21) — 파일럿 (pl_pilot) 이 갈림 규칙 (a) 로 나오면 띄운다.
# pl_pilot 과 같은 데이터 · 배치 · lr 모양, step 만 4 배 (40 × 200 = 8,000). seed 는 SEED=0/1 로 (run_arm.sh 가 meta.seed 를 덮는다).
# =============================================================================
extends: pl_pilot

optimization:
  epochs: 40
  ipe: 200                             # 40 × 200 = 8,000 step

meta:
  save_every_freq: 10                  # e10 · e20 · e30 · e40 = 2,000 · 4,000 · 6,000 · 8,000 step (학습 곡선)

val:
  every_epochs: 5                      # in-loop IntPhys1 val (80 초) 을 5 epoch 마다
