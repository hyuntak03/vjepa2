# 무엇을 바꿨나: lab_v2_base 와 같고 학습 clip 만 v2 의 late 칸 (문맥 끝에서 target 이 가려진 칸, 16,293 clip = 108 칸) 으로.
# 왜: v1 PFT 는 VOBench late +10 / +7 인데 v2 PFT 는 0 — v2 는 문맥 끝 가림이 1/3, v1 은 창의 절반을 문맥 끝 가림으로 골랐다.
#   late 칸만으로 학습하면 오르나 → 비중 탓인지, 데이터 (가림 종류 · 카메라 · 운동) 탓인지를 가른다. 2026-11-01 사용자 요청.
#   남는 차이 (v1 대비): 가림 형태 셋 · 카메라 셋 · 운동 12 · 창 고정 (보폭 2 · 문맥 16). 오르면 비중, 안 오르면 나머지 중 하나.
# step 을 v2 판 (1,539) 과 맞춘다: 16,293 / 32 = 509 step × 3 = 1,527 step.
#   BT_TRAIN_META=$LAB_REPO/data_csv/blender_track_v2/train_meta_ok_late.npz bash predictor_lab/train.sh lab_v2_late
extends: lab_v2_base
