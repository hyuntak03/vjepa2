# EK100 action anticipation — ViT-H, frozen encoder + predictor + attentive probe.
# 이 파일 하나가 본 설정이다 (생성기 없음). 실행:  GPUS=8 bash z_research/anticipation/EK100/run.sh
#
# 논문 (V-JEPA 2 §6, Appendix D.1, Table 19) 과 같은 값:  32 frames @ 8 fps, 256x256, probe 4 blocks / 16 heads / query 3,
#   focal loss, 20 epoch, warmup 0, global batch 128 (8 GPU x 16), train at 0.25~1.75s ap 0~0.25, val at 1s ap 0.
# 논문과 다르게 둔 것 (README §3):  head 1개 (논문 20개 sweep 의 best) · val 을 정확히 한 번 센다 · mask_index 0.
# 릴리즈 코드와 다르게 둔 것 (README §2):  ap 규약을 논문대로 (paper) · 구간 경계를 timestamp 로 · 256x256 재인코딩본.
tag: ek100_vith
eval_name: action_anticipation_frozen
folder: /data/hyuntak/project/2026/2027_cvpr/vjepa2/z_research/anticipation/EK100/exp_results
resume_checkpoint: true
nodes: 1            # 공식 submitit 경로용 필드. 우리는 evals/main.py 로 돌리므로 world_size 는 GPUS 가 정한다
tasks_per_node: 8
cpus_per_task: 12
experiment:
  classifier:
    num_probe_blocks: 4
    num_heads: 16
  data:
    dataset: EK100
    file_format: 0                  # $base_path/P01/videos/P01_01.MP4
    # 2026-09-15 부터: 공식 val 기하 (짧은변 292 INTER_LINEAR -> 가운데 256) 로 다시 만든 train 495 + val 138 (README §3-1).
    # 같은 경로 이름에 있던 옛 데이터 (짧은변 256 -> 256) 는 지워졌다. 그 전 run 은 옛 데이터 기준.
    base_path: /data2/local_datasets/EPIC-KITCHENS_resized
    dataset_train: /data/hyuntak/project/2026/2027_cvpr/epic-kitchens-100-annotations/EPIC_100_train.csv
    dataset_val: /data/hyuntak/project/2026/2027_cvpr/epic-kitchens-100-annotations/EPIC_100_validation.csv
    frames_per_clip: 32
    frames_per_second: 8
    resolution: 256
    spatial_mode: short_side        # 256x256 입력에서 항등. center_crop(공식) 은 292 로 다시 키워 자른다
    width: null
    train_spatial_mode: rrc
    anticipation_point_mode: paper  # ap=0 -> action 첫 프레임 (논문). released 는 ap=0 -> action 끝 (val 78.8% 누수)
    time_source: timestamp          # start/stop_timestamp x 실제 fps. frame(공식) 은 59.94fps 비디오에서 최대 2s 어긋난다
    train_anticipation_time_sec: [0.25, 1.75]
    train_anticipation_point: [0.0, 0.25]
    anticipation_time_sec: [1.0, 1.0]   # val (eval.py 가 이 이름으로 읽는다)
    val_anticipation_point: [0.0, 0.0]
    auto_augment: true
    motion_shift: false
    reprob: 0.25
    random_resize_scale: [0.08, 1.0]
    num_workers: 6
    pin_memory: true
    limit_videos: null
  evaluation:
    topk: 5                         # mean class recall@5 (verb / noun / action)
    exact_val_pass: true            # rank 마다 val 을 끝까지 한 번, all_reduce 한 번 (exact_val.py)
  optimization:
    num_epochs: 20
    batch_size: 16                  # rank 당. 8 GPU 면 global 128 = 논문
    use_bfloat16: true
    use_focal_loss: true            # alpha 0.25 / gamma 2.0
    multihead_kwargs:               # HEADS=sweep 이면 resolve.py 가 논문의 20개 (lr 5 x wd 4) 로 바꾼다
    - {lr: 0.0003, start_lr: 0.0003, final_lr: 0.0, weight_decay: 0.01, final_weight_decay: 0.01, warmup: 0.0}   # 2026-09-14: 1e-3 은 80 iter 안에 상수 예측으로 붕괴 (README §7)
model_kwargs:
  checkpoint: /data/hyuntak/project/2026/2027_cvpr/vjepa2/checkpoint/models--facebook--vjepa2-vith-fpc64-256/snapshots/b5eac8703e3efdc1547fbb6ddfbeb133dc0bdee5/original/model.pth
  # 원본 module 에 mask_index 인자만 연 판. 정사각 + mask_index 1 에서는 원본과 비트 단위로 같다 (selftest [3])
  module_name: evals.action_anticipation_frozen.modelcustom.vit_encoder_predictor_concat_ar_nonsquare
  wrapper_kwargs:
    no_predictor: false             # true = encoder 출력만 probe 에 (논문 Table 20 의 대조군)
    num_output_frames: 2            # 예측 1 tubelet
    num_steps: 1
    mask_index: 0                   # 릴리즈 ckpt 에서 학습된 mask token 은 [0] 뿐 (1~9 는 0 벡터). 공식 코드 기본은 1
  pretrain_kwargs:
    encoder:
      model_name: vit_huge
      checkpoint_key: target_encoder
      tubelet_size: 2
      patch_size: 16
      uniform_power: true
      use_rope: true
    predictor:
      model_name: vit_predictor
      checkpoint_key: predictor
      num_frames: 64
      depth: 12
      num_heads: 12
      predictor_embed_dim: 384
      num_mask_tokens: 10
      uniform_power: true
      use_mask_tokens: true
      use_sdpa: true
      use_silu: false
      wide_silu: false
      use_rope: true
