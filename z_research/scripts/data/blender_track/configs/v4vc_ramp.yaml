# BlenderTrack v4_velocity_control 빗면 (v4vcr, 2026-11-02 2 차, 사용자: "빗면도 넣고 trapdoor 도 넣어서")
#   1 차 (configs/v4vc.yaml, 평면) 와 같은 원칙 — 묶음 = 같은 장면 (빗면 · 카메라 · 가림막 · 공 · 방향 · 그 밖 물체) × 속도 4 단계 + 빈 장면.
#   1 차 결과: VOBench late 움직이는 물체 사라짐 0 → 47 % 인데 평면 등속 6/6 · 빗면 0–1/12 (학습에 없던 운동은 안 옮겨 감) → 빗면 묶음을 더한다.
#   빗면 모드 (묶음 요인, trapdoor 는 내려감 1/3 · 올라감 2/3, 판 · 벽은 내려감만 — 11-02 시험 올라감 × 판 · 벽 0/19): 내려감 = 가려지는 자리에서 아래로 굴러가는 중 (가속 — 느린 단계는 문맥 안에서 굴러 올라갔다 되돌아온 꼴) ·
#                         올라감 = 위로 굴러가는 중 (감속, 가려진 뒤 되돌아오기도 함).
#   가리는 것: 판 · 낮은 벽 · trapdoor (VOBench late 꼴). 공만 (primitive 구 · realistic 농구공 · 축구공 · 비치볼) — 빗면에서 구르는 것.
#   출력 폴더는 1 차와 같다 (분할 이름 · seed 가 달라 겹치지 않음). 목록 data_csv/blender_track_v4vcr/
name: v4vcr
design: gen_design_v4vc
out: /data/hyuntak/project/2026/2027_cvpr/nfs_cache/blender_track/v4_velocity_control
fps: 20
frames: 64
size: 256
g: 9.81

cells:                                 # 상황 = 물체 셋 × 카메라 × 가리는 것 = 2 × 2 × 3 = 12 (빗면 모드 내려감 · 올라감은 상황 안 요인)
  place: [ramp]
  objset: [primitive, realistic]
  camera: [front, side]
  occ: [board, wall, trapdoor]

velocity:
  levels: 4                            # K
  ratio_step: 1.26                     # ρ — 단계 사이 화면 속력 비 (K 4 → 가장 느린 : 가장 빠른 = 1 : 2). 11-02 시험: 1 : 3.4 · 1 : 2.5 는 느린 단계가 창 안에서 다 빠져나오지 못함
  u0_rel: [0.105, 0.135]              # 가장 느린 단계의 화면 속력 = target 화면 지름 × 이 값 (px / 샘플; 샘플 = 0.1 s). 32 px 물체면 3.4–4.3 → 가장 빠른 6.7–8.6. VOBench late 움직임 4–7.5
  mu_roll: [0.0005, 0.004]             # 구름 감속 = mu · g (작게 — 다시 나오기 전에 멈추지 않게)
  mu_slide: [0.003, 0.012]
  keep_speed: 0.8                      # 가장 느린 단계도 창 끝까지 가려질 때 속력의 80 % 이상 (11-02 시험: 50 % 면 느린 단계가 못 빠져나옴)
  hide: ["14", "15"]                   # 가려지기 시작하는 샘플 s_in (13 은 느린 단계가 창 안에서 못 빠져나옴)
  fast_hide: [1.6, 2.4]                # 가장 빠른 단계가 완전히 가려져 있는 샘플 수 (적어도 샘플 16 까지). 느린 단계 ≈ × 2
  trap_hold: [2.5, 4.5]                # trapdoor: 가려지기 시작부터 판이 눕기 시작할 때까지 (샘플). VOBench late 가림 2–6 샘플
  max_off: 0.25                        # 화면 밖 (≥ 30 %) 샘플 비율 상한 (v3 0.15 — 빠른 단계는 화면 밖에서 들어온다)

splits:
  # 묶음 f → 렌더 번호 f·(K+1) + k (k < K 속도 단계 · k = K 빈 장면). 고르는 수 = 상황 12 × 정수. 1 차 평면 1,190 묶음과 비슷한 크기
  rtrain_fam: {seed: 80, families: 1200, candidates: 1800, n: 9000}
  rtest: {seed: 82, families: 240, candidates: 360, n: 1800}
  rprobe: {seed: 89, families: 12, candidates: 24, n: 120}

timing:                                # 샘플 번호 (문맥 0–15 · 미래 16–31). late 만 (v3 와 같은 정의)
  late: {start: [9, 15], end: [16, 27]}

camera:
  front: {h: [0.25, 0.7], azim: [-10, 10], lens: [35, 55]}
  side:  {h: [0.25, 0.7], azim: [30, 60], lens: [32, 50]}
  jitter_deg: 3

objects:
  target_px: [26, 40]                  # v3 32–58 보다 작게 (VOBench 27–33 px): 느린 단계가 제 폭을 지나는 데 걸리는 샘플을 줄인다
  min_px: 18                           # v3 22 — 물체를 작게 (26–40 px) 잡아 측면 카메라 먼 끝에서 22 를 자주 밑돈다 (11-02 시험)
  extra_min_px: 28
  extra_visible_min: 0.7
  extra_max_hidden: 0.1
  min_hue_diff: 0.167
  moving_shapes: {sphere: 0.6, cube: 0.25, cylinder: 0.15}
  static_shapes: [sphere, cube, cylinder, cone, torus, capsule, pyramid]
  size_m: [0.15, 0.40]
  roll_speed: [0.35, 1.3]              # (그 밖 물체 전용 — target 속도는 velocity 절)
  roll_mu: [0.004, 0.02]
  slide_speed: [0.6, 1.6]
  slide_mu: [0.03, 0.08]
  heading_deg: [-12, 12]
  shadows: true

ramp:                                  # 빗면 (나무 · 칠한 쐐기). 공 가속도 A = 5/7 g sinθ. VOBench 빗면: 가려질 때 4.8–7.3 px/샘플, 5 샘플 동안 등속보다 ~10 px 더 감
  deg_down: [2, 5]                     # 11-02 시험: 내려감은 문맥 내내 가려지는 자리 위에 있어야 해서 (½ A t_in < 속도) 완만해야 한다
  deg_up: [3, 8]                       # 11-02 시험: 2–6° 는 판 · 벽 뒤에서 되돌아온 공이 창 안에 못 나옴 → 더 가파르게 · 빗면을 길게
  len: [1.4, 4.5]
  max_h: 0.7
  # 가려지는 자리 s_h 는 설계기가 모든 단계가 창 안에서 빗면 위에 있도록 가능한 구간에서 고른다

occluders:
  trapdoor_rise: [0.08, 0.2]
  gap: [0.08, 0.5]
  board_th: [0.02, 0.05]
  wall_th: [0.12, 0.25]
  object_static_shapes: {cube: 0.4, cylinder: 0.25, sphere: 0.1, capsule: 0.25}
  object_screen_ratio: [1.1, 2.0]      # v3 1.8 — 측면 카메라 × 서 있는 물체가 1.8 안에서 자주 실패 (11-02 시험)
  object_gap: [0.05, 0.35]

env:
  indoor_p: 0.5
  indoor_hdri: [interior, studio]
  outdoor_hdri: [courtyard, city, forest, sunrise, sunset]
  indoor_floor: [wood, tile, carpet]
  outdoor_floor: [concrete, tile, carpet]

render:
  samples: 16
  denoise: true
  jpeg_quality: 95
  crf: 17
  gop: 8
  threads: 2

checks:
  design_streams: 3
