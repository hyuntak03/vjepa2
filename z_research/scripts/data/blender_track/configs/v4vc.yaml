# BlenderTrack v4_velocity_control (v4vc, 2026-11-02, 사용자 요청: "같은 장면, 다른 속도" 로 속도를 유일한 단서로 만든 학습셋)
#   왜: v3 · v3t 로 학습한 predictor 는 같은 장면에서 속도만 바꿔도 예측 자리가 따라가지 않았다 (속도 따라감 0.00, Blender 안에서도).
#       v3 에서는 장면 배치가 다시 나올 자리를 속도보다 잘 알려 준다 (같은 꼴 장면 평균 경로 오차 1.06 토큰 < 등속 외삽 2.27 토큰).
#   무엇: 묶음 (family) = 장면 하나 (카메라 · 환경 · 가림막 · target 생김새 · 방향 · 그 밖 물체) × 속도 K 단계 + 빈 장면 (target 만 뺌) 하나.
#         모든 단계에서 target 은 같은 자리를 같은 샘플에 지나 가려지기 시작한다 (late). 다른 것은 문맥 속 움직임 (속도) 뿐.
#   대조 (train_ind): 같은 설계기로 묶음을 설계하되 장면마다 속도 하나만 렌더한다 (영상 수 · 속도 분포 · 빈 장면 수 같음, 장면 수 K 배).
#   설계 코드 gen_design_v4vc.py, 묶음 설계 design_families_v4vc.py, 팔 · 목록 compose_v4vc.py
name: v4vc
design: gen_design_v4vc
out: /data/hyuntak/project/2026/2027_cvpr/nfs_cache/blender_track/v4_velocity_control
fps: 20
frames: 64
size: 256
g: 9.81

cells:                                 # 상황 = 물체 셋 × 카메라 × 가리는 것 = 16 − 2 (측면 × 서 있는 물체 제외) = 14
  objset: [primitive, realistic]
  camera: [front, side]
  exclude: [primitive|side|object, realistic|side|object]   # 11-02 시험: 측면 카메라에서 서 있는 물체가 2 배 안에서 못 덮음 (성공 1/10 · 5/10)
  occ: [board, wall, trapdoor, object]   # 판 · 낮은 벽 (옆으로 빠져나옴) / trapdoor (VOBench late 꼴: 판이 누우며 드러남) / 서 있는 다른 물체

velocity:
  levels: 4                            # K
  ratio_step: 1.26                     # ρ — 단계 사이 화면 속력 비 (K 4 → 가장 느린 : 가장 빠른 = 1 : 2). 11-02 시험: 1 : 3.4 · 1 : 2.5 는 느린 단계가 창 안에서 다 빠져나오지 못함
  u0_rel: [0.105, 0.135]              # 가장 느린 단계의 화면 속력 = target 화면 지름 × 이 값 (px / 샘플; 샘플 = 0.1 s). 32 px 물체면 3.4–4.3 → 가장 빠른 6.7–8.6. VOBench late 움직임 4–7.5
  mu_roll: [0.0005, 0.004]             # 구름 감속 = mu · g (작게 — 다시 나오기 전에 멈추지 않게)
  mu_slide: [0.003, 0.012]
  keep_speed: 0.8                      # 가장 느린 단계도 창 끝까지 가려질 때 속력의 80 % 이상 (11-02 시험: 50 % 면 느린 단계가 못 빠져나옴)
  hide: ["14", "15"]                   # 가려지기 시작하는 샘플 s_in (13 은 느린 단계가 창 안에서 못 빠져나옴)
  fast_hide: [1.6, 2.4]                # 가장 빠른 단계가 완전히 가려져 있는 샘플 수 (적어도 샘플 16 까지). 느린 단계 ≈ × 2
  trap_hold: [2.5, 4.5]                # trapdoor: 가려지기 시작부터 판이 눕기 시작할 때까지 (샘플). VOBench late 가림 2–6 샘플
  max_off: 0.25                        # 화면 밖 (≥ 30 %) 샘플 비율 상한 (v3 0.15 — 빠른 단계는 화면 밖에서 들어온다)

splits:
  # 묶음 분할: 묶음 f → 렌더 번호 f·(K+1) + k (k < K 속도 단계 · k = K 빈 장면). n = 묶음 후보 수 × (K+1). 고르는 수 = 상황 14 × 정수
  train_fam: {seed: 70, families: 1190, candidates: 1428, n: 7140}
  # 대조 분할: 장면 s (묶음 설계 그대로) → 번호 2s = 속도 단계 (상황 안 번호 % K) 하나, 2s+1 = 빈 장면 (상황 안 번호 % K == 0 일 때만). n = 2 × 후보
  #   영상 수를 fam 과 맞춘다: target 있는 영상 4 × 1190 = 4760 · 빈 장면 ≈ 1190
  train_ind: {seed: 71, families: 4760, candidates: 5712, n: 11424}
  test: {seed: 72, families: 322, candidates: 392, n: 1960}
  probe: {seed: 79, families: 14, candidates: 28, n: 140}

timing:                                # 샘플 번호 (문맥 0–15 · 미래 16–31). late 만 (v3 와 같은 정의)
  late: {start: [9, 15], end: [16, 27]}

camera:
  front: {h: [0.25, 0.7], azim: [-10, 10], lens: [35, 55]}
  side:  {h: [0.25, 0.7], azim: [30, 60], lens: [32, 50]}
  jitter_deg: 3

objects:
  target_px: [26, 40]                  # v3 32–58 보다 작게 (VOBench 27–33 px): 느린 단계가 제 폭을 지나는 데 걸리는 샘플을 줄인다
  min_px: 18                           # v3 22 — 물체를 작게 (26–40 px) 잡아 측면 카메라 먼 끝에서 22 를 자주 밑돈다 (11-02 시험)
  extra_min_px: 28
  extra_visible_min: 0.7
  extra_max_hidden: 0.1
  min_hue_diff: 0.167
  moving_shapes: {sphere: 0.6, cube: 0.25, cylinder: 0.15}
  static_shapes: [sphere, cube, cylinder, cone, torus, capsule, pyramid]
  size_m: [0.15, 0.40]
  roll_speed: [0.35, 1.3]              # (그 밖 물체 전용 — target 속도는 velocity 절)
  roll_mu: [0.004, 0.02]
  slide_speed: [0.6, 1.6]
  slide_mu: [0.03, 0.08]
  heading_deg: [-12, 12]
  shadows: true

occluders:
  trapdoor_rise: [0.08, 0.2]
  gap: [0.08, 0.5]
  board_th: [0.02, 0.05]
  wall_th: [0.12, 0.25]
  object_static_shapes: {cube: 0.4, cylinder: 0.25, sphere: 0.1, capsule: 0.25}
  object_screen_ratio: [1.1, 2.0]      # v3 1.8 — 측면 카메라 × 서 있는 물체가 1.8 안에서 자주 실패 (11-02 시험)
  object_gap: [0.05, 0.35]

env:
  indoor_p: 0.5
  indoor_hdri: [interior, studio]
  outdoor_hdri: [courtyard, city, forest, sunrise, sunset]
  indoor_floor: [wood, tile, carpet]
  outdoor_floor: [concrete, tile, carpet]

render:
  samples: 16
  denoise: true
  jpeg_quality: 95
  crf: 17
  gop: 8
  threads: 2

checks:
  design_streams: 3
