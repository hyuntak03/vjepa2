# BlenderTrack v5_motion_control (v5mc, 2026-11-02, 사용자 결정: 평면 가속 넣음 · 다시 보임 기준 유지 · 이름 v5_motion_control)
#   계획 predictor_lab/v4vc/PLAN_v5_motion_control_2026-11-02.md. 설계 gen_design_v5mc.py · 묶음 설계 design_families_v5mc.py · 합성 · 묶기 compose_v5mc.py
#   묶음 = 같은 장면에서 운동만 바꾼 영상 여러 개 + 빈 장면. 묶음 종류 (분할의 ftype): speed (속력 5 단계, 1 : 3 → 2.5 → 2) · accel (가속도 4 단계) · grid (속력 3 × 가속도 3)
#   출력: <out>/work (렌더 작업 공간 — 묶을 때 빠짐) · <out>/data (tar 로 묶는 최종 데이터, 분할 / 묶음 종류 / shard 폴더)
name: v5mc
design: gen_design_v5mc
out: /data/hyuntak/project/2026/2027_cvpr/nfs_cache/blender_track/v5_motion_control/work
data_root: /data/hyuntak/project/2026/2027_cvpr/nfs_cache/blender_track/v5_motion_control/data
fps: 20
frames: 64
size: 256
g: 9.81

cells:                                 # 상황 = 장소 × 물체 셋 × 카메라 × 가리는 것 = 2 × 2 × 2 × 4 − 제외 = 26
  place: [flat, ramp]
  objset: [primitive, realistic]
  camera: [front, side]
  occ: [board, wall, trapdoor, object]
  exclude: ["camera=side&occ=object", "place=ramp&occ=object"]   # v4 실측: 측면 × 서 있는 물체 덮기 실패 · 빗면 위 공을 바닥 물체로 못 덮음 (v3)

velocity:
  speed_levels: 5
  ratio_try: [3.0, 2.5, 2.0]           # speed 묶음 가장 느린 : 가장 빠른 — 앞에서부터 시도, 설계 실패가 쌓이면 좁힘 (다시 보임 기준을 지키려고)
  urel_slow: [0.085, 0.14]             # speed 묶음 가장 느린 단계 화면 속력 = target 화면 지름 × 이 값 (px / 샘플). 3 칸
  urel_mid: [0.12, 0.24]               # accel · grid 묶음의 가려질 때 화면 속력 (지름 배수)
  # 평면 가속도 a = alpha · v_ref / t_in (v_ref = 묶음에서 가장 느린 움직이는 단계의 속력). alpha = 문맥 동안 그 속력이 바뀐 비율 (+ 가속 · − 감속).
  #   11-02 설계 시험: 절대값 (±0.6 m/s²) 은 느린 단계가 문맥 시작에 멈춰 있거나 뒤로 가야 해서 대부분 실패 → 속력에 맞춘 상대값으로
  flat_alpha: [-0.8, 0.8]              # speed 묶음 (평면) 의 묶음 alpha (3 칸: 감속 · 등속 근처 · 가속). |alpha| < flat_alpha_zero 는 0
  flat_alpha_zero: 0.08
  flat_alpha_A: [0.4, 0.8]             # accel · grid 묶음 (평면) alpha 크기 A: 단계 −A, −A/3, +A/3, +A (grid: −A, 0, +A)
  deg_down: [2, 8]                     # 빗면 내려감 각도 (°) — 위 끝은 묶음마다 속력으로 줄인다 (문맥 내내 가려지는 자리 위에 있어야)
  deg_up: [3, 12]                      # 빗면 올라감 각도 (°)
  deg_gap: 1.5                         # accel 묶음 (빗면) 각도 단계 사이 최소 간격
  fast_hide: [1.6, 2.2]                # 가장 멀리 가는 단계가 완전히 가려진 샘플 수 (짧게 — 느린 단계도 창 안에서 완전히 다시 보이게)
  hide: ["14", "15"]                   # 가려지기 시작하는 샘플
  trap_hold: [2.5, 4.5]                # trapdoor: 가려지기 시작부터 판이 눕기 시작할 때까지 (샘플)
  max_off: 0.35                        # 화면 밖 (≥ 30 %) 샘플 비율 상한

splits:
  # 고른 묶음은 빈틈없는 렌더 번호 0, 1, 2 … 를 받는다 (n 은 고르기가 config_render.json 에 쓴다). 고르는 수 = 상황 26 × 정수, 후보 = 3 배
  #   11-02 설계 시험 (probe 52 × 3): 평면 · 빗면 trapdoor 거의 100 %, 빗면 × 판 · 벽 12–37 % (grid 는 ~0) → 후보를 넉넉히 · 모자란 상황은 그대로 둔다
  s_speed: {ftype: speed, seed: 90, families: 4420, candidates: 13260}
  s_accel: {ftype: accel, seed: 91, families: 2340, candidates: 7020}
  s_grid:  {ftype: grid,  seed: 92, families: 1040, candidates: 3120}
  t_speed: {ftype: speed, seed: 95, families: 312,  candidates: 936}
  t_accel: {ftype: accel, seed: 96, families: 208,  candidates: 624}
  t_grid:  {ftype: grid,  seed: 97, families: 104,  candidates: 312}
  p_speed: {ftype: speed, seed: 98, families: 26,   candidates: 52}
  p_accel: {ftype: accel, seed: 99, families: 26,   candidates: 52}
  p_grid:  {ftype: grid,  seed: 89, families: 26,   candidates: 52}

timing:
  late: {start: [9, 15], end: [16, 27]}

camera:
  front: {h: [0.25, 0.7], azim: [-10, 10], lens: [35, 55]}
  side:  {h: [0.25, 0.7], azim: [30, 60], lens: [32, 50]}
  jitter_deg: 3

objects:
  target_px: [24, 34]                  # v4 26–40 → 조금 작게 (몸 폭을 지나는 시간이 줄어 느린 단계도 창 안에서 완전히 다시 보임)
  min_px: 16
  extra_min_px: 26
  extra_visible_min: 0.7
  extra_max_hidden: 0.1
  min_hue_diff: 0.167
  moving_shapes: {sphere: 0.6, cube: 0.25, cylinder: 0.15}
  static_shapes: [sphere, cube, cylinder, cone, torus, capsule, pyramid]
  size_m: [0.15, 0.40]
  roll_speed: [0.35, 1.3]
  roll_mu: [0.004, 0.02]
  slide_speed: [0.6, 1.6]
  slide_mu: [0.03, 0.08]
  heading_deg: [-12, 12]
  shadows: true

ramp:
  len: [1.4, 4.5]
  max_h: 0.9

occluders:
  trapdoor_rise: [0.08, 0.2]
  gap: [0.08, 0.5]
  board_th: [0.02, 0.05]
  wall_th: [0.12, 0.25]
  object_static_shapes: {cube: 0.4, cylinder: 0.25, sphere: 0.1, capsule: 0.25}
  object_screen_ratio: [1.1, 2.0]
  object_gap: [0.05, 0.35]

env:
  indoor_p: 0.5
  indoor_hdri: [interior, studio]
  outdoor_hdri: [courtyard, city, forest, sunrise, sunset]
  indoor_floor: [wood, tile, carpet]
  outdoor_floor: [concrete, tile, carpet]

render:
  samples: 16
  denoise: true
  jpeg_quality: 95
  crf: 17
  gop: 8
  threads: 2

checks:
  design_streams: 2
  max_tries: 250
