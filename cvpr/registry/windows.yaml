# =============================================================================
# 창(window) preset — context / predict 프레임 배치를 **이름**으로 고른다.
#
#   프로토콜 yaml:   window: c16t32            (그 프로토콜의 기본 창)
#   실행 때:         WINDOW=c8t32 bash cvpr/eval/testbed/run.sh v11 vith
#   임의 값:         SET="window.context=12 window.n_frames=32" bash ...   (preset 위에 덮는다)
#
# 기본 창이 아니면 tag 와 결과 폴더에 `_w<이름>` 이 붙는다 (토큰 캐시가 섞이지 않게 —
# 캐시 서명은 video_ids/토큰 수/dtype 만 보므로 context 가 다른 특징을 조용히 재사용할 수 있다).
# 임의 값으로 바꾼 창은 `c{context}t{n_frames}` 같은 이름이 자동으로 붙는다.
#
# kind
#   fixed     단창 고정 (엔진 wma, surprise.mode single · probing 공통)
#             n_frames · context · [stride] · [frames_start] · [model_window=n_frames]
#             stride/frames_start 를 생략하면 데이터셋 레지스트리 값 (IntPhysGen: start 0 / stride 3) 을 쓴다
#   sliding   Garrido A.8 sliding (엔진 wma, surprise.mode intphys1)
#             frame_skips · window_sizes · context_mult · stride · context_reduce · frame_budget · aggregate · video_batch · max_batch
#             frame_skips: dataset -> 데이터셋 레지스트리의 sliding_frame_skips (intphys1 [2,5,10] · grasp [5,10] · inflevel [5,10,20])
#             model_window 는 max(window_sizes). 창(C+M)마다 실행을 나누는 게 공식이다 (한 프로세스에 두 창을 섞지 말 것)
#   intphys2  IntPhys 2 엔진 (논문 D.3): window_size · context_fracs · context_frac · stride · target_fps · frame_step
#   ek100     EK100 엔진: frames_per_clip · fps · train_anticipation_time_sec · anticipation_time_sec · ...
# =============================================================================

# ── fixed (자체 testbed · probing) ──────────────────────────────────────────
c16t32: {kind: fixed, n_frames: 32, context: 16}          # 표준 (surprise_c16t32 / attn_probe). raw 0,3,..,93 → 문맥 16 + 미래 16
c12t32: {kind: fixed, n_frames: 32, context: 12}
c8t32:  {kind: fixed, n_frames: 32, context: 8}
c4t32:  {kind: fixed, n_frames: 32, context: 4}
c16t24: {kind: fixed, n_frames: 24, context: 16}          # 미래 8
c24t32: {kind: fixed, n_frames: 32, context: 24}          # 미래 8
c8t16_s6: {kind: fixed, n_frames: 16, context: 8, stride: 6}   # VideoMAEv2 (창 16 고정, 같은 시간 폭)

# ── sliding (IntPhys 1 프로토콜 — IntPhys1 · GRASP · InfLevel) ───────────────
garrido_a8:                    # A.8 전체 격자. 보고값은 이 격자의 최고 칸 (descriptive — held-out 아님)
  kind: sliding
  frame_skips: dataset
  window_sizes: [16, 32]
  context_mult: [2, 4, 6, 8, 10]   # C = mult x (C+M)/16
  stride: 2                        # 논문 s=2 (시작점 간격)
  data_stride: 1                   # data.frames_stride — sliding 이 프레임을 직접 건너뛴다
  context_reduce: min
  frame_budget: official
  aggregate: [avg]
  dump_windows: true
  video_batch: 6
  max_batch: 48
garrido_w16:       {extends: garrido_a8, window_sizes: [16]}
garrido_w32:       {extends: garrido_a8, window_sizes: [32]}
garrido_skip2_w32: {extends: garrido_a8, frame_skips: [2], window_sizes: [32]}     # IntPhys1 dev ViT-H 88.89 칸
garrido_skip2_w16: {extends: garrido_a8, frame_skips: [2], window_sizes: [16]}     # 83.33 칸

# DINO-Foresight 는 문맥 **4 프레임 고정** (tubelet 1) 이라 창마다 context_mult 를 C=4 가 되게 주고 실행을 나눈다
#   (옛 auto_research/scripts/chain_1002_dinof_intphys1.sh: w5 M=1 · w8 M=4 · w16 M=12. 24 GB 에서 max_batch 16 / video_batch 2)
dinof_w5:  {extends: garrido_a8, frame_skips: [2, 5, 10], window_sizes: [5],  context_mult: [13], max_batch: 16, video_batch: 2}
dinof_w8:  {extends: garrido_a8, frame_skips: [2, 5, 10], window_sizes: [8],  context_mult: [8],  max_batch: 16, video_batch: 2}
dinof_w16: {extends: garrido_a8, frame_skips: [2, 5, 10], window_sizes: [16], context_mult: [4],  max_batch: 16, video_batch: 2}

# ── intphys2 (논문 D.3) ──────────────────────────────────────────────────────
ip2_w48: {kind: intphys2, window_size: 48, context_fracs: [0.25, 0.375, 0.5, 0.625, 0.75, 0.875], context_frac: 0.5, stride: 2, target_fps: 6.0, frame_step: 10}
ip2_w32: {extends: ip2_w48, window_size: 32}
ip2_w16: {extends: ip2_w48, window_size: 16}
ip2_vmae_fps6: {extends: ip2_w16, target_fps: 6.0}      # VideoMAEv2: 창 16 고정, fps 만 바꾼다
ip2_vmae_fps3: {extends: ip2_w16, target_fps: 3.0}
ip2_vmae_fps2: {extends: ip2_w16, target_fps: 2.0}

# ── ek100 ───────────────────────────────────────────────────────────────────
ek100_32f8fps:                 # 논문 §6 / Table 19
  kind: ek100
  frames_per_clip: 32
  frames_per_second: 8
  train_anticipation_time_sec: [0.25, 1.75]
  train_anticipation_point: [0.0, 0.25]
  anticipation_time_sec: [1.0, 1.0]
  val_anticipation_point: [0.0, 0.0]
  num_output_frames: 2           # 예측 1 tubelet
ek100_16f8fps: {extends: ek100_32f8fps, frames_per_clip: 16}
