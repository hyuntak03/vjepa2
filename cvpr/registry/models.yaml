vith_ek100_g7:                    # 2026-10-23. 궤적(optical flow) 보조손실 + 릴리즈 predictor PFT 두 팔 (사용자 지정) + 출발점 anchor.
                                  #   규약은 g6 과 같다: cap16metric 부분집합 · HEADS=cap16b96 · 20 epoch · 4 GPU x batch 24 = global 96 · val_every 5.
                                  #   anchor (릴리즈 predictor) 를 같은 실행에 넣는 이유: g4/g5 의 release 팔이 48.7 vs 48.9 로 흔들린다 —
                                  #   보려는 차이가 1 pt 규모라 실행 간 드리프트를 안에서 흡수해야 한다.
                                  # ⚠️⚠️ pft_ip2pair_lora 의 **LoRA 는 이 평가에서 작동하지 않는다.**
                                  #   LoRA 는 학습 때 online `encoder` (문맥 encoder) 에만 붙었는데 (app/vjepa_frozen/lora.py),
                                  #   EK100 엔진은 `target_encoder` 하나로 특징을 낸다 (cvpr/eval/ek100/protocol.yaml: checkpoint_key: target_encoder).
                                  #   따라서 이 팔은 pft_ip2pair 와 **predictor 가중치만 다르다.** "EK100 에서 LoRA 효과" 로 읽지 말 것.
  base: vith
  predictor_group:
  - name: release                   # 출발점 anchor. g4 에서 verb 48.7 / noun 49.5 / action 33.1
  - name: trajdiff                  # 궤적(optical flow) 보조손실, 짧은 문맥 AR, epoch 70 (K400+SSv2)
    predictor_checkpoint: ${CVPR_REPO}/z_vll7_training/runs/ar_vw_shortctx_trajdiff/latest.pt
