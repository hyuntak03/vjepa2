# ── vast 브랜치 학습 run (2026-10-13). 채점 경로 = analysis/intphys2/model.py 의 _ArBlockEncoder · _ArScorer
#    (문맥 · 타깃 모두 블록별 LN(target_encoder), 힌트 없이 KV rollout — main 의 ar_scoring.py 와 같은 정의, 구현만 다르다)
vast_ar_vw_hint:                  # 출력 되먹임 + 힌트 (sin² 일정), K710+SSv2+HowTo 1%, 가변 창, 70 ep · 20,580 step
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_hint/latest.pt
  predictor.kind: ar
vast_ar_vw_state:                 # 상태 (384) 되먹임, 힌트 없음
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_state/latest.pt
  predictor.kind: ar
  predictor.ar_feedback: state
vast_ar_vw_state_hint:            # 상태 되먹임 + 힌트 10% 고정 (epoch 1–63), 64–70 차단
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_state_hint/latest.pt
  predictor.kind: ar
  predictor.ar_feedback: state
vast_ar_blockcopy:                # AR 공간 복사 기준선 = 마지막 문맥 블록 LN(h) 를 미래 블록 전부에 (main 의 copy_blk 와 같은 정의). predictor 가중치는 안 쓴다
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_state/latest.pt
  predictor.kind: ar
  predictor.ar_feedback: state
  predictor.ar_copy: true
vast_ar_vw_state_delta:           # 상태 되먹임 + 차이 L1 (loss.delta_weight 1.0), 그 밖 vast_ar_vw_state 와 같다
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_state_delta/latest.pt
  predictor.kind: ar
  predictor.ar_feedback: state
vast_tube_cd64:                   # tube 기준선 (릴리즈 레시피 · oneshot, 16장 상수 lr 63 ep → 64장 cooldown 7 ep). IntPhys1 A.8 82.22
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/k710_ssv2_how_ep70_cooldown64/latest.pt
  predictor.kind: oneshot
vast_ar_oneshot_vidctx:           # predictor scratch · 미래 K 블록 한 번에 (mask token, 양방향) · 문맥 = target_encoder 문맥 pass (영상) · 정답 = 창 전체 pass. 데이터 · 창 = natural_ar_vw_state (configs/training/natural_ar_vw_state_oneshot_vidctx.yaml). 10-28 e40 에서 멈춤 → 11-03 70 ep 까지 재개
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_state_oneshot_vidctx/latest.pt
  predictor.kind: ar
  predictor.ar_feedback: state
  predictor.ar_oneshot: true
  predictor.ar_input: video
  predictor.ar_target: window
