#    (문맥 · 타깃 모두 블록별 LN(target_encoder), 힌트 없이 KV rollout — main 의 ar_scoring.py 와 같은 정의, 구현만 다르다)
vast_ar_vw_hint:                  # 출력 되먹임 + 힌트 (sin² 일정), K710+SSv2+HowTo 1%, 가변 창, 70 ep · 20,580 step
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_hint/latest.pt
  predictor.kind: ar
vast_ar_vw_state:                 # 상태 (384) 되먹임, 힌트 없음
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_state/latest.pt
  predictor.kind: ar
  predictor.ar_feedback: state
vast_ar_vw_state_hint:            # 상태 되먹임 + 힌트 10% 고정 (epoch 1–63), 64–70 차단
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_state_hint/latest.pt
  predictor.kind: ar
  predictor.ar_feedback: state
vast_ar_blockcopy:                # AR 공간 복사 기준선 = 마지막 문맥 블록 LN(h) 를 미래 블록 전부에 (main 의 copy_blk 와 같은 정의). predictor 가중치는 안 쓴다
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_state/latest.pt
  predictor.kind: ar
  predictor.ar_feedback: state
  predictor.ar_copy: true
