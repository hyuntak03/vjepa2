  predictor.ar_feedback: state
  predictor.ar_oneshot: true
  predictor.ar_oneshot_causal: true
vast_ar_oneshot_vidctx_causal:    # 2026-11-04 사용자: 영상 문맥 · 한 번에 예측 (mask token) · 창 정답 · L1 은 mask 자리만 + attention 전부 블록 인과, scratch. vast_ar_oneshot_vidctx 와 attention 만 다르다 (configs/training/natural_ar_vw_state_oneshot_vidctx_causal.yaml)
