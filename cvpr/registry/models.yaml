                                  #   arch kind ar_state · kv_rollout · **dyn_head** (384→1280 보조 head, 손실 dyn_weight 1.0). 우리 로더는 dyn_head 를 모른다 → unexpected key 로 버린다
                                  #   (dyn_head = pixel-diff 보조 손실 head, 추론 때 안 쓴다 — 사용자 확인 10-17. 채점 = render = LN(predictor_proj(상태))). 학습 데이터 K400 + SSv2 + HowTo100M 1 %, prefix_window 문맥 2/4/8 · 예측 4/6/8 블록
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/ariel_eval/ckpt/ar_state_pix_diff_ksh_ep59.pt
  predictor.kind: ar_state
