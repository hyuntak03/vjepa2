# ── vast 브랜치 학습 run (2026-10-13). 채점 경로 = analysis/intphys2/model.py 의 _ArBlockEncoder · _ArScorer
#    (문맥 · 타깃 모두 블록별 LN(target_encoder), 힌트 없이 KV rollout — main 의 ar_scoring.py 와 같은 정의, 구현만 다르다)
vast_ar_vw_hint:                  # 출력 되먹임 + 힌트 (sin² 일정), K710+SSv2+HowTo 1%, 가변 창, 70 ep · 20,580 step
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_hint/latest.pt
  predictor.kind: ar
vast_ar_vw_state:                 # 상태 (384) 되먹임, 힌트 없음
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_state/latest.pt
  predictor.kind: ar
  predictor.ar_feedback: state
vast_ar_vw_state_hint:            # 상태 되먹임 + 힌트 10% 고정 (epoch 1–63), 64–70 차단
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_state_hint/latest.pt
  predictor.kind: ar
  predictor.ar_feedback: state
vast_ar_blockcopy:                # AR 공간 복사 기준선 = 마지막 문맥 블록 LN(h) 를 미래 블록 전부에 (main 의 copy_blk 와 같은 정의). predictor 가중치는 안 쓴다
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_state/latest.pt
  predictor.kind: ar
  predictor.ar_feedback: state
  predictor.ar_copy: true
vast_ar_vw_state_delta:           # 상태 되먹임 + 차이 L1 (loss.delta_weight 1.0), 그 밖 vast_ar_vw_state 와 같다
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_state_delta/latest.pt
  predictor.kind: ar
  predictor.ar_feedback: state
vast_tube_cd64:                   # tube 기준선 (릴리즈 레시피 · oneshot, 16장 상수 lr 63 ep → 64장 cooldown 7 ep). IntPhys1 A.8 82.22
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/k710_ssv2_how_ep70_cooldown64/latest.pt
  predictor.kind: oneshot
vast_ar_vw_state_vob:             # 상태 되먹임 + VOBench 학습 split 10 % (고정 창, 2026-10-15). 평가는 held-out 만
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_state_vob/latest.pt
  predictor.kind: ar
  predictor.ar_feedback: state
vast_ar_vw_state_op:              # 상태 되먹임 + object_permanence 경계 정렬 창 10 % (op320), 2026-10-16
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_state_op/latest.pt
  predictor.kind: ar
  predictor.ar_feedback: state
vast_ar_vw_state_ctxt_video:      # 문맥 = 창 단위 encoder, 예측 구간 블록별 TF + 상태 rollout (kind=ctx_state, 타깃 블록별), 2026-10-16
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_state_ctxt_video/latest.pt
  predictor.kind: ctx_state
  predictor.ctx_target: block
vast_ar_vw_state_ctxt_video_op:   # ctxt_video + op320 경계 10 % (문맥 = 경계 앞 영상, 예측 = 경계부터 블록), 2026-10-17
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_state_ctxt_video_op/latest.pt
  predictor.kind: ctx_state
  predictor.ctx_target: block
vast_ar_vw_state_ctxt_block_gres: # 문맥도 블록별 target_encoder + gate 지름길 (anchor = 마지막 문맥 블록), 2026-10-17
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_state_ctxt_block_gres/latest.pt
  predictor.kind: ctx_state
  predictor.ctx_target: block
  predictor.ctx_encoder: target_encoder
  predictor.ctx_input: block
  predictor.gating_residual: true
vast_ar_vw_state_gres:            # AR (블록 · block-causal · 상태 되먹임) + gate 지름길 (anchor = 마지막 관측 블록), 2026-10-17
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_state_gres/latest.pt
  predictor.kind: ar
  predictor.ar_feedback: state
  predictor.gating_residual: true
vast_ar_vw_state_gres_prev:       # AR + gate 지름길, rollout anchor = 직전 블록 (LN(직전 예측)), 2026-10-18
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_state_gres_prev/latest.pt
  predictor.kind: ar
  predictor.ar_feedback: state
  predictor.gating_residual: true
  predictor.gating_anchor: prev
vast_ar_vw_state_vidctx:          # AR · 문맥 = target_encoder 문맥 pass (영상) · 정답 = 창 전체 pass · TF 문맥 자리만, 2026-10-18
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_state_vidctx/latest.pt
  predictor.kind: ar
  predictor.ar_feedback: state
  predictor.ar_input: video
  predictor.ar_target: window
