vith_g1_phys2d:                   # 2026-10-21. ★ predictor_group — frozen encoder 를 공유해 세 팔을 한 실행에.
  # 왜: wma sliding 경로는 팔마다 같은 ViT-H forward 를 반복한다. 비용의 대부분이 encoder 라
  #     GRASP 4,096 영상 × 3 팔 × 창 2 = 6 h 였다 (2026-10-21 실측, GPU 4 장 100 %).
  #     kind=ar_state 는 encoder 호출이 encode_blocks 한 줄이고 predictor 와 분리돼 있어 공유가 안전하다.
  # 팔마다 **단독 실행과 같은 이름의 폴더**에 summary.json · per_block.json · per_window.json 을 쓴다
  #     (폴더 이름은 resolve.py 가 채운다). 묶음 폴더에는 색인만 남는다.
  # ⚠️ 비트 단위 동치를 확인하고 쓴다: python z_research/scripts/analysis/check_predictor_group.py
  base: vith
  predictor.kind: ar_state
  predictor_checkpoint: ${CVPR_REPO}/z_training/vast/ar_state/latest.pt   # 첫 팔 = 아래 vast_ar_state_ep70
  predictor_group:
    - name: vith_vast_ar_state_ep70      # 출발점 anchor (predictor_checkpoint 생략 = 위 것)
    - name: vith_pft_single_nosup
      predictor_checkpoint: ${CVPR_REPO}/z_vll7_training/runs/phys2d_single_v1_pft_nosup/latest.pt
    - name: vith_pft_single_w005
      predictor_checkpoint: ${CVPR_REPO}/z_vll7_training/runs/phys2d_single_v1_pft_w005/latest.pt

vith_pft_ip2pair:                 # 2026-10-19. 릴리즈 predictor + IntPhys 2 pair train post-FT 20 ep (1,200 step) — predictor 만 (z_training/runs/intphys2_postft_pair)
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/intphys2_postft_pair/latest.pt
vith_pft_ip2pair_lora:            # 2026-10-19. 같은 학습 + context encoder LoRA (r8 α16, qkv·proj·fc1·fc2) — 체크포인트의 encoder_lora 를 로더가 문맥 encoder 에 붙인다 (z_training/runs/intphys2_postft_pair_lora)
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/intphys2_postft_pair_lora/latest.pt
vith_vll7_ar_phys2d:              # 2026-10-19. ★ vll7 **scratch** AR (ar_state, 가변 창) — 데이터 K400 320p + SSv2 + **phys2d_v1**
                                  #   `z_vll7_training/configs/ar_state_vw_phys2d.yaml` · 70 epoch x ipe 294 = 20,580 step · lr 5.2e-4 WSD · 6 GPU
                                  #   predictor 무작위 초기화 (load_predictor: false), encoder 동결 (target_encoder 하나).
                                  #   실측 프레임 비율 k400 57.6 : ssv2 19.4 : phys2d 23.0 (max_window 40 · phys2d weight 0.4 — datasets.md 의 vll7 절)
                                  #   ⚠️ vast `vith_vast_ar_state_ep70` 과 **데이터가 다르다** (vast = K710+SSv2+HowTo, 여기 = K400+SSv2+phys2d) — 한 변수 대조가 아니다.
                                  #      한 변수 대조 짝은 같은 노드의 `ar_state_vw` (phys2d 만 뺀 것) 이고 아직 안 돌렸다.
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_vll7_training/runs/ar_state_vw_phys2d/latest.pt
  predictor.kind: ar_state

# ── predictor_group: frozen encoder 하나 위에 predictor 여러 개 (2026-10-18, EK100 전용) ──────────────────
#   같은 릴리즈 ViT-H (632M) 를 쓰고 predictor (22M) 만 다른 모델들을 **한 실행**으로 돌린다.
#   encoder forward 를 batch 마다 한 번만 하므로 따로 돌릴 때보다 빠르다 (evals/.../MultiAnticipative).
#   결과는 output_dir 의 val_metrics__<name>.jsonl 에 모델마다 따로 쌓인다. kind 는 체크포인트 arch 가 선언한다.
vith_ek100_g4:                    # release · release+pft · ar(vast) · ar(vast)+pft 네 팔
  base: vith
  predictor_group:
  - name: release                     # 릴리즈 predictor (predictor_checkpoint 없음)
  - name: release_vobftg
    predictor_checkpoint: ${CVPR_REPO}/z_training/runs/vobench_release_postft_g/latest.pt
  - name: ar_vast_ep70
    predictor_checkpoint: ${CVPR_REPO}/z_training/vast/ar_state/latest.pt
  - name: ar_vast_vobftg
    predictor_checkpoint: ${CVPR_REPO}/z_training/runs/vobench_vast_ar_state_postft_g/latest.pt
vith_ek100_g5:                    # 2026-10-18. vast 변종 4종 (사용자 지정) + release 기준팔
  base: vith
  predictor_group:
  - name: release                     # anchor — 같은 프로토콜에서 ek100_vith_ek100_g4 의 33.11 을 재현해야 한다
  - name: ar_vast_op                  # object permanence.  kind ar_state
    predictor_checkpoint: ${CVPR_REPO}/z_training/vast/ar_block_ctxt_block_target_op/latest.pt
  - name: ar_vast_vob                 # VOBench.            kind ar_state
    predictor_checkpoint: ${CVPR_REPO}/z_training/vast/ar_block_ctxt_block_target_vob/latest.pt
  - name: ar_vast_gres                # residual gating.    kind ar_state + gating_residual (keep_gate 2 param)
    predictor_checkpoint: ${CVPR_REPO}/z_training/vast/ar_block_ctxt_block_target_residual/latest.pt
  - name: ctx_vast_video              # 문맥 = 창 전체 z.   kind ctx_state (ctx_target block) -> online encoder 를 하나 더 올린다
    predictor_checkpoint: ${CVPR_REPO}/z_training/vast/ar_video_ctxt_block_target/latest.pt
vith_ek100_g6:                    # 2026-10-20. phys2d_single_v1 PFT 두 팔 + 출발점 anchor.
                                  #   ⚠️ 시트 "EK100 subset" 열의 규약은 g4 로 역산해 확정했다 (2026-10-20):
                                  #      cap16metric 부분집합 · HEADS=cap16b96 (head 3) · 20 epoch · global batch 96 · val_every 5,
                                  #      열 U = **lr 별 최댓값** verb mean-class recall@5, 열 V = 같은 식의 noun.
                                  #      g4 의 ar_vast_ep70 head 가 48.9 / 49.0 = 시트 21 행과 **정확히 일치**해 규약을 특정했다.
                                  #   anchor 를 같은 실행에 넣는 이유: g4 와 g5 의 release 팔이 48.7 vs 48.9 로 0.2 pt 흔들린다 —
                                  #      우리가 보려는 차이가 1 pt 규모라 실행 간 드리프트를 안에서 흡수해야 한다.
  base: vith
  predictor_group:
  - name: ar_vast_ep70              # 출발점 anchor. g4 에서 verb 48.9 / noun 49.0 을 재현해야 한다
    predictor_checkpoint: ${CVPR_REPO}/z_training/vast/ar_state/latest.pt
  - name: pft_single_nosup          # 관측만 (state_head null)
    predictor_checkpoint: ${CVPR_REPO}/z_vll7_training/runs/phys2d_single_v1_pft_nosup/latest.pt
  - name: pft_single_w005           # 상태 감독 weight 0.05
    predictor_checkpoint: ${CVPR_REPO}/z_vll7_training/runs/phys2d_single_v1_pft_w005/latest.pt

vith_ar_state_pixdiff:            # 2026-10-15. ariel ar_state + pixel-diff 보조 손실 (z_training/ariel/ar_state_pix_diff_ksh_1e_5, epoch 20). 채점은 dyn_head 를 뺀 latest_eval.pt
  base: vith
  predictor_checkpoint: ${CVPR_REPO}/z_training/ariel/ar_state_pix_diff_ksh_1e_5/latest_eval.pt
  predictor.kind: ar_state
