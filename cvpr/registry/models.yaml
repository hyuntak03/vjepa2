  predictor_checkpoint: ${CVPR_REPO}/z_training/runs/natural_ar_vw_state_oneshot_vidctx/e40.pt
  predictor.kind: ar
  predictor.ar_feedback: state
  predictor.ar_oneshot: true
  predictor.ar_input: video
  predictor.ar_target: window
vast_ar_oneshot_causal:           # 2026-11-11 02:23 KST e15 → e70 이어 학습 (사용자 "이거 해봐", 예측 방식 축 ablation). 11-04 에 e14 에서 멈췄던 판. 블록 문맥판: 한 번에 예측 (mask token) + attention 전부 블록 인과 (문맥 포함). 입력 · 정답 = 블록별 (블록 AR 과 같다). configs/training/natural_ar_vw_state_oneshot_causal.yaml
