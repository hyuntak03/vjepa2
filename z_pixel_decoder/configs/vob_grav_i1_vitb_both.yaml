# Pixel decoder: VOBench_v1 (가림 4 조건) + VOBench gravity + IntPhys1 dev (평가 세트), 블록 latent + 32 장 window latent 둘 다. ViT-B
name: vob_grav_i1_vitb_both
seed: 0
data:
  sources:
    - {index: data_csv/vobench_v1/index.csv, root: /workspace/dataset/benchmarks/VOBench_v1}
    - {index: data_csv/vobench_v1_gravity/index.csv, root: /workspace/dataset/benchmarks/VOBench_v1/gravity}
    - {index: data_csv/intphys1_dev/index.csv, root: /workspace/dataset/benchmarks/IntPhys1/dev,
       pattern: "{block}/{quadruplet}/{run}/scene/scene_{frame:03d}.png", start: 1, n_frames: 100, split_key: block_id}
  stride: 3
  n_frames: 96
  clip_frames: 32
  latent: both
  val_frac: 0.1
  workers: 8
model:
  checkpoint: checkpoint/models--facebook--vjepa2-vith-fpc64-256/snapshots/b5eac8703e3efdc1547fbb6ddfbeb133dc0bdee5/original/model.pth
  dim: 768               # ViT-B (10-20 사용자: S → B)
  depth: 12
  heads: 12
optim:
  steps: 15000          # 5000 → 15000 (10-20 사용자: 5000 에서 PSNR 이 아직 오르는 중). 같은 이름으로 다시 올리면 latest.pt 에서 이어 돈다
  warmup: 250
  batch_size: 4          # GPU 당 clip → 블록 4 × 16 × latent 2 = 128
  lr: 0.0005             # ViT-B 라 S (1e-3) 의 절반
  weight_decay: 0.05
  loss: l1
  lpips: 1.0
  clip: 1.0
eval_every: 250
n_val: 32
