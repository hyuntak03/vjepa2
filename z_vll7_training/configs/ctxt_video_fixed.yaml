# =============================================================================
# context **video** 팔 + **고정 창** — vast natural_ctx_state (2026-09-30) 를 이 노드 데이터로 (2026-10-16)
#
#   GPUS=6 bash z_vll7_training/tmux_train.sh ctxt_video_fixed
#
# 구조는 ctxt_video.yaml 과 같다 (kind=ctx_state, 문맥 = 영상 z, rollout = 상태 되먹임). **샘플링만 고정 창**이다.
# 타깃은 기본 `window` (= 창 전체 LN(h), 릴리즈 채점 정의) — vast 10-01 판은 이것이었고 **우연 수준 (IntPhys1 48.33)** 이었다.
#   ⚠️ 단 vast 10-01 판은 `tf_weight: 0` (rollout 만) 이었다. 여기서는 TF 를 켠다 (10-16 ctxt_video 와 같게) —
#      "TF 없음" 이 원인이었는지 가르려면 SET="loss.tf_weight=0" 로 vast 판을 그대로 재현한다
# 타깃을 블록으로 바꾸려면 SET="model.predictor.ctx_target=block"
# =============================================================================
extends: _vll7_fixed

model:
  context_encoder_key: encoder
  target_encoder_key: target_encoder
  predictor:
    kind: ctx_state
    ctx_target: window                  # 창 전체 LN(h) 의 미래 블록 (릴리즈 채점 정의)
    use_activation_checkpointing: false

loss:
  rollout_steps: 8                      # R = min(K, 8) = K (K 최대 8 블록)
  tf_weight: 1.0
