# =============================================================================
# **제약 크기 상태 감독** — vast AR-state ep70 + phys2d_single_v1 post-FT (2026-10-20, 사용자 지시)
#
#   DRYRUN=1 bash z_vll7_training/train.sh phys2d_single_v1_pft_w005
#   GPU_IDS="0 1" bash z_vll7_training/tmux_train.sh phys2d_single_v1_pft_w005
#   모니터  watch -c -n 5 bash z_vll7_training/monitor_state_head.sh phys2d_single_v1_pft_w005
#
# `phys2d_single_v1_pft_w1_lr3` 에서 **state_head.weight 1.0 -> 0.05** 하나만 바꾼다.
#
# ── 왜 (vast 177291c + 우리 실측) ────────────────────────────────────────────
# vast 는 같은 벽을 먼저 만났고 결론을 커밋에 적어 뒀다:
#   "상태 감독은 **제약**이다 — 영상 latent 로 배우되 지름길로 배우지 말라. 주인공이 되면 안 된다."
#   weight 1.0 · lr x3  : 합성 step predictor gn 2~6 (clip 1.0) vs 자연 0.06~0.09
#                         -> Adam 2 차 모멘트를 합성 step 이 정해 자연 step 갱신이 ~1/5, latent 가 1.25 에서 멈추고 val 50 (margin 0)
#   weight 0.05 · lr x2 : e6 정체 29 % · 집중 46x · val 60.6, latent 가 AR 기준 +0.06 으로 같이 내려간다  <- 채택
#
# 우리 `_w1_lr3` 팔 e1~e9 실측이 같은 모양이다:
#   head 손실 2.31 vs 잠재 L1 0.86 -> 전체 손실의 **73 %** 가 state head
#   predictor gn 중앙 8~12, clip_grad 1.0 -> predictor 는 자기 gradient 의 ~1/10 만 받는다
#   잠재 L1 e1 0.4270 -> e8 0.4185 (8 epoch 에 2.0 %) · VOBench late e1 82.9 -> e8 79.6 (평평, 모양은 하락)
# weight 0.05 면 state 가 전체 손실의 12 % 로 내려가고 gn 이 clip 1.0 근처로 떨어진다 — predictor 가 실제로 움직일 자리.
#
# ⚠️ **lr_mult 는 vast 의 2 를 베끼지 않는다.** vast base lr 은 5.2e-4 (scratch) 라 x2 = head lr 1.0e-3 (그들이 노린 값).
#    우리 base lr 은 5.0e-5 (post-FT) 라 x2 면 1.0e-4 로 10 배 낮아진다. `_w1_lr3` 에서 x3 (head lr 1.5e-4) 로
#    head 가 정체 85 % · TF 15.0 px 까지 발산 없이 갔으므로 **x3 을 유지**한다.
#    vast 자신의 논거 그대로다 — AdamW 는 gradient 크기와 무관하게 lr 만큼 움직이므로 weight 는 head 속도를 안 바꾸고
#    predictor 가 state 손실에 끌려가는 정도만 바꾼다. 그래서 weight 가 단일 변수로 깨끗하다.
#
# ⚠️ vast 의 "합성 gn 이 자연 gn 의 1~3 배" 판정 기준은 **자연 영상 팔이 섞인 run** 의 것이다.
#    이 run 은 100 % phys2d_single 이라 비교할 자연 step 이 없다 — 원리 (제약이어야 한다) 와 손실 구성비만 가져온다.
# ⚠️ 상태 라벨은 관측만으로 얻는 정보가 아니다 — "관측만으로 학습" 주장과 섞지 말 것 (CLAUDE.md §12 Q6).
#    그 주장은 짝 run `phys2d_single_v1_pft_nosup` 에만 쓴다.
# =============================================================================
extends: phys2d_single_v1_pft_w1_lr3

state_head:
  weight: 0.05     # <- 이 run 의 전부 (1.0 에서). lr_mult 3 · clip_separate true · clip_head null 은 부모 그대로
