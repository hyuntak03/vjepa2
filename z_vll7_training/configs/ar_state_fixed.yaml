# =============================================================================
# context **block** 팔 (AR + 상태 되먹임) + **고정 창** (2026-10-16)
#
#   GPUS=6 bash z_vll7_training/tmux_train.sh ar_state_fixed
#
# ctxt_video_fixed 와 **문맥 인코딩만** 다르다 (같은 데이터 · 같은 창 · 같은 (C,K) · 같은 예산):
#   ctxt_video_fixed : 문맥 = context encoder 가 문맥 창을 한 번에 (영상)
#   이 config        : 문맥도 블록마다 따로 target_encoder (블록별)
# 네 조합 (팔 2 x 샘플러 2) 중 "블록 x 고정 창" 자리. 가변 창 판은 ar_state_vw.yaml
# =============================================================================
extends: _vll7_fixed

model:
  context_encoder_key: target_encoder
  target_encoder_key: target_encoder
  predictor:
    kind: ar_state
    kv_rollout: true
    use_activation_checkpointing: false

loss:
  rollout_steps: 8
