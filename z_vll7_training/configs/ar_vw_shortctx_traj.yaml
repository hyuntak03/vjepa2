# =============================================================================
# ar_vw_shortctx + **궤적 보조 손실** (2026-10-22, 사용자 결정 "optical flow 로 supervision, traj 로")
#
# ar_vw_shortctx 와 **데이터 · 격자 · lr · step 수가 전부 같다.** 더해진 것은 두 가지뿐:
#   1. data.var_window.flow      미리 뽑아 둔 RAFT flow 캐시에서 블록마다 궤적 라벨을 싣는다
#   2. flow_head                 predictor 출력 토큰 → 지평선 4 개의 누적 변위 (LayerNorm + Linear, 1 만 파라미터)
#
# ⚠️ 한 변수 대조가 **아닌** 점 하나: flow 를 켜면 창 시작이 fps 4 격자에 맞춰진다 (snap_start).
#    ar_vw_shortctx 는 원본 장 단위로 시작했으므로 시간 위상 표본이 다르다 (k400 fstp 7 → 7 가지 → 1 가지).
#    깨끗한 대조군은 **같은 config 에서 손실만 끈 것**이다:
#      SET="flow_head=null data.var_window.flow=null data.var_window.snap_start=true" \
#      GPUS=4 bash z_vll7_training/tmux_train.sh ar_vw_shortctx_traj
#
# 왜 궤적인가 (순간 flow 가 아니라) — 실측 2026-10-22, k400 395 편 · ssv2 130 편:
#   순간 flow: 마지막 문맥 flow 와 미래 flow 의 cos 가 0.25 s 0.32 / 0.5 s 0.11 / 0.75 s 이후 0.04.
#              부호 대칭이라 L1 최적 상수가 0 (0 예측 0.430 < 복사 0.581) → head 가 "0 을 내라" 만 배운다.
#   누적 변위: 등속 외삽과 진짜 궤적의 cos 가 0.5 s 0.78 / 1 s 0.56 / 2 s 0.39 / 4 s 0.26 — 방향이 오래 남는다.
#              그런데 크기는 등속이 아니다 (등속 L1 / 0 예측 L1: 0.5 s 0.53 → 4 s 2.49, 2.5 배 과하다).
#   => 궤적은 "방향은 이어지고 크기는 꺾인다" 를 묻는다. 그게 배울 게 남은 부분이다.
#
# ⚠️ 이 손실이 **가르치지 않는 것** (결론과 같은 비중으로 적는다):
#   * 영속 — 가려진 물체에는 flow 가 없다 (유효 마스크가 지운다). 영속은 이 손실 밖이다.
#   * 카메라 — k400 · ssv2 운동장은 카메라 운동이 크게 섞여 있다. 궤적이 맞았다고 물체 물리를 배운 게 아니다.
#   * 라벨은 RAFT 추정치다. fps 4 (0.25 s) 는 RAFT 학습 간격보다 훨씬 크다 — 전후 일관성 검사가
#     틀린 자리를 지우지만, 지워진 자리는 "움직임 0" 이 아니라 "라벨 없음" 이다.
#   유효 비율 실측: 지평선 1 장 0.89 → 8 장 0.54 (멀수록 라벨이 적다).
#
# 반드시 같이 읽을 로그 (CLAUDE.md §12 Q5 복사 기준선):
#   c<h> = 등속 외삽의 상대 L1 (파라미터 0). l<h> = head 의 상대 L1. **l < min(1, c)** 여야 배운 것이다.
#   (l, c 는 둘 다 "0 을 예측했을 때" 로 나눈 값이라 1.0 = 0 예측과 같음. c1 은 정의상 0 이다 — 보지 말 것)
# =============================================================================

extends: ar_vw_shortctx

data:
  num_workers: 14             # 10 → 14 (스모크에서 flow 라벨 NFS 읽기로 데이터 대기가 GPU 시간과 맞먹었다).
                              #   ⚠️ 결과에는 영향이 없다 — var_window 의 (C, K, 데이터셋, B, 영상) 은 (seed, step, rank) 만으로 정해지고
                              #      worker 는 step 을 나눠 맡을 뿐이다. 속도 노브다
  var_window:
    snap_start: true          # flow 를 켜면 자동이지만 명시한다 (대조군에서 손으로 켜야 하므로)
    flow:
      grid: 16                # 토큰 격자와 같게 (16×16). 캐시는 32×32 로 저장돼 있고 자른 뒤 여기로 줄인다
      patch: 16               # 단위 = 패치 폭 (= 256 / 16)
      horizons: [1, 2, 4, 8]  # **라벨로 싣는** 지평선. 첫 항 (1 장) 은 감독하지 않고 등속 기준선 재료로만 쓴다
                              #   (flow_head.supervise 를 볼 것). fps 4 장. 앵커 = 블록 b 의 **마지막 장** (2b+1) 이라 h 2 / 4 / 8 은
                              #   정확히 **1 · 2 · 4 블록 앞** (0.5 · 1 · 2 s). 전부 블록 경계에 떨어진다.
                              #
                              # 왜 블록 '안' 이 아니라 블록 '간' 인가:
                              #   tubelet 2 라 타깃 encoder 의 블록 토큰은 그 두 장을 그대로 담는다 —
                              #   **블록 안의 움직임은 이미 타깃 토큰 안에 있다.** 그걸 보조 손실로 걸면
                              #   latent 손실이 이미 요구하는 성분에 가중치만 다시 주는 것이고 새로 묻는 게 없다.
                              #   블록 간은 타깃 토큰에 **없는** 것을 묻는다 ("이 내용이 다음 블록에 어디 가 있나").
                              #   그 중 일부는 블록 안 속도의 외삽 (= 등속) 이고, 나머지가 찾는 부분이다.
                              # ⚠️ 그래서 긴장이 생긴다 — 목표가 h_b 에 없으므로 보조 손실이 p_b 를 latent 목표에서
                              #   약간 당겨 낸다. 가중치 0.1 이면 괜찮을 것으로 보지만 **추측이다**.
                              #   대조군 대비 latent 손실이 오르는지 봐야 한다 (모니터에 latent 를 같이 찍는다).
                              #
                              # 뺀 것 [실측 2026-10-22, 실물 캐시 k400 400 편 · 등속L1/0예측L1 · 유효칸]:
                              #   h 1  (반 블록)  등속 0.00 (정의상 퇴화, 비교 기준 없음) · 88.5 %  → 뺀다
                              #   h 2  (1 블록)   0.58 · 78.9 %      h 4 (2 블록) 1.13 · 66.7 %
                              #   h 8  (4 블록)   1.79 · 52.8 %
                              #   h 16 (8 블록)   2.66 · 39.5 %  → 진단력은 제일 좋지만 **ssv2 가 못 채운다**
                              #        (ssv2 중앙 15 장). 그 항만 k400 전용이 되어 손실이 카메라 운동 쪽으로 기운다
      roots:
        k400: ["/data/hyuntak/flow_cache/vll7_k400_320/s0", "/data/hyuntak/flow_cache/vll7_k400_320/s1",
               "/data/hyuntak/flow_cache/vll7_k400_320/s2", "/data/hyuntak/flow_cache/vll7_k400_320/s3"]
        ssv2: ["/data/hyuntak/flow_cache/vll7_ssv2/t0", "/data/hyuntak/flow_cache/vll7_ssv2/t1",
               "/data/hyuntak/flow_cache/vll7_ssv2/t2", "/data/hyuntak/flow_cache/vll7_ssv2/t3",
               "/data/hyuntak/flow_cache/vll7_ssv2/t4", "/data/hyuntak/flow_cache/vll7_ssv2/t5",
               "/data/hyuntak/flow_cache/vll7_ssv2/t6", "/data/hyuntak/flow_cache/vll7_ssv2/t7"]
                              # ⚠️ ssv2 는 shard 8 개 (t0~t7) — 추출을 k400 과 동시에 돌리려고 늘렸다.
                              #    k400 은 4 개 (s0~s3). FlowCache 가 경로 → shard 색인으로 합친다

flow_head:
  supervise: [2, 4, 8]        # 손실을 거는 지평선 = 1 · 2 · 4 블록. h 1 은 뺀다 —
                              #   등속 기준선이 d_h = (h/h0)·d_h0 이라 h0 자리는 정의상 0 이 되어 비교가 안 된다.
                              #   빼 두면 **감독하는 세 칸 모두 제대로 된 파라미터 0 기준선**을 갖는다
                              #   (실측 등속/0예측: 1 블록 0.58 · 2 블록 1.13 · 4 블록 1.79 — 1 블록이 가장 어렵다)
  hidden: 0                   # LayerNorm + Linear(1280 → 8). 1 만 파라미터 — 일부러 작게 뒀다.
                              #   큰 head 를 쓰면 "predictor 토큰이 운동을 담는가" 가 아니라
                              #   "head 가 뽑아낼 수 있는가" 를 재게 된다 (CLAUDE.md §7-3 학습된 자).
  weight: 0.1                 # 초기 latent 손실 1.09 · 궤적 손실(상대) ~1.2 → 궤적이 전체의 ~10 %.
                              #   0.03 대조군을 같이 돌릴 것 (가중치가 결론을 만드는지 보려고)
  split: {tf: 1.0, ar: 1.0}   # TF 자리 (한 걸음) 와 rollout 자리 (여러 걸음) 를 같은 가중으로
  norm: auto                  # 지평선마다 batch 평균 |d| 로 나눈다 (gradient 없음). 고정하려면 숫자 목록
  lr_mult: 10                 # head 만 lr ×10 (state_head 와 같은 관례)
  clip_separate: true         # clip 은 predictor 에만 (gn = predictor norm)
  clip_head: 1.0              # ⚠️ vast 에서 clip 없이 head lr ×10 으로 epoch 4 에 predictor 가 무너졌다
