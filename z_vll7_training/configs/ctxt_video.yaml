# =============================================================================
# ctxt_video — **문맥은 영상 한 번, 예측 구간은 블록별 TF + 상태 rollout** (vast natural_ar_vw_state_ctxt_video 이식, 2026-10-16)
#
#   GPUS=6 bash z_vll7_training/tmux_train.sh ctxt_video
#
# 구조 (kind=ctx_state; src/models/rollout_predictor.py mask_mode=ctx_state, app/vjepa_frozen/ar.py ctx_state_losses)
#   * 문맥 C 블록 = context encoder (`encoder`) 로 **문맥 창 전체를 한 번에** -> z (시간 맥락이 섞인 토큰) + type[0]
#   * 예측 구간 K 블록 = target_encoder 를 **블록마다 따로** -> LN(h). TF 입력 (관측, type[1]) 이자 **타깃** (`ctx_target: block`)
#     — encoder 가 시간 양방향이라 예측 구간을 영상으로 넣으면 블록 b 토큰이 b+1 을 본다 (TF 누수). 그래서 미래만 블록별
#   * TF: z + 관측 블록 0..K-2 -> 블록 0..K-1 예측 (예측 구간만, 한 forward). rollout: z 에서 상태 (predictor_norm, 384, type[2])
#     되먹임 R = min(K, 16) 블록 (KV 캐시판 — 전체 재계산판과 값 · grad 동일, z_vll7_training/tests/ctx_state_cpu_test.py 로 확인)
#     TF 의 첫 자리 (문맥만 보고 블록 0) 는 rollout 첫 걸음과 같은 계산 — 블록 0 손실이 두 번 들어간다 (vast 와 같게 그대로 둔다)
#
# ⚠️ **vast 에서 이 팔은 복사 기준선보다 낮았다** (`git show 73ae468:z_training/RESULTS_2026-10-16.md` §3):
#     IntPhys1 A.8 최고 76.11 (AR 90.00) · VOBench 전체 P/R 57.1 / 62.1 (**블록 복사 기준선 77.8 / 81.1**).
#     가림이 없는 장면부터 무너졌고, 학습 손실은 AR 과 거의 같았다 (e70 TF 0.531 / rollout 0.559 vs AR 0.534 / 0.550).
#     원인은 **모른다** (문서가 사후 해석 셋을 후보로만 적었다). 이 config 는 **vll7 대조군**이다 — 본 run 은 ctxt_video_tgtvideo.
# ⚠️ vast 와 데이터가 다르다 (K710 + SSv2 + HowTo -> K400 + SSv2) — 수치를 직접 비교하지 말 것. _vll7_vw.yaml 의 비율 메모 참고
# =============================================================================
extends: _vll7_vw

model:
  context_encoder_key: encoder          # 문맥 = online encoder (릴리즈 채점과 같은 역할 분리)
  target_encoder_key: target_encoder
  predictor:
    kind: ctx_state
    ctx_target: block                   # 타깃 = 예측 구간 블록별 LN(h) (= TF 관측과 같은 공간)
    use_activation_checkpointing: false # ⚠️ vast: 켜면 VRAM 31-52 GB · step 약 3 배 느림. 끄고 최대 창 75.4 GB / 1.59 s/step

loss:
  rollout_steps: 16                     # R = min(K, 16) = K — 예측 구간 전부 rollout
  tf_weight: 1.0
