app: vjepa_frozen
nodes: 1
tasks_per_node: 4
meta:
  seed: 0
  dtype: bfloat16
  encoder_dtype: bfloat16
  use_sdpa: true
  log_freq: 10
  save_every_freq: 5
  auto_resume: true
  compile_encoders: true
  sync_masks: true
model:
  base: vith
  img_size: 256
  patch_size: 16
  tubelet_size: 2
  use_rope: true
  uniform_power: false
  context_encoder_key: target_encoder
  target_encoder_key: target_encoder
  load_predictor: true
  mask_index: 0
  predictor:
    embed_dim: 384
    depth: 12
    num_heads: 12
    num_mask_tokens: 10
    use_activation_checkpointing: false
    zero_init_mask_tokens: true
    kind: ar_state
    n_registers: 0
    kv_rollout: true
  predictor_init_checkpoint: /data/hyuntak/project/2026/2027_cvpr/vjepa2/z_training/vast/ar_state/latest.pt
  arch_name: vit_huge
  checkpoint: /data/hyuntak/project/2026/2027_cvpr/vjepa2/checkpoint/models--facebook--vjepa2-vith-fpc64-256/snapshots/b5eac8703e3efdc1547fbb6ddfbeb133dc0bdee5/original/model.pth
data:
  n_frames: 32
  resolution: 256
  batch_size: 32
  num_workers: 6
  pin_mem: true
  persistent_workers: true
  datasets:
  - type: phys2d_sup
    csv: /data/hyuntak/project/2026/2027_cvpr/vjepa2/data_csv/phys2d_single_v1/train_clips.csv
    decord_threads: 1
    weight: 0.93
    name: phys2d_single_v1_state
  - type: phys2d_sup
    csv: /data/hyuntak/project/2026/2027_cvpr/vjepa2/data_csv/phys2d_single_v1/train_bnd_T32C16s1.csv
    decord_threads: 1
    weight: 0.07
    name: phys2d_single_v1_state_bnd
  aug:
    hflip_p: 0.5
    square_crop: none
  prefetch_factor: 2
  transfer_uint8: true
  loader_timeout_s: 600
mask:
- type: prefix_window
  context_blocks:
  - 8
  predict_blocks:
  - 8
  weight: 1.0
loss:
  loss_exp: 1.0
  target_layer_norm: true
  rollout_steps: 8
optimization:
  epochs: 15
  ipe_scale: 1.0
  lr: 5.0e-05
  start_lr: 1.0e-06
  final_lr: 1.0e-06
  warmup: 1
  weight_decay: 0.04
  final_weight_decay: 0.04
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  clip_grad: 1.0
  grad_accum: 1
  ipe: 300
val:
  dataset: vobench_v1_late
  n_blocks_per_type: 36
  context_length: 16
  batch_size: 8
  every_epochs: 1
  at_start: true
  seed: 0
  n_frames: 32
  data:
    root: /data/hyuntak/project/2026/2027_cvpr/vjepa2/data_csv/vobench_v1_late
    index_csv: index.csv
    frames_root: /local_datasets/world/testbed/VOBench_v1
    frames_pattern: '{file_name}/{frame:06d}.png'
    frames_start: 0
    frames_stride: 3
    block_column: block_id
    pair_column: pair_id
    plausible_column: plausible
    type_column: condition
    variant_column: variant
folder: /data/hyuntak/project/2026/2027_cvpr/vjepa2/z_vll7_training/runs/phys2d_single_v1_pft_nosup
