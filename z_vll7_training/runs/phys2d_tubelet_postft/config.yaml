app: vjepa_frozen
nodes: 1
tasks_per_node: 6
meta:
  seed: 0
  dtype: bfloat16
  encoder_dtype: bfloat16
  use_sdpa: true
  log_freq: 10
  save_every_freq: 5
  auto_resume: true
  compile_encoders: true
  sync_masks: true
model:
  base: vith
  img_size: 256
  patch_size: 16
  tubelet_size: 2
  use_rope: true
  uniform_power: false
  context_encoder_key: encoder
  target_encoder_key: target_encoder
  load_predictor: true
  mask_index: 0
  predictor:
    embed_dim: 384
    depth: 12
    num_heads: 12
    num_mask_tokens: 10
    use_activation_checkpointing: false
    zero_init_mask_tokens: true
  arch_name: vit_huge
  checkpoint: /data/hyuntak/project/2026/2027_cvpr/vjepa2/checkpoint/models--facebook--vjepa2-vith-fpc64-256/snapshots/b5eac8703e3efdc1547fbb6ddfbeb133dc0bdee5/original/model.pth
data:
  n_frames: 16
  resolution: 256
  batch_size: 16
  num_workers: 6
  pin_mem: true
  persistent_workers: true
  datasets:
  - type: video_csv
    csv: /data/hyuntak/project/2026/2027_cvpr/vjepa2/data_csv/phys2d_v1/train_clips.csv
    frame_step: 1
    decord_threads: 1
    name: phys2d_v1_clips
  aug:
    hflip_p: 0.5
    square_crop: none
  prefetch_factor: 2
  transfer_uint8: true
  loader_timeout_s: 600
mask:
- type: block3d
  spatial_scale:
  - 0.15
  - 0.15
  temporal_scale:
  - 1.0
  - 1.0
  aspect_ratio:
  - 0.75
  - 1.5
  num_blocks: 8
  max_temporal_keep: 1.0
  weight: 0.5
- type: block3d
  spatial_scale:
  - 0.7
  - 0.7
  temporal_scale:
  - 1.0
  - 1.0
  aspect_ratio:
  - 0.75
  - 1.5
  num_blocks: 2
  max_temporal_keep: 1.0
  weight: 0.5
loss:
  loss_exp: 1.0
  target_layer_norm: true
optimization:
  epochs: 10
  ipe: 1024
  ipe_scale: 1.0
  lr: 5.0e-05
  start_lr: 1.0e-06
  final_lr: 1.0e-06
  warmup: 1
  weight_decay: 0.04
  final_weight_decay: 0.04
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  clip_grad: null
  grad_accum: 1
val:
  dataset: intphys1_dev
  n_blocks_per_type: 10
  context_length: 8
  batch_size: 4
  every_epochs: 1
  at_start: true
  seed: 0
  n_frames: 16
  data:
    root: /local_datasets/world/world_analysis/IntPhys1_dev_videos
    index_csv: index.csv
    frames_root: /local_datasets/world/world_analysis/IntPhys1_dev_frame_png
    frames_pattern: '{block}/{quadruplet}/{run}/scene/scene_{frame:03d}.png'
    frames_start: 1
    frames_stride: 6
    block_column: block_id
    pair_column: pair_id
    plausible_column: plausible
    type_column: block_type
    variant_column: variant
folder: /data/hyuntak/project/2026/2027_cvpr/vjepa2/z_vll7_training/runs/phys2d_tubelet_postft
