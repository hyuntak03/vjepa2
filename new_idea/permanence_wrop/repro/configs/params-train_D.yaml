app: vjepa_frozen
data:
  aug:
    hflip_p: 0.5
    random_resized_crop:
      ratio:
      - 0.75
      - 1.35
      scale:
      - 0.5
      - 1.0
  batch_size: 16
  datasets:
  - csv: /workspace/world_model/vjepa2/data_csv/ssv2/train_min32.csv
    filter_short_videos: true
    frame_step: 1
    name: ssv2_fs1_min32
    type: video_csv
    weight: 1.0
  - csv: /workspace/world_model/vjepa2/data_csv/wrop_uni32/train_nonop.csv
    filter_short_videos: true
    frame_step: 1
    name: wrop_nonop_uni32
    type: video_csv
    weight: 1.0
  n_frames: 32
  num_workers: 5
  persistent_workers: true
  pin_mem: true
  resolution: 256
folder: /workspace/world_model/vjepa2/z_training/runs/permanence_wrop_D
loss:
  loss_exp: 1.0
  target_layer_norm: true
mask:
- context_frames:
  - 16
  type: temporal_prefix
  weight: 1.0
meta:
  auto_resume: true
  dtype: bfloat16
  encoder_dtype: bfloat16
  log_freq: 10
  save_every_freq: 5
  seed: 0
  use_sdpa: true
model:
  arch_name: vit_huge
  base: vith
  checkpoint: /workspace/world_model/vjepa2/checkpoint/models--facebook--vjepa2-vith-fpc64-256/snapshots/b5eac8703e3efdc1547fbb6ddfbeb133dc0bdee5/original/model.pth
  context_encoder_key: encoder
  img_size: 256
  load_predictor: true
  mask_index: 0
  patch_size: 16
  predictor:
    depth: 12
    embed_dim: 384
    num_heads: 12
    num_mask_tokens: 10
    use_activation_checkpointing: false
    zero_init_mask_tokens: true
  target_encoder_key: target_encoder
  tubelet_size: 2
  uniform_power: false
  use_rope: true
nodes: 1
optimization:
  anneal_epochs: 4
  betas:
  - 0.9
  - 0.999
  clip_grad: null
  epochs: 20
  eps: 1.0e-08
  final_lr: 1.0e-06
  final_weight_decay: 0.04
  ipe: 200
  ipe_scale: 1.0
  lr: 5.0e-05
  start_lr: 1.0e-06
  warmup: 1
  weight_decay: 0.04
tasks_per_node: 8
val:
  at_start: true
  batch_size: 8
  context_length: 16
  data:
    block_column: block_id
    frames_pattern: '{file_name}/{frame:06d}.png'
    frames_root: /workspace/dataset/benchmarks/VOBench_v1
    frames_start: 0
    frames_stride: 3
    index_csv: index_test_late.csv
    pair_column: pair_id
    plausible_column: plausible
    root: /workspace/world_model/vjepa2/data_csv/vobench_v1_split_v2
    type_column: condition
    variant_column: variant
  dataset: vobench_v1_split_v2_test_late
  every_epochs: 2
  n_blocks_per_type: 36
  seed: 0
