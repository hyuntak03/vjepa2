# =============================================================================
# natural_ar_vw_state_phys2d — 블록 AR + phys2d_sup_v2 (2D 합성 물리) + 상태 감독 (2026-10-19, 사용자 지시)
#
# 기준 AR (natural_ar_vw_state) 에 키 두 개만 더한다:
#   data.var_window.boundary — step 의 p 비율을 phys2d_sup_v2 경계 행으로 (예측 첫 장 = 사건 경계).
#                              labels: phys2d_sup 이면 같은 창의 상태 라벨이 info["labels"] 로 실린다
#   state_head               — predictor 출력 (TF: 문맥 포함 블록 1.., rollout: 블록 C..) (T·N, D) 을
#                              정체 query 48 개 (모양 6 × 색 8) 로 attention pooling → 블록마다 (48, D) →
#                              exist (BCE) · 위치 x, y (L1) · 속도 cos, sin, 크기 (L1). 라벨 = tubelet 마지막 장.
#                              감독은 합성 step 에만 (자연 영상 step 은 head 를 안 쓴다). main 425d67d 의 state_head 이식
# 끄기: SET="state_head=null" (데이터만) · SET="data.var_window.boundary=null state_head=null" (= 기준 AR)
# =============================================================================
extends: natural_ar_vw_state

data:
  var_window:
    boundary:
      name: phys2d_sup_v2
      p: 0.10
      manifest: /workspace/dataset/training_data/phys2d_sup_v2/train/boundary.tsv
      stride: 1
      context_frames: [4, 8, 16]
      predict_frames: 16
      crop_ratio: [1.0, 1.0]        # 좌표 라벨 — 자르기 금지
      hflip_p: 0.0                  # 반전 끔 (사용자 결정 10-19). 켜면 영상 · 라벨이 같이 반전된다
      labels: phys2d_sup

optimization:
  clip_grad: 1.0                # 10-19 실측: 자연 step grad norm 0.25~0.85, 합성 step 13~15 (head 손실) → 1.0 은 합성 step 만 자른다

state_head:
  weight: 1.0
  w: {exist: 1.0, pos: 1.0, vel: 1.0}
  split: {tf: 1.0, ar: 1.0}
  lr_mult: 1                    # 10 → 1 (10-19): lr ×10 head 와 clip 없음으로 epoch 4 에 predictor 가 무너졌다 (_natural_ar_vw_state_phys2d_collapsed_e4)
  num_heads: 16
  hidden: 512
