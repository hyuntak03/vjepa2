# 2026-11-09 사용자 "release + v4bc4 + negative loss p = 0.2 이것도 학습" — 릴리즈 predictor 출발, AR 최고 통과판과 같은 음성 비율.
#   v4bc4_release_negimp (릴리즈 · 원래 음의 손실 λ 1) 와 음성 종류만 다르다: 사라짐 (물체 문맥 p 0.5) + 나타남 (빈 문맥 p 0.2), 바꿔치기 없음.
#   기준 = 릴리즈 + v4bc4 L1 만 (v4bc4_release_postft, 레지스트리 vith_release_v4bc4). val = real world permanence 매 epoch (릴리즈 쪽 부모 val 에는 프레임 키가 없어 null 삭제 줄을 뺐다 — 남기면 None 으로 남아 죽는다).
#   GPUS=8 bash z_training/tmux_train.sh v4bc4_release_negimp_vanish_app02
extends: v4bc4_release_negimp

negimp:
  p: 0.2
  p_object_ctx: 0.5
  swap_frac: 0.0

val:                            # 2026-11-08 사용자 "training val 로 real bench 성능 보여주도록" — 95 장면 × 4 = 380 클립 (채점기와 같은 로더), 매 epoch — 95 장면 × 4 = 380 클립 (채점기와 같은 로더 · 같은 창), 매 epoch (약 34 초)
  dataset: null
  n_frames: 32
  context_length: 16
  batch_size: 4
  every_epochs: 1
  at_start: true
  n_blocks_per_type: 1000
  seed: 0
  data:
    root: ${DATA_CSV}/real_world_permanence_uniform
    index_csv: index.csv
    video_root: /workspace/dataset/benchmarks/real_world_permanence
    frames_index_column: frames
    block_column: block_id
    pair_column: pair_id
    plausible_column: plausible
    variant_column: variant
    type_column: condition
