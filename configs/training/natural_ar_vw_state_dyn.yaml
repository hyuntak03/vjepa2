# =============================================================================
# natural_ar_vw_state + 움직임 크기 손실 (2026-10-14, 사용자 결정)
#
#   GPUS=8 bash z_training/tmux_train.sh natural_ar_vw_state_dyn
#
# 손실 = TF L1 + rollout L1 (기존) + dyn_weight · L_dyn
#   b_t = ‖PE(x_{t+1}) − PE(x_t)‖₂ / batch 평균  (토큰별 스칼라, PE = encoder patch embedding 직후 = 픽셀 2 장의 국소 선형 투영)
#   a_t = Linear(384 → 1)( |s_{t+1} − s_t| )      (s = predictor 상태 = predictor_norm 출력, 이웃 블록)
#   L_dyn = teacher forcing 이웃 위치 쌍 + rollout 이웃 걸음 쌍 전부의 평균 |a_t − b_t|
# 왜: 복사로 때우면 s_{t+1} ≈ s_t → a ≈ 0 인데 픽셀이 실제로 변한 곳은 b 가 크다 — 변하는 곳의 복사를 직접 벌한다
#   토큰별 스칼라로 줄인 이유 = 1280 차원 전부 맞히면 압축 잡음 · 조명 깜빡임까지 따라간다 (방향 버전 = 고정 PCA-k 는 다음 단계)
# 그 밖 (데이터 · 창 (C/K) · step · lr · seed) 은 natural_ar_vw_state 와 같다 — 같은 batch 순서라 epoch 별로 직접 비교된다
# dyn_head 는 학습 전용 — 채점 (analysis/intphys2/model.py) · EK100 래퍼는 dyn_head.* 를 버린다
# =============================================================================
extends: natural_ar_vw_state

model:
  predictor:
    dyn_head: true

loss:
  dyn_weight: 0.5
