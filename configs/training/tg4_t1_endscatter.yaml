# =============================================================================
# transfer_gap R4 [X2] 진단 PFT — T1 끝 자리를 흩뜨린 PFT (2026-10-30). tg4_t0_s0 에서 **"끝 자리 분포" 한 축** 만 바꾼다.
#   NODE=vll3 GPUS=4 CPUS_PER_GPU=8 MEM_PER_GPU=40G TIME=0-03:00:00 bash z_training/sbatch.sh tg4_t1_endscatter
#
# 왜: R3 E35 — VOBench PFT 는 다시 나타나는 물체의 뒤쪽 미래 가로 자리를 학습셋 시간표 (보폭 3 에서 그 튜블릿의 화면 자리) 에 둔다.
#     학습셋 궤적이 늘 같은 화면 범위 · 같은 시간표라 그 사전이 생겼는지 가른다 (Q3_PFT_TRANSFER_R2.md §16 시험 1).
# 바꾸는 것 (끝 자리를 흩뜨리는 두 손잡이, 둘 다 같은 축):
#   (a) 시간: 클립마다 보폭 3 (시작 0/1/2) 또는 보폭 2 (시작 15/16/17) 를 반반. 문맥 끝 원프레임은 두 보폭 모두 45–47 이라
#       문맥 끝 가림 (late) 의 구조가 유지된다 (VOBench late 가림 = 문맥 끝 k 샘플 · 미래 앞 k 샘플, 원프레임 45 근처).
#       보폭 2 이면 미래 끝이 원프레임 77–79 라 물체가 덜 간 자리에서 끝난다.
#   (b) 화면: 무작위 정사각 잘라 옮기기 (넓이 0.6–1.0 = 한 변 0.77–1.0) → 256. ⚠️ 256² 사본에서 자르므로 업샘플이다.
# 학습량은 T0 와 같다: optimization.ipe 25 × 30 epoch = 750 step (데이터셋이 두 항목이라 길이가 1,656 → 고정 ipe 로 맞춤).
# =============================================================================
extends: tg4_t0_s0

data:
  datasets:
    - {name: vobench_split2g_train, weight: 0.5,
       frames_root: /data/hyuntak/project/2026/2027_cvpr/vjepa2/z_pixel_decoder/runs/_frames/VOBench_v1_256full}
    - {name: vobench_split2g_train, weight: 0.5, frames_stride: 2, frames_start: 15, frames_start_choices: [15, 16, 17],
       frames_root: /data/hyuntak/project/2026/2027_cvpr/vjepa2/z_pixel_decoder/runs/_frames/VOBench_v1_256full}
  aug:
    hflip_p: 0.5
    random_resized_crop: {scale: [0.6, 1.0], ratio: [1.0, 1.0]}

optimization:
  ipe: 25
