# =============================================================================
# 팔 D'' — **릴리즈 사전학습 규격 그대로 (tube 마스크, 16 장 @ fps 4)**, 예산만 natural_ctx_state 와 같게 (2026-09-30, 사용자 결정)
#
#   GPUS=8 bash z_training/tmux_train.sh natural_tube_k710
#
# natural_tube_pretrain (릴리즈 레시피: 16 장 @ fps 4, short 8×0.15 + long 2×0.7 tube 를 매 step 둘 다, hflip + RRC [0.3,1.0])
# 에서 **배치·예산·lr·데이터 비율**만 natural_ctx_state (rollout baseline) 에 맞춘다:
#   8 GPU × 64 = global 512, 40 × 294 = 11,760 step (602 만 clip), lr 5.2e-4 (= 3e-4 × sqrt(512/168)), warmup 1 epoch → cosine 1e-6
#   데이터: natural_ctx_state 와 같다 — K710 (fps 4) : SSv2 (frame_step 1) = 1 : 1 (릴리즈 0.335 : 0.100 은 안 쓴다. HowTo100M 없음)
# natural_ctx_state 와 다른 것 (의도): 창 16 장 (릴리즈 규격. ctx_state 는 32 장 — 그래서 clip 당 시간이 K710 4 s / SSv2 1.3 s),
#   증강에 square_crop 없음 (릴리즈 make_transforms), predictor = 릴리즈 위상 (oneshot + mask token)
# 메모리: 16 장 × batch 64 는 재계산 없이 ~52 GB (2026-09-29 K400 실측) → use_activation_checkpointing false (상속)
# (2026-09-30 첫 판은 32 장 창이었다 — 사용자 지시로 공식 16 장으로 되돌림)
# =============================================================================
extends: natural_tube_pretrain

data:
  batch_size: 64              # rank 당. 8 GPU = global 512
  datasets:                   # ★ natural_ctx_state 와 **같은 데이터·같은 샘플링 규칙** (2026-09-30 사용자 지시)
    - {name: k710_320_fps4_min224, weight: 1.0}   # K710 fps 4 (원본 224 장 이상 510,957 편). 16 장 = 4 s
    - {name: ssv2_fs1_min32,       weight: 1.0}   # SSv2 frame_step 1 (원본 32 장 이상 185,229 편). 16 장 = 1.3 s

optimization:
  epochs: 40
  ipe: 294                    # 40 × 294 = 11,760 step × 512 = 602 만 clip (ctx_state 와 같다)
  lr: 5.2e-4
  start_lr: 1.0e-5
  final_lr: 1.0e-6
  warmup: 1
