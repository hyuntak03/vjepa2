# =============================================================================
# 무엇: v4vc_ar_vw_state_postft (AR 기본판 natural_ar_vw_state 출발 · v4vc 11,250 편 · 전역 48 × 2,000 step) 에 입력 경로 encoder LoRA (블록별 target_encoder 복사본) 를 붙여 같이 학습. 손실 · 채점 타깃 encoder 는 얼림.
# 왜: 2026-11-02 사용자 "context encoder LoRA 붙여서 같이 학습 ... sheet 에 있는 것들 다" (시트 "AR └ V4" 행). AR 은 입력 · 타깃이 같은 encoder 라 입력 경로 복사본에만 단다 (intphys2_vuni_ar_vw_state_postft_lora 와 같은 방식).
# 비교: v4vc_ar_vw_state_postft (vast_ar_vw_state_v4vc). 다른 것은 LoRA 하나.
#
#   GPUS=8 bash z_training/tmux_train.sh v4vc_ar_vw_state_postft_lora
# LoRA 설정은 intphys2_vuni_ar_vw_state_postft_lora 와 같다. ⚠️ lr ×10 은 2026-11-02 train.py 수정 뒤에야 WarmupCosine 에서도 실제로 곱해진다.
# =============================================================================
extends: v4vc_ar_vw_state_postft

model:
  encoder_lora:
    rank: 8
    alpha: 16
    targets: [qkv, proj, fc1, fc2]
    lr_mult: 10
    act_ckpt: true
