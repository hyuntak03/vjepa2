# 2026-11-09 사용자 "자연 영상 섞어서 해봐야 되나? ssv2 (L1 만, 진짜 그대로 negative 없이)" — v4bc4 0.8 + SSv2 0.2 (자연 영상은 음성 없이 L1 만, negimp_off).
#   앞선 v4bnat (v4b 0.5 + K710 0.25 + SSv2 0.25, λ 1) 은 합성은 지키고 real 61.6 · IP2 43.3 으로 이득이 사라졌다 — 이번엔 SSv2 만 20 %, 데이터 v4bc4.
#   SSv2 = ssv2_fs1_min32 (v4bnat 과 같은 목록 · 간격).
#   L1 만 기준판 (같은 섞기, 음의 손실 없음).
#   GPUS=8 bash z_training/tmux_train.sh v4bc4ssv2_ar_vw_state_postft
extends: v4bc4_ar_vw_state_postft

data:
  datasets:
    - {name: blender_track_v4bc4_all, weight: 0.8}
    - {name: ssv2_fs1_min32, weight: 0.2}

val:                            # 2026-11-08 사용자 "training val 로 real bench 성능 보여주도록" — 95 장면 × 4 = 380 클립 (채점기와 같은 로더), 매 epoch — 95 장면 × 4 = 380 클립 (채점기와 같은 로더 · 같은 창), 매 epoch (약 34 초)
  dataset: null
  n_frames: 32
  context_length: 16
  batch_size: 4
  every_epochs: 1
  at_start: true
  n_blocks_per_type: 1000
  seed: 0
  data:
    root: ${DATA_CSV}/real_world_permanence_uniform
    index_csv: index.csv
    video_root: /workspace/dataset/benchmarks/real_world_permanence
    frames_index_column: frames
    block_column: block_id
    pair_column: pair_id
    plausible_column: plausible
    variant_column: variant
    type_column: condition
    frames_root: null           # 부모 (IntPhys1 dev PNG) 에서 상속되는 키를 지운다
    frames_pattern: null
    frames_start: null
    frames_stride: null
    raw_frames: null
