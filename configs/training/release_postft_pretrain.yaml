# =============================================================================
# 릴리즈 predictor 위에서 **V-JEPA 2 사전학습 레시피 그대로** 이어 학습 — encoder 동결, predictor 만 (2026-10-29, 사용자 요청:
#   "V-JEPA2 pretraining 과정이랑 완전히 똑같은데 encoder 는 frozen, predictor 만. data 는 K710 · SSv2 · HowTo100M. release checkpoint 위에다가")
#
#   GPUS=8 bash z_training/tmux_train.sh release_postft_pretrain
#   watch -c -n 10 bash z_training/monitor_release_postft.sh          # 모니터
#
# 릴리즈 사전학습 (configs/train/vith16/pretrain-256px-16f.yaml) 과 같은 것 — natural_tube_pretrain 에서 물려받는다:
#   * 과제 = 마스크 잡음 제거: short (8 블록 × 공간 0.15) + long (2 블록 × 0.7), 시간 전체 · 매 step 둘 다 (손실 평균, mask_mode all)
#   * predictor = 릴리즈 위상 (full attention + mask token, kind oneshot), 손실 L1 · 정답 = LN(target encoder)
#   * 창 = 16 장 @ fps 4 · 256 px · aug = hflip 0.5 + RandomResizedCrop scale [0.3, 1.0] · ratio [0.75, 1.35]
#   * 데이터 = K710 · SSv2 · HowTo100M, 전부 fps 4 (SSv2 도 릴리즈처럼 fps 4 — 10-01 tube 기준선은 frame_step 1 이었다)
# 릴리즈와 다른 것:
#   * 시작점 = 릴리즈 predictor (model.load_predictor) — scratch 아님
#   * encoder 동결 · EMA 없음 (이 레포의 frozen-encoder 하네스)
#   * HowTo100M 은 1 % 균형 부분집합 (12,374 편) → 비율 1 : 1 : 1 (2026-09-30 사용자 결정. 릴리즈 0.335 / 0.100 / 0.565 를 쓰면 과반복)
#   * global batch 512 (64 × 8 GPU, 릴리즈 3,072)
#   * lr 5e-5 (post-FT 관례 = 사전학습 lr 의 1/10 부근, 미검증) — warmup 1 epoch → 상수 → 마지막 7 epoch 선형 감소
#     (릴리즈 사전학습 상수 + cooldown 선형 감소와 같은 모양, natural_ar_vw 와 같은 WSD)
#   * 길이 70 × 294 = 20,580 step ≈ 1,054 만 clip = tube 기준선 · natural_ar_vw 와 같은 예산
# in-loop val = VOBench late 432 쌍. ⚠️ 2026-10-29 정정: 물려받은 val 은 16 장 창 (원본 0–45 장) 이라 VOBench 가 갈리는 원본 48 장 이후가
#   안 들어가 432 쌍 전부 동점 (50 %) 이었다 → val 만 채점 규격 32 장 (문맥 16 장 → 예측 16 장) 으로. 정식 수치는 z_training/eval.sh
# =============================================================================
extends: natural_tube_pretrain

model:
  load_predictor: true          # ★ 릴리즈 predictor 에서 시작
  predictor:
    num_frames: 32              # 위치 격자만 32 장 (val 32 장 창용). 16 장 학습 입력의 출력은 16 장 격자와 비트 단위로 같다 (2026-10-29 실측 최대 차이 0.0)

data:
  batch_size: 64                # rank 당. 8 GPU = global 512 (k710_ssv2_how_ep70 · natural_ar_vw 와 같다)
  datasets:
    - {name: k710_320_fps4,    weight: 1.0}   # K710 fps 4 (원본 112 장 이상)
    - {name: ssv2_fps4_min48,  weight: 1.0}   # SSv2 fps 4 (릴리즈 규격, 원본 48 장 이상)
    - {name: ht100m_1pct_fps4, weight: 1.0}   # HowTo100M 1 % 균형 부분집합 fps 4

optimization:
  epochs: 70
  ipe: 294                      # 70 × 294 = 20,580 step
  lr: 5.0e-5
  start_lr: 1.0e-6
  final_lr: 1.0e-6
  warmup: 1
  anneal_epochs: 7              # WSD: 마지막 7 epoch 선형 감소 (app/vjepa_frozen/utils.init_opt)

val:
  n_frames: 32                  # VOBench 채점과 같은 창 (원본 0–93 장, 3 장 간격)
  context_length: 16
