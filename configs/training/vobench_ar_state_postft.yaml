# =============================================================================
# ar_state ep40 (Ariel, 상태 되먹임) 에서 시작하는 post fine-tuning — VOBench_v1 block split 의 가능 영상 (2026-10-12)
#
#   GPUS=4 bash z_training/train.sh vobench_ar_state_postft                     # vll5 24 GB × 4
#   GPUS=4 bash z_training/eval.sh vobench_ar_state_postft vobench_v1_split_test   # held-out block 채점
#
# 묻는 것: AR 계열이 late · 이동 물체의 정체 · 자리를 못 이어 가는 것이 이런 장면을 본 적이 없어서인가 (같은 분포에서도 안 풀리면 구조 · 목표).
#   같은 분포 (test block) 에서 풀린다 해도 분포 밖 (IntPhys 1 · 2) 을 같이 봐야 한다 — release post-FT 는 도메인 안에서만 올랐다 (z_training/RESULTS).
# 데이터: vobench_split_train (360 block 의 가능 변이 720 clip, primitive · realistic). 채점: vobench_v1_split_test (720 쌍).
# 과제: 문맥 8 블록 (16 장) → 예측 8 블록 (16 장), TF + rollout 8 — 채점 (surprise_c16t32) 과 같은 꼴.
# val (in-loop) = natural_ar_state 그대로 IntPhys 1 dev — 분포 밖 성능이 무너지는지 감시.
# =============================================================================
extends: natural_ar_state

meta:
  save_every_freq: 5

model:
  load_predictor: true
  predictor_init_checkpoint: /data/hyuntak/project/2026/2027_cvpr/vjepa2/z_training/ariel/ar_state_future_1e_5/latest.pt

data:
  n_frames: 32
  batch_size: 12              # rank 당. C8K8 · 24 GB (natural_ar_state 주석: 16 × 4 가 24 G)
  num_workers: 4
  datasets:
    - {name: vobench_split_train, weight: 1.0}
  aug:
    hflip_p: 0.5
    random_resized_crop: null # 합성 장면 · 물체가 작다 — 자르면 물체가 화면 밖으로 나간다
    square_crop: center

mask:
  - type: prefix_window
    context_blocks: [8]
    predict_blocks: [8]
    weight: 1.0

optimization:
  epochs: 30
  ipe: null                   # = len(loader) (720 clip / (12 × 4) = 15 step/epoch)
  grad_accum: 1
  lr: 5.0e-5
  start_lr: 1.0e-6
  final_lr: 1.0e-6
  warmup: 1
  weight_decay: 0.04
  final_weight_decay: 0.04
