# =============================================================================
# natural_ar_vw_state + 차이 L1 (2026-10-13, 사용자 결정)
#
#   GPUS=8 bash z_training/tmux_train.sh natural_ar_vw_state_delta
#
# 손실 = |p_T − h_T| (teacher forcing + rollout, 기존) + delta_weight · |(p_T − p_{T−1}) − (h_T − h_{T−1})|
#   p_{T−1} 은 모델이 블록 T−1 에 낸 예측 (입력 아님). teacher forcing 은 이웃 TF 예측끼리, rollout 은 이웃 걸음끼리.
#   토큰별 (N, D) 그대로 — 풀링 없음. 부호를 살린 뒤 절댓값이라 방향까지 맞춰야 0 이 된다
# 그 밖 (데이터 · 창 · step · lr · 상태 되먹임 · seed) 은 natural_ar_vw_state 와 같다 — 같은 batch 순서라 epoch 별로 직접 비교된다
# =============================================================================
extends: natural_ar_vw_state

loss:
  delta_weight: 1.0
