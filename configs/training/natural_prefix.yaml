# =============================================================================
# 자연 영상(SSv2 + K400) 으로 **prefix-마스크 predictor** 학습 — 팔 B
#
# 2026-09-27 vll5 이식 (Ariel `z_ariel/vjepa2_train_code_20260927/configs/training/natural_prefix.yaml`).
# 바꾼 것만 적는다 — 나머지 값·주석은 Ariel 원본 그대로다.
#   * meta.sync_masks: true    — Ariel 코드는 rank 동기 마스크 경로가 **항상** 켜져 있고, 우리 train.py 는
#                                이 키 뒤에 있다 (기본 false). 안 켜면 prefix 는 (C,K) 가 worker·rank 마다 달라지고
#                                창이 C+K 블록으로 안 잘려 조용히 Ariel 레시피와 달라진다. kind=ar 는 아예 죽는다.
#   * data.datasets            — vll5 에 있는 ssv2_min48 만. K400 320p 사본은 여기 없다 (아래 주석).
#   * data.batch_size 28 -> 12 — Ariel 은 A6000 48 G, vll5 는 RTX 4090 24 G. **실측 전 보수값** (아래 주석).
#   * val.data.root / frames_root — vll5 경로 (`${DATA_CSV}` · `${BENCH_ROOT}` 치환은 우리 resolve 에 없다).
#   * 머리말 명령 — tmux_train.sh (Ariel 서버 전용, SLURM 밖) 대신 train.sh / sbatch.sh.
#
#   DRYRUN=1 bash z_training/train.sh natural_prefix                                          # 병합·실물 검사만
#   GPUS=8 bash z_training/sbatch.sh natural_prefix                                            # B, scratch (= H0 검정) ★기본
#   GPUS=8 NAME=nat_oneshot_scratch SET="model.predictor.kind=oneshot" \
#          bash z_training/sbatch.sh natural_prefix                                            # A, 같은 예산 대조군 (다음 run)
#   GPUS=8 NAME=nat_prefix_postft SET="model.load_predictor=true optimization.lr=5.0e-5" \
#          bash z_training/sbatch.sh natural_prefix                                            # B, post-FT (참고 팔)
#   GPUS=8 SET="meta.compile_encoders=false" bash z_training/sbatch.sh natural_prefix         # compile 이 안 되면
#
#   GPUS=8 bash z_training/eval.sh <run> intphys1_dev intphys1_sliding               # 가드레일
#
# ── 무엇을 묻나 ───────────────────────────────────────────────────────────────
# 릴리즈 predictor 의 고장은 **H1 (위치가 이끄는 조회)** 이다 — 미래 슬롯이 전부 같은 mask token
# 이라 첫 층 query 가 위치로만 정해지고, 물체의 과거 자리가 2~3 칸 밖이면 못 찾는다
# (`z_research/RollOutV2/Archive/PREDICTOR_DISTANCE_LIMIT_2026-09-19.md`).
# 사다리로 한 번에 한 변수만 바꾼다:
#   A  full attention + mask token   (릴리즈 위상)      model.predictor.kind=oneshot
#   B  prefix 마스크  + mask token   ← 이 config        model.predictor.kind=prefix
#   C  prefix 마스크  + 내용 되먹임  (rollout)          natural_ar.yaml (model.predictor.kind=ar)
# B 는 릴리즈에서 **attention 마스크 하나만** 바뀐다 — `mask_mode=full` 이 릴리즈와 비트 단위로
# 같다는 것을 실측 확인했다 (상대 L1 0.00e+00, 2026-09-22). 그래서 효과 귀속이 깨끗하다.
#
# scratch 팔은 동시에 **H0 의 첫 검정**이다: 릴리즈 사전학습 마스크는 전부 튜브
# (`temporal_scale: [1.0, 1.0]`, `configs/train/vith16/cooldown-256px-64f.yaml:52`) 라
# **과거→미래 채우기를 배운 적이 없다.** 재학습 없이 검증 불가였던 가설이다.
#
# ── 기대치 (미리 못 박는다) ────────────────────────────────────────────────────
# IntPhys1 릴리즈 88.89 는 **천장**이고 도메인 밖 학습이 그걸 올린 적이 한 번도 없다
# (v11 −11.7 / predictor_v1 −8.3, `z_training/RESULTS_2026-09-19.md` §2-2).
# **IntPhys1 = 가드레일(무너지지 않는가), IntPhys2 Main = 본 지표(논문 57.51).**
#
# ⚠️ 2026-09-27: vll5 판은 **SSv2 단독**이라 Ariel 의 SSv2 + K400 혼합과 데이터가 다르다.
#    Ariel 체크포인트 (z_training/ariel/*) 와 같은 레시피라고 쓰지 말 것 — 차이는 데이터 · global batch 둘이다.
# =============================================================================
extends: frozen_predictor_scratch   # ★ 기본이 scratch (2026-09-22 결정) — H0 검정은 릴리즈 습관을 물려받으면 안 된다.
                                    #   post-FT 팔은 SET="model.load_predictor=true optimization.lr=5.0e-5" 로

meta:
  save_every_freq: 2         # e{N}.pt 2 epoch 마다
  log_freq: 10
  compile_encoders: true     # 동결 ViT-H 두 개 torch.compile (1.8x). 문제 생기면 false
                             # ⚠️ 2026-09-27: vll5 (torch 2.12, RTX 4090) 에서 compile 은 **미검증**이다.
                             #    우리 reach config 들은 껐다. 안 되면 SET="meta.compile_encoders=false"
  sync_masks: true           # 2026-09-27 vll5 이식: (C, K) 를 학습 루프가 step 당 한 번, seed 로 rank 동기로 뽑고
                             #   창을 C+K 블록으로 자른다 (Ariel 코드에서는 항상 켜진 경로). natural_ar 가 물려받는다.
                             #   ⚠️ data.window_grid 와 같이 쓰면 조용히 꺼진다 (train.py:135)

model:
  predictor:
    kind: prefix              # prefix | oneshot(릴리즈 위상, 대조군)
    n_registers: 0            # >0 이면 공간 위치 없는 토큰 (영속 실험용, 지금은 끔)

data:
  n_frames: 48                # **24 블록** = 최대 창. C+K 는 이 안에서 고른다.
                              # 48 이어야 "32 프레임 보고 16 프레임"(C=16블록 + K=8블록)이 들어간다
  batch_size: 12              # rank 당. ⚠️ 2026-09-27 vll5 보수값 — **실측 전**이다.
                              #   Ariel: 28/rank, A6000 48 G, 최악 조합 C=16,K=8 에서 44.2 G allocated / 46.3 G nvidia-smi.
                              #   vll5 는 RTX 4090 24 G 라 비례로 ~12. 실제 run 전에 반드시 잰다:
                              #     python z_training/harness/resolve_train.py natural_ar -o /tmp/ar_cfg.yaml \
                              #            --folder /tmp/ar_run --set data.batch_size=12
                              #     CUDA_VISIBLE_DEVICES=0 python z_training/tests/ar_gpu_test.py /tmp/ar_cfg.yaml
                              #   (ar_gpu_test 는 AR 경로다. prefix 는 predictor 토큰이 더 많아 Ariel 실측도 44 G vs AR 31 G —
                              #    prefix 는 AR 보다 작게 잡아야 할 수 있다)
                              #   ⚠️ train.py 에 **grad accumulation 이 없다** — global batch 는 8 x 12 = 96 으로
                              #      Ariel (8 x 28 = 224) 과 다르다. lr 3e-4 를 그대로 둘지 줄일지는 run 을 낼 때 정한다.
  num_workers: 6              # ⚠️ 이 노드는 SLURM cgroup 메모리 상한 256 GB (job 별). in-flight 배치 =
  prefetch_factor: 2          #    8 rank x worker x prefetch x 배치크기. uint8 전송(기본)이면 배치 0.27 GB -> 26 GB
  transfer_uint8: true        #    float32 로 넘기면 4 배라 epoch 경계에서 OOM-killer 가 rank 를 죽인다 (2026-09-22)
                              #    (우리 data.py 기본은 false 라 여기서 명시적으로 켠다 — 2026-09-27)
  loader_timeout_s: 600       # ⚠️ 워커가 파손 파일에서 멈추면 5분 뒤 **에러로** 죽인다 (침묵 정지 금지)
  datasets:                   # ⚠️ `fps` 로 준다. 원본 fps 가 섞여 있어도(K400 30/25/24)
                              #    VideoDataset 이 fstp = 원본fps // fps 로 맞춘다.
                              #    프레임 예산 = n_frames x fstp, 짧은 영상은 filter_short_videos 가 버린다
    - {name: ssv2_min48,  weight: 1.0}   # 97,416 clip (Ariel), fps 12, 블록당 0.17s, 창 4.0s. vll5 csv 는
                                         #   z_training/data/build_video_index.py 로 다시 만든 것 (datasets.md ## ssv2_min48)
    # - {name: k400_320_min96, weight: 1.0}   # 53,117 clip, fps 12, 블록당 0.17s, 창 4.0s — **320p 재인코딩 사본**
    #   ⚠️ 2026-09-27: **vll5 에 없다.** Ariel 혼합을 재현하려면 필요한 것:
    #      (1) K400 을 장면 단위 서브클립 (`..._clip_<i>_<start>_<dur>.mp4`) 으로 자른 사본 — Ariel 의 원본 `K400/videos/*/*/*.mp4`
    #      (2) 그것을 짧은 변 320 · keyint 24 로 재인코딩 (Ariel `z_research/scripts/data/resize_videos.sh`)
    #      (3) `build_video_index.py k400 --root <사본> --probe --min-frames 96 --write` -> train_min96.csv
    #      (4) configs/training/datasets.md 에 ## k400_320_min96 섹션 (절대경로 csv)
    #      우리 `k400_train_40k` (vll6 로컬, 10 초 원본, 장면 컷이 창 안에 들 수 있다) 는 **같은 분포가 아니다**
    #      — 대신 쓰면 그 차이를 결과에 적는다. 두 세트는 한 노드에 같이 있어야 한다 (vll6 SSv2 유무 미확인).
    # - {name: k400_min240, weight: 0.5}   # 21,645 clip, fps 6, 블록당 0.33s, 창 8.0s (IntPhys2 규격)
    #   ⚠️ 2026-09-22 **일단 제외.** 893 파일 표본에서 디코드가 무한정 멈추는 파일 8개가 **전부 이 팔**이었다
    #      (`_clip_N_<start>_<2~3초>` 서브클립인데 헤더는 ≥240장). DataLoader 는 배치를 순서대로만 내놓으므로
    #      워커 하나가 멈추면 rank 로더가 통째로 죽는다 (= "rank 0·7 만 돈다" 의 원인).
    #      `build_video_index.py --deep-probe` 로 실제 디코드까지 검증한 csv 가 나오면 다시 넣는다.
                                         # ⚠️ *_min<N> 은 길이를 **미리 거른** 인덱스다. 안 쓰면
                                         #    런타임 재추첨으로 DDP 가 멈춘다 (datasets.md 참고)
  aug:
    hflip_p: 0.5
    square_crop: center       # ⚠️ K400 은 화면비가 섞여 있다. 안 켜면 16:9 가 1:1 로 눌린다
    random_resized_crop: {scale: [0.3, 1.0], ratio: [0.75, 1.35]}   # 릴리즈 사전학습과 같은 값.
                              # 클립마다 확대율이 달라져 **겉보기 속도가 다양해진다** — v11 처럼
                              # 한 속도만 보고 궤적 prior 를 외우는 것을 막는 가장 싼 장치다

mask:
  - type: prefix_window       # 문맥 C 블록 -> **그 뒤 K 블록만**. C 와 K 가 독립이다
    context_blocks: [2, 4, 8, 16]    # C = 4 / 8 / 16 / **32** 프레임
    predict_blocks: [1, 2, 4, 8]     # K = 2 / 4 / 8 / **16** 프레임 (예측 최대 16, C+K <= 24)
    weight: 1.0                      # 16 조합 전부 유효. 최악은 C=16,K=8 -> predictor 토큰 6144
                                     # ⚠️ 마스크는 학습 루프가 step 당 한 번 뽑는다 (rank 동기, meta.sync_masks).
                                     #    그래서 같은 step 에서 모든 rank 의 VRAM·계산량이 같다

optimization:
  epochs: 45                  # Ariel: ≈150k clip / 224 = 672 step/epoch. 8 GPU 실측(2026-09-22, split attention +
                              # compile + 320p + uint8 전송): 평균 3.7 s/step -> ≈42 min/epoch,
                              # 45 epoch = 30,240 step ≈ 32 h. (첫 시도 30 epoch = 20,160 step 은
                              # 2026-09-22 23:10 에 epoch 4 에서 중단하고 fps<12 포함 + 30k step 으로 재시작)
                              # ⚠️ 2026-09-27 vll5 (SSv2 ~97k / 96) 는 ≈1,000 step/epoch 라 step 수가 Ariel 과 다르다
  lr: 3.0e-4                  # scratch. post-FT 는 SET 으로 5.0e-5
  warmup: 1

val:                          # in-loop 수렴 감시. 정식 수치는 z_training/eval.sh 로 낸다
  dataset: intphys1_dev
  n_blocks_per_type: 10
  context_length: 32          # 프레임. 16 블록 보고 8 블록(16프레임) 예측 = 최악 조합과 같은 과제
  batch_size: 4
  every_epochs: 1
  at_start: true              # epoch 0 에 릴리즈 출발점을 먼저 찍는다 (post-FT 팔에서 중요)
  data:                       # ⚠️ IntPhys1 은 100 프레임뿐이라 n_frames 48 에 stride 3 이 안 들어간다
                              #    (1 + 47x3 = 142 > 100). stride 2 로 낮춘다 (1 + 47x2 = 95)
                              #    그래서 레지스트리 intphys1_dev (stride 3) 로 풀지 않고 여기 직접 적는다
    root: /local_datasets/world/world_analysis/IntPhys1_dev_videos          # 2026-09-27 vll5 경로
    index_csv: index.csv
    frames_root: /local_datasets/world/world_analysis/IntPhys1_dev_frame_png   # 2026-09-27 vll5 경로
    frames_pattern: "{block}/{quadruplet}/{run}/scene/scene_{frame:03d}.png"
    frames_start: 1
    frames_stride: 2
    block_column: block_id
    pair_column: pair_id
    plausible_column: plausible
    type_column: block_type
