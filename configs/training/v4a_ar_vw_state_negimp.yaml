# v4a (2026-11-05, 사용자 데이터 계획 A): v4vc_ar_vw_state_negimp (음의 손실 λ 1, 짝 없음) 과 데이터만 다르다 — v4 전체 + 평면 trapdoor 309 묶음에 정지 물체 단계 (blender_track_v4a_all, 11,559 편). 가림막은 v4 그대로.
