# =============================================================================
# 릴리즈 ViT-H predictor post-FT — IntPhys 2 Main **샘플 (쌍) 단위** split, 창은 채점과 똑같이 (2026-10-15 사용자)
#
#   GPUS=4 bash z_training/train.sh intphys2_postft_pair
#   데이터 = z_training/data/build_intphys2_pair_split.py: 장면마다 쌍 하나 (seed 0) 의 가능 영상 253 clip → test = 다른 쌍 253 쌍 (split MainPair),
#            학습 쌍 그대로 채점 = split MainPairTrain (학습 가능 여부). ⚠️ 같은 장면의 다른 쌍을 학습에서 본다 (장면 단위보다 느슨).
#   창 = 채점 (analysis/intphys2, growing · M 48 · stride 2) 과 같게:
#     · 프레임 = raw 0, 10, 20, … (6 fps) 를 채점의 Resize + CenterCrop 으로 미리 256 PNG 로 (data_gen/IntPhys2_pair) — 채점 입력과 차이 0 (10-15 확인)
#     · 시작점 = 0, 2, …, n−48 (채점 창 자리) — 시작점마다 데이터셋을 하나씩 두고 크기 비례로 섞는다 (창 2,409 개가 같은 확률)
#     · 문맥 C = 채점의 (창, C) 빈도대로: 창마다 sweep 11 개 + 창 0 의 growing prefix (2 … C−2). 목록 안 중복 = 가중치.
#       단서: prefix 의 작은 C 는 채점에서 창 0 에만 붙는데 학습에서는 모든 시작점에 붙는다 (빈도만 같다).
#   intphys2_postft (장면 split · random start · C 12–42 · 240 step) 와 다른 점 = split 단위 · 창 정렬 · 작은 C · step (약 1,200).
# =============================================================================
extends: intphys2_postft

data:
  n_frames: 48
  batch_size: 10               # rank 당, GPU 4 장 → global 40 → 창 2,409 / 40 ≈ 60 step/epoch
  aug:
    hflip_p: 0.0                # 채점에는 뒤집기가 없다 — 학습 입력도 채점과 같게
    random_resized_crop: null
  datasets:
    - {name: intphys2_pair_train, index_csv: index_s0.csv, frames_start: 0}
