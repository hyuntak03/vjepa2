# =============================================================================
# 짝 손실 λ 3 (2026-11-06, 사용자 "loss 를 어떻게 수정해야 될까?") — v4vc_ar_vw_state_negpair 와 λ 만 다르다 (1 → 3).
#   왜 [이론, 토큰마다 L1 분해]: 같은 문맥 기대 손실을 좌표마다 보면
#     짝 손실 (1+λ)|p − 가능| − λ|p − 불가능| → 가능 · 불가능이 같은 좌표 (배경) 는 당기는 힘 1 그대로, 물체 칸은 존재 확률 q > 1 / (2(1+λ)) 이면 물체를 예측.
#       λ 1 → q* 0.25, λ 3 → q* 0.125. 정답이 하나로 정해진 미래에서는 어떤 λ 든 정답이 최적 (넘어가기 없음).
#     짝 없는 hinge (11-02, 항상 켜짐) 는 배경 당김 0.5 − 0.5λ (λ 1 → 0: 배경 표류), 물체 q* = (1 − λ)/2 (λ 1 → 0) 이고 넘어가기가 손해가 아니다.
#   측정과 맞는가: real 쌍 정확도 L1 64.7 (q* 0.5) · 짝 없음 λ 0.5 66.3 · 짝 λ 1 66.8 (둘 다 q* 0.25) · 짝 없음 λ 1 71.6 (q* 0) — q* 순서와 같다.
#     합성 손해는 배경 당김이 0 인 짝 없음 λ 1 에서 컸다 (VOB 판 사라짐 99 → 85). 짝 λ 1 도 92.9 로 조금 내려갔다 (이론으로 설명 안 됨).
#   기대 (가설): 배경을 붙잡은 채 q* 만 0.125 로 내려 real 은 짝 없음 λ 1 쪽으로, 합성은 짝 λ 1 수준.
#   GPUS=8 bash z_training/tmux_train.sh v4vc_ar_vw_state_negpair_w3
