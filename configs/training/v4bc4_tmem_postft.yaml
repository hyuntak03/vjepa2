# 2026-11-08 사용자 "8gpu 에 gating + v4bc4 그냥 post training 하는거 올려줘" — 시간 누적 하이브리드 e43 → v4bc4 L1 만 이어 학습 (음의 손실 없음).
#   v4bc4_ar_vw_state_postft (AR e70 → v4bc4 L1, real 66.3 = A 54 / B 79) 와 다른 것: predictor 구조 (누적 층 9 : 전역 층 3, mem_period 4 + attn_out_gate)
#   와 출발 체크포인트 (natural_ar_vw_state_tmem e43). 데이터 · 손실 · 예산 · batch (GPU 8 × 6 = 48) 는 같다.
#   목적: 음의 손실이 기억 경로를 망가뜨린 영향 없이 gating 이 기억이 필요한 데이터에서 쓸모 있는지 (깨끗한 비교).
#   val = real world permanence 매 epoch.
#   GPUS=8 bash z_training/tmux_train.sh v4bc4_tmem_postft
extends: v4bc4_ar_vw_state_postft

model:
  predictor_init_checkpoint: /workspace/world_model/vjepa2/z_training/runs/natural_ar_vw_state_tmem/e43.pt
  predictor:
    mem_period: 4
    attn_out_gate: true

val:                            # 2026-11-08 사용자 "training val 로 real bench 성능 보여주도록" — 95 장면 × 4 = 380 클립 (채점기와 같은 로더), 매 epoch — 95 장면 × 4 = 380 클립 (채점기와 같은 로더 · 같은 창), 매 epoch (약 34 초)
  dataset: null
  n_frames: 32
  context_length: 16
  batch_size: 4
  every_epochs: 1
  at_start: true
  n_blocks_per_type: 1000
  seed: 0
  data:
    root: ${DATA_CSV}/real_world_permanence_uniform
    index_csv: index.csv
    video_root: /workspace/dataset/benchmarks/real_world_permanence
    frames_index_column: frames
    block_column: block_id
    pair_column: pair_id
    plausible_column: plausible
    variant_column: variant
    type_column: condition
    frames_root: null           # 부모 (IntPhys1 dev PNG) 에서 상속되는 키를 지운다
    frames_pattern: null
    frames_start: null
    frames_stride: null
    raw_frames: null
