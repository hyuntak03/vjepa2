# =============================================================================
# natural_ar_vw_state + 힌트 cross-attn (2026-10-12) — natural_ar_vw_hint 와 같은 힌트 모듈·일정
#
#   GPUS=8 bash z_training/tmux_train.sh natural_ar_vw_state_hint
#
# 힌트는 teacher forcing pass 에만 들어간다 (rollout · val · 채점은 힌트 없음). 일정·모듈 설명은 natural_ar_vw_hint.yaml
# =============================================================================
extends: natural_ar_vw_state

model:
  predictor:
    hint_cross_dim: 96
    hint_cross_heads: 4

hint:
  ratio_max: 0.10
  start: 0.05
  end: 0.90
