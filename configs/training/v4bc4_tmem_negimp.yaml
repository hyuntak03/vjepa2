# 2026-11-08 사용자 "나름 느낌있네. 이걸로 이제 negative loss 학습해볼래?" — 시간 누적 하이브리드 scratch (e43) 에서 v4bc4 음의 손실 이어 학습.
#   출발: natural_ar_vw_state_tmem e43 (사용자 지시로 70 ep 전에 멈춘 판, z_training/runs/natural_ar_vw_state_tmem/e43.pt = 멈출 때 latest.pt 복사).
#   레시피: v4bc4_ar_vw_state_negimp (real 72.1 기준판) 와 같다 — v4bc4 · λ 1 · p 0.5 · 20 ep × 100 step · 전체 batch 48 · lr 5e-5.
#   다른 것: predictor 구조 (누적 층 9 : 전역 층 3, mem_period 4 + attn_out_gate) 와 출발 체크포인트 (AR scratch e70 → 하이브리드 e43).
#   대조: vast_ar_vw_state_v4bc4_negimp (real 72.1 · IP2 late 60.0 · 공식 IP1 84.4 / IP2 53.2).
#   val = real world permanence 매 epoch (기준판의 VOBench v1 late 대신, 사용자 지시). 학습 · 손실과는 무관.
#   GPUS=8 bash z_training/tmux_train.sh v4bc4_tmem_negimp
extends: v4bc4_ar_vw_state_negimp

