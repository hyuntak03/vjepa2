# =============================================================================
# natural_ar_vw_state_phys2d_single — 물체 1 개 2D 물리 (phys2d_single_v1) + 상태 감독, query 1 개 decoder (2026-10-19, 사용자 설계)
#
# 블록 AR 기준 (natural_ar_vw_state) 위에:
#   합성 step 20 % — phys2d_single_v1 train 39,593 편. 창 = 충돌 · 이탈은 경계에 맞춘 행 (예측 첫 장 = 사건, 40,117)
#     + 나머지는 무작위 시작 행 (uniform, 511,782) — 가림은 어디서든 (사용자 10-18). manifest data_csv/phys2d_single_v1/train_mix.tsv
#   head (type single): 블록마다 query 1 개 attention pooling (투영 없음) → (T, D) → 공용 linear 3 개
#     물체 49 (48 정체 + 없음) CE · 위치 (x, y) L1 · 속도 (cos, sin, 속력) L1. 가려져도 위치 · 속도 감독. 약 7 만 파라미터
#   clip 1.0 은 predictor gradient 에만 (clip_separate) — 지난 run 에서 head 가 predictor 와 같이 잘려 거의 못 배웠다
# =============================================================================
extends: natural_ar_vw_state_phys2d

data:
  var_window:
    boundary:
      name: phys2d_single_v1
      p: 0.20
      manifest: ${DATA_CSV}/phys2d_single_v1/train_mix.tsv
      context_frames: [4, 8, 16]
      predict_frames: 16

state_head:
  type: single
  q_std: 1.0
  hidden: null
  num_heads: null
  clip_separate: true
  clip_head: null
  # 2026-10-19 사용자: 상태 감독은 **제약** — 자연 영상 latent 로 배우되 지름길로 배우지 말라. 주인공이 되면 안 된다.
  #   weight 1.0 · lr ×3 run (_natural_ar_vw_state_phys2d_single_w1_lr3): 합성 step predictor grad norm 2~6 (clip 1.0) vs 자연 0.06~0.09
  #   → Adam 2 차 모멘트를 합성 step 이 정해 자연 step 갱신이 ~1/5, latent 가 e2~e6 1.25 로 멈추고 val 50 (margin 0)
  #   기준: 합성 step gn 이 자연 step 의 1~3 배 안쪽이면 제약
  weight: 0.05
  lr_mult: 2                    # ⚠ 정정 (10-19): ×20 은 틀렸다 — AdamW 는 gradient 크기와 무관하게 lr 만큼 움직여 손실 가중치가 head 를 늦추지 않는다.
                                #   ×20 (≈1e-2) 에서 head 가 발산 (위치 176 → 277 px). 단독 검증에서 잘 된 1e-3 에 맞춘다
