# =============================================================================
# Linear probing: IntPhys 2 (Bordes 2025), V-JEPA 2 ViT-L
#
# Same layer-wise linear-mean probe recipe as intphys1_vitl.yaml but on the
# IntPhys 2 Main split (1012 videos, 253 quadruplets).
# =============================================================================
eval_name: analysis_vlm
folder: /data/hyuntak/project/2026/2027_cvpr/vjepa2/configs/analysis/probing/logs
num_workers: 8
resume_checkpoint: false
val_only: false
tag: probe_intphys2_vitl

experiment:
  analysis:
    model: vjepa
    stages:
      vision_encoder: all              # 24 blocks (ViT-L)
    plot: true
    plot_pez: [0.2, 0.4]

    # Paper Joseph et al. 2026 Appendix B HP sweep: 6 lr × 4 wd = 24 probes per layer.
    probes:
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.0001, weight_decay: 0.01, warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.0001, weight_decay: 0.1,  warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.0001, weight_decay: 0.4,  warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.0001, weight_decay: 0.8,  warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.00043, weight_decay: 0.01, warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.00043, weight_decay: 0.1,  warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.00043, weight_decay: 0.4,  warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.00043, weight_decay: 0.8,  warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.0019, weight_decay: 0.01, warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.0019, weight_decay: 0.1,  warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.0019, weight_decay: 0.4,  warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.0019, weight_decay: 0.8,  warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.0085, weight_decay: 0.01, warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.0085, weight_decay: 0.1,  warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.0085, weight_decay: 0.4,  warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.0085, weight_decay: 0.8,  warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.037, weight_decay: 0.01, warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.037, weight_decay: 0.1,  warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.037, weight_decay: 0.4,  warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.037, weight_decay: 0.8,  warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.16, weight_decay: 0.01, warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.16, weight_decay: 0.1,  warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.16, weight_decay: 0.4,  warmup: 1.0 } }
      - { type: linear, pooling: mean, pre_norm: true, optimization: { lr: 0.16, weight_decay: 0.8,  warmup: 1.0 } }

  data:
    dataset_type: VideoDataset
    dataset_train: /data/hyuntak/project/2026/2027_cvpr/vjepa2/data_csv/IntPhys2/IntPhys2_2way_train.csv
    dataset_val:   /data/hyuntak/project/2026/2027_cvpr/vjepa2/data_csv/IntPhys2/IntPhys2_2way_val.csv
    num_classes: 2
    resolution: 256
    resize_mode: resize   # no crop -- preserves full FoV (round-2 audit); IntPhys 2 native 512x512
    frames_per_clip: 16                 # paper (Sonia): 16 frames per clip, keystone-centered.
                                        # keystone frame index not exposed in dataset -> use uniform.
    frame_step: 1
    num_segments: 1
    num_views_per_segment: 1
    uniform_sampling: true              # IntPhys 2 clips are ~10s @ 60fps -> sample 16 evenly

  optimization:
    batch_size: 8
    num_epochs: 20
    use_bfloat16: false                 # harness flag maps to fp16 autocast + fp16 GradScaler;
                                        # fp16 + high-lr HP (0.16) causes ALL 576 heads to freeze via
                                        # fused sum-of-losses. Keep fp32 (round-4 audit).
    save_optimizer: false
    cache_features: true
    cache_pooling: mean                 # spatiotemporal MEAN only (D). paper-faithful.
    cache_max_gb: 80                    # 24 probes × 24 layers × 1012 videos -- headroom
    default_head: { start_lr: 0.0, final_lr: 0.0, final_weight_decay: 0.01 }

model_kwargs:
  checkpoint: /data/hyuntak/project/2026/2027_cvpr/vjepa2/checkpoint/models--facebook--vjepa2-vitl-fpc64-256/snapshots/b3c1679b7c34d3255ef3547f27c7b226aefab26f/original/model.pth
  module_name: evals.analysis.modelcustom.vit_encoder_multilayer
  pretrain_kwargs:
    encoder:
      checkpoint_key: target_encoder
      model_name: vit_large
      patch_size: 16
      tubelet_size: 2
      uniform_power: true
      use_rope: true
      img_temporal_dim_size: null
  wrapper_kwargs:
    max_frames: 128
    use_pos_embed: false
