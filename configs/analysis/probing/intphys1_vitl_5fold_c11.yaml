# =============================================================================
# IntPhys 1 — Joseph 2026 paper-explicit config (Appendix C.11 IntPhys spec)
# + Appendix B 5-fold grouped cross-validation.
#
# This is the ONLY concrete IntPhys probe training recipe the paper spells out
# (Appendix C.11, p32). Combined with the 5-fold grouped CV protocol from
# Appendix B (p13), it yields a fully paper-explicit configuration with no
# guessed hyperparameters (unlike Appendix B alone, which is silent on
# optimizer and epoch count).
#
# Paper spec (verbatim, C.11):
#   * Single-layer linear model, f(h) = W h + b            (matches PooledLinearProbe)
#   * Binary logistic regression (possible vs impossible), CE loss
#   * Adam optimizer                                       (our harness uses AdamW;
#                                                            with wd=1e-4 the diff is negligible)
#   * lr = 1e-3, wd = 1e-4
#   * 50 epochs
#   * 80/20 train/val split with fixed seed  (we replicate this via GroupKFold(5))
#
# Placeholders replaced by z_scripts/run_5fold.sh at launch time:
#   __TRAIN_CSV__ / __VAL_CSV__  -> data_csv/IntPhys1/cv/{train,val}_fold{k}.csv
#   __TAG__                       -> probe_intphys1_vitl_5fold_f{k}
#
# 실행: bash z_scripts/run_5fold.sh
# =============================================================================
eval_name: analysis_vlm
folder: /data/hyuntak/project/2026/2027_cvpr/vjepa2/configs/analysis/probing/logs
num_workers: 8
resume_checkpoint: false
val_only: false
tag: __TAG__

experiment:
  analysis:
    model: vjepa
    stages:
      vision_encoder: all
    plot: true
    plot_pez: [0.2, 0.4]

    # Single probe with paper's exact C.11 IntPhys settings.
    # constant lr/wd, no warmup (paper C.11 doesn't mention schedule).
    probes:
      - { type: linear, pooling: mean, optimization: {
            lr: 0.001, weight_decay: 0.0001,
            start_lr: 0.001, final_lr: 0.001, final_weight_decay: 0.0001,
            warmup: 0.0
          } }

  data:
    dataset_type: VideoDataset
    dataset_train: __TRAIN_CSV__
    dataset_val:   __VAL_CSV__
    num_classes: 2
    resolution: 256
    resize_mode: resize
    frames_per_clip: 16                 # Sonia clarification: 16 frames per clip
    frame_step: 1
    num_segments: 1
    num_views_per_segment: 1
    uniform_sampling: false
    center_sampling: false
    keystones_json: /data/hyuntak/project/2026/2027_cvpr/vjepa2/data_csv/IntPhys1/keystones.json

  optimization:
    batch_size: 8
    num_epochs: 50                      # Appendix C.11 IntPhys: 50 epochs (verbatim)
    use_bfloat16: false
    save_optimizer: false
    cache_features: true
    cache_pooling: mean                 # spatiotemporal MEAN (Sonia + Fig 18 caption confirm)
    cache_max_gb: 100
    # eval_metric: per_video | paired | quadruplet
    #   per_video  (default; paper Fig 1 canonical) — binary classifier accuracy per video.
    #   paired     — per matched-pair accuracy (needs per-pair keystones; the shipping
    #                keystones.json has per-QUAD ticks so 'paired' will fail at setup).
    #   quadruplet — official IntPhys 1 relative score (Riochet 2020 Eq. 1): correct iff
    #                Σ P(imp|impossible_i) > Σ P(imp|possible_i) inside each 4-video quad.
    eval_metric: per_video
    default_head: { start_lr: 0.0, final_lr: 0.0, final_weight_decay: 0.0 }

model_kwargs:
  checkpoint: /data/hyuntak/project/2026/2027_cvpr/vjepa2/checkpoint/models--facebook--vjepa2-vitl-fpc64-256/snapshots/b3c1679b7c34d3255ef3547f27c7b226aefab26f/original/model.pth
  module_name: evals.analysis.modelcustom.vit_encoder_multilayer
  pretrain_kwargs:
    encoder:
      checkpoint_key: target_encoder
      model_name: vit_large
      patch_size: 16
      tubelet_size: 2
      uniform_power: true
      use_rope: true
      img_temporal_dim_size: null
  wrapper_kwargs:
    max_frames: 128
    use_pos_embed: false
    apply_encoder_norm: false           # false (default) = raw x_N via forward hooks.
                                        # true = stock VJEPA2 self.norm-per-intermediate path
                                        #   (ablation for paper Fig 1 shape reproduction).
