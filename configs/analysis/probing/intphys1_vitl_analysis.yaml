# =============================================================================
# IntPhys 1 -- lean representation analysis run (single best HP + modes).
#
# One probe (HP#10 from the 20-HP sweep: lr=1e-3, wd=0.1 -- highest mean acc
# across layers = 80.21%, ties best-of-sweep peak of 87.5% at L6). Full 24-layer
# scan so mode-based analyses have per-layer data.
#
# Modes attached:
#   * attention_distance     -- Fig 3/19 heatmap + layerwise Dbar/S (encoder-only)
#   * representation_geometry -- per-layer FDR, centroid cosine, participation
#                                ratio, class-conditional norms (uses cached feats)
#
# Purpose: side-by-side with intphys2_vitl_analysis.yaml to explain the linear
# probing performance gap. Same encoder + preprocessing + probe form; only the
# data changes.
#
# env: vjepa2
# 실행: bash z_scripts/run_analysis.sh intphys1
# =============================================================================
eval_name: analysis_vlm
folder: /data/hyuntak/project/2026/2027_cvpr/vjepa2/configs/analysis/probing/logs
num_workers: 8
resume_checkpoint: false
val_only: false
tag: analysis_intphys1_vitl

experiment:
  analysis:
    model: vjepa
    stages:
      vision_encoder: all
    plot: true
    plot_pez: [0.2, 0.4]

    modes:
      attention_distance:
        enabled: true
        query_chunk: 512
        max_batches: 8
      representation_geometry:
        enabled: true

    probes:
      - { type: linear, pooling: mean, optimization: { lr: 0.001, weight_decay: 0.1, start_lr: 0.001, final_lr: 0.001, final_weight_decay: 0.1, warmup: 0.0 } }

  data:
    dataset_type: VideoDataset
    dataset_train: /data/hyuntak/project/2026/2027_cvpr/vjepa2/data_csv/IntPhys1/IntPhys1_2way_train.csv
    dataset_val:   /data/hyuntak/project/2026/2027_cvpr/vjepa2/data_csv/IntPhys1/IntPhys1_2way_val.csv
    num_classes: 2
    resolution: 256
    resize_mode: resize
    frames_per_clip: 16
    frame_step: 1
    num_segments: 1
    num_views_per_segment: 1
    uniform_sampling: false
    center_sampling: false
    keystones_json: /data/hyuntak/project/2026/2027_cvpr/vjepa2/data_csv/IntPhys1/keystones.json

  optimization:
    batch_size: 8
    num_epochs: 200
    use_bfloat16: false
    save_optimizer: false
    cache_features: true
    cache_pooling: mean
    cache_max_gb: 100
    default_head: { start_lr: 0.0, final_lr: 0.0, final_weight_decay: 0.0 }

model_kwargs:
  checkpoint: /data/hyuntak/project/2026/2027_cvpr/vjepa2/checkpoint/models--facebook--vjepa2-vitl-fpc64-256/snapshots/b3c1679b7c34d3255ef3547f27c7b226aefab26f/original/model.pth
  module_name: evals.analysis.modelcustom.vit_encoder_multilayer
  pretrain_kwargs:
    encoder:
      checkpoint_key: target_encoder
      model_name: vit_large
      patch_size: 16
      tubelet_size: 2
      uniform_power: true
      use_rope: true
      img_temporal_dim_size: null
  wrapper_kwargs:
    max_frames: 128
    use_pos_embed: false
