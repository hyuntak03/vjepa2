# =============================================================================
# IntPhys 1 — Joseph 2026 Appendix B + 5-fold grouped CV, COSINE lr schedule.
#
# intphys1_vitl_5fold_appb.yaml 과 딱 두 가지만 다르다:
#   1) probe 별 final_lr: 0.0   -> WarmupCosineLRSchedule 이 실제로 cosine 으로 감쇠한다
#      (appb 는 start_lr == lr == final_lr 로 두어 상수 lr 로 무력화해 둔 상태)
#   2) optimization.optimizer   -> config knob (adamw | adam | sgd), 기본 adamw
#
# 저자 확인 사항 (그대로 반영되어 있음):
#   "We used 16 frames per clip and centered each clip on the impossible/possible
#    keystone frame. We used one video clip. We ran a hyperparam sweep of 20 probes
#    per layer and picked the best probe."
#   -> frames_per_clip: 16 / keystones_json / num_segments 1 / num_views 1 / probes 20개
#
# 논문이 여전히 명시하지 않는 것: optimizer, epochs, lr schedule.
# 이 config 는 그중 lr schedule 을 cosine 으로 놓은 변형이다.
#
# Placeholders replaced by z_scripts/run_5fold.sh at launch time:
#   __TRAIN_CSV__ / __VAL_CSV__ / __TAG__
# =============================================================================
eval_name: analysis_vlm
folder: /data/hyuntak/project/2026/2027_cvpr/vjepa2/configs/analysis/probing/logs
num_workers: 8
resume_checkpoint: false
val_only: false
tag: __TAG__

experiment:
  analysis:
    model: vjepa
    stages:
      vision_encoder: all
    plot: true
    plot_pez: [0.2, 0.4]

    # Paper Appendix B verbatim: 5 lr × 4 wd = 20 configs.
    probes:
      # lr = 1e-4
      - { type: linear, pooling: mean, optimization: { lr: 0.0001, weight_decay: 0.01, start_lr: 0.0001, final_lr: 0.0, final_weight_decay: 0.01, warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.0001, weight_decay: 0.1,  start_lr: 0.0001, final_lr: 0.0, final_weight_decay: 0.1,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.0001, weight_decay: 0.4,  start_lr: 0.0001, final_lr: 0.0, final_weight_decay: 0.4,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.0001, weight_decay: 0.8,  start_lr: 0.0001, final_lr: 0.0, final_weight_decay: 0.8,  warmup: 0.0 } }
      # lr = 3e-4
      - { type: linear, pooling: mean, optimization: { lr: 0.0003, weight_decay: 0.01, start_lr: 0.0003, final_lr: 0.0, final_weight_decay: 0.01, warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.0003, weight_decay: 0.1,  start_lr: 0.0003, final_lr: 0.0, final_weight_decay: 0.1,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.0003, weight_decay: 0.4,  start_lr: 0.0003, final_lr: 0.0, final_weight_decay: 0.4,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.0003, weight_decay: 0.8,  start_lr: 0.0003, final_lr: 0.0, final_weight_decay: 0.8,  warmup: 0.0 } }
      # lr = 1e-3
      - { type: linear, pooling: mean, optimization: { lr: 0.001, weight_decay: 0.01, start_lr: 0.001, final_lr: 0.0, final_weight_decay: 0.01, warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.001, weight_decay: 0.1,  start_lr: 0.001, final_lr: 0.0, final_weight_decay: 0.1,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.001, weight_decay: 0.4,  start_lr: 0.001, final_lr: 0.0, final_weight_decay: 0.4,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.001, weight_decay: 0.8,  start_lr: 0.001, final_lr: 0.0, final_weight_decay: 0.8,  warmup: 0.0 } }
      # lr = 3e-3
      - { type: linear, pooling: mean, optimization: { lr: 0.003, weight_decay: 0.01, start_lr: 0.003, final_lr: 0.0, final_weight_decay: 0.01, warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.003, weight_decay: 0.1,  start_lr: 0.003, final_lr: 0.0, final_weight_decay: 0.1,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.003, weight_decay: 0.4,  start_lr: 0.003, final_lr: 0.0, final_weight_decay: 0.4,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.003, weight_decay: 0.8,  start_lr: 0.003, final_lr: 0.0, final_weight_decay: 0.8,  warmup: 0.0 } }
      # lr = 5e-3
      - { type: linear, pooling: mean, optimization: { lr: 0.005, weight_decay: 0.01, start_lr: 0.005, final_lr: 0.0, final_weight_decay: 0.01, warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.005, weight_decay: 0.1,  start_lr: 0.005, final_lr: 0.0, final_weight_decay: 0.1,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.005, weight_decay: 0.4,  start_lr: 0.005, final_lr: 0.0, final_weight_decay: 0.4,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.005, weight_decay: 0.8,  start_lr: 0.005, final_lr: 0.0, final_weight_decay: 0.8,  warmup: 0.0 } }

  data:
    dataset_type: VideoDataset
    dataset_train: __TRAIN_CSV__
    dataset_val:   __VAL_CSV__
    num_classes: 2
    resolution: 256
    resize_mode: resize
    frames_per_clip: 16
    frame_step: 1
    num_segments: 1
    num_views_per_segment: 1
    uniform_sampling: false
    center_sampling: false
    keystones_json: /data/hyuntak/project/2026/2027_cvpr/vjepa2/data_csv/IntPhys1/keystones.json

  optimization:
    batch_size: 8
    num_epochs: 50
    use_bfloat16: false
    save_optimizer: false
    cache_features: true
    cache_pooling: mean
    cache_max_gb: 100
    # eval_metric: per_video | paired | quadruplet
    #   per_video  (default; paper Fig 1 canonical) — binary classifier accuracy of the
    #              linear probe on each individual video. Chance = 50%.
    #   paired     — per matched-pair accuracy: correct iff P(imp|imp_vid) > P(imp|pos_vid).
    #              REQUIRES keystones.json to distinguish the two matched pairs inside a
    #              quadruplet (the shipping keystones.json has per-QUAD ticks so 'paired'
    #              will fail at setup — use 'quadruplet' or emit per-pair keystones).
    #   quadruplet — official IntPhys 1 relative score (Riochet 2020 Eq. 1): quadruplet is
    #              correct iff Σ P(imp|impossible_i) > Σ P(imp|possible_i) across its 4 videos.
    eval_metric: per_video
    optimizer: adamw          # adamw | adam | sgd (논문 무언급. adam 은 wd 를 L2 로 섞음)
    default_head: { start_lr: 0.0, final_lr: 0.0, final_weight_decay: 0.0 }

model_kwargs:
  checkpoint: /data/hyuntak/project/2026/2027_cvpr/vjepa2/checkpoint/models--facebook--vjepa2-vitl-fpc64-256/snapshots/b3c1679b7c34d3255ef3547f27c7b226aefab26f/original/model.pth
  module_name: evals.analysis.modelcustom.vit_encoder_multilayer
  pretrain_kwargs:
    encoder:
      checkpoint_key: target_encoder
      model_name: vit_large
      patch_size: 16
      tubelet_size: 2
      uniform_power: true
      use_rope: true
      img_temporal_dim_size: null
  wrapper_kwargs:
    max_frames: 128
    use_pos_embed: false
    apply_encoder_norm: false           # false (default) = raw x_N via forward hooks.
                                        # true = stock VJEPA2 path (out_layers → self.norm(x_N)
                                        #   per intermediate). Ablation for reproducing paper
                                        #   Fig 1 shape (sharp PEZ + steep L23 degradation) —
                                        #   see PAPER_VS_OURS.md.
