# =============================================================================
# Linear probing: IntPhys 1 (Riochet 2021), V-JEPA 2 ViT-L
#
# Paper-reproduction config (Joseph et al. 2026, Appendix B, as faithful as possible):
#   * Layer-wise linear probe over ALL 24 ViT-L blocks (`stages: all`)
#   * Probe form: f(h) = Wh + b   (pure linear, no LN inside the probe head)
#   * Paper HP sweep: 5 lr × 4 wd = 20 configs (Appendix B, exact verbatim)
#       lr ∈ {1e-4, 3e-4, 1e-3, 3e-3, 5e-3}
#       wd ∈ {0.01, 0.1, 0.4, 0.8}
#   * 5-fold grouped CV: not yet implemented (single 80/20 grouped split for now)
#   * CONSTANT lr/wd during training:
#       per-probe start_lr = final_lr = lr    (no warmup+cosine artifact)
#       per-probe final_weight_decay = wd     (no wd-schedule silent decay away from swept value)
#       warmup: 0.0                            (paper does not mention warmup)
#   * resize_mode: resize     -- preserve full 288x288 FoV (round-2 audit)
#   * uniform_sampling: true  -- sample 16 frames evenly across native 100 (Sonia: 16 frames/clip)
#   * spatiotemporal MEAN pooling on cached features (Sonia: mean pool)
#   * Encoder path: forward hooks on model.blocks[i] capture raw x_N (no self.norm on intermediates)
#
# Fields NOT specified in paper (chosen for full convergence / cheap probes):
#   num_epochs: 20 (matches paper-friendly setting; watch train loss to verify convergence)
#   batch_size: 8
#   optimizer: AdamW (hardcoded in harness; implied by wd sweep in paper)
#   dtype: fp32 (use_bfloat16: false to avoid the fp16 GradScaler bug with fused sum-of-losses)
#
# What we CANNOT easily match (deferred):
#   * 5-fold grouped CV     -> we use single 80/20 grouped split (~+2-4pt to close)
#   * matched-pair training -> we do per-video (~+8-10pt to close per r3 audit)
#   * encoder final LN skip -> upstream `self.norm` is applied to all intermediate layers
#                              per z_tech; we do not touch upstream (~+10-12pt to close)
#
# Task    : binary classification (possible=0 vs impossible=1)
# Data    : 360 videos, 80/20 split grouped by quadruplet
# Harness : evals/analysis_vlm/eval.py  (eval_name: analysis_vlm)
# env     : vjepa2
# =============================================================================
eval_name: analysis_vlm
folder: /data/hyuntak/project/2026/2027_cvpr/vjepa2/configs/analysis/probing/logs
num_workers: 8
resume_checkpoint: false
val_only: false
tag: probe_intphys1_vitl

experiment:
  analysis:
    model: vjepa
    stages:
      vision_encoder: all              # layer-wise scan across all 24 ViT-L blocks
    plot: true                          # writes stage_val_acc.png (x=layer fraction)
    plot_pez: [0.2, 0.4]               # Physics Emergence Zone shading (Joseph Fig 1)

    # ---------- Paper Appendix B HP sweep: EXACT paper values (5 lr × 4 wd = 20) ----------
    # Joseph 2026 Appendix B verbatim:
    #   "learning rates {10^-4, 3×10^-4, 10^-3, 3×10^-3, 5×10^-3}
    #    and weight decay {0.01, 0.1, 0.4, 0.8}, selecting the best model based on validation
    #    performance. We used 5-fold grouped cross-validation and report results as
    #    mean ± standard deviation across folds."
    # Each probe gets EXPLICIT constant lr / wd (start=ref=final on both).
    # warmup: 0.0 removes the harness's default 1-epoch linear warmup.
    # NOTE: 5-fold grouped CV is not yet implemented in this harness; we use a single
    #       80/20 grouped-by-quadruplet split. Best-of-20 selection is done by the plotter.
    probes:
      # lr = 1e-4
      - { type: linear, pooling: mean, optimization: { lr: 0.0001, weight_decay: 0.01, start_lr: 0.0001, final_lr: 0.0001, final_weight_decay: 0.01, warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.0001, weight_decay: 0.1,  start_lr: 0.0001, final_lr: 0.0001, final_weight_decay: 0.1,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.0001, weight_decay: 0.4,  start_lr: 0.0001, final_lr: 0.0001, final_weight_decay: 0.4,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.0001, weight_decay: 0.8,  start_lr: 0.0001, final_lr: 0.0001, final_weight_decay: 0.8,  warmup: 0.0 } }
      # lr = 3e-4
      - { type: linear, pooling: mean, optimization: { lr: 0.0003, weight_decay: 0.01, start_lr: 0.0003, final_lr: 0.0003, final_weight_decay: 0.01, warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.0003, weight_decay: 0.1,  start_lr: 0.0003, final_lr: 0.0003, final_weight_decay: 0.1,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.0003, weight_decay: 0.4,  start_lr: 0.0003, final_lr: 0.0003, final_weight_decay: 0.4,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.0003, weight_decay: 0.8,  start_lr: 0.0003, final_lr: 0.0003, final_weight_decay: 0.8,  warmup: 0.0 } }
      # lr = 1e-3
      - { type: linear, pooling: mean, optimization: { lr: 0.001, weight_decay: 0.01, start_lr: 0.001, final_lr: 0.001, final_weight_decay: 0.01, warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.001, weight_decay: 0.1,  start_lr: 0.001, final_lr: 0.001, final_weight_decay: 0.1,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.001, weight_decay: 0.4,  start_lr: 0.001, final_lr: 0.001, final_weight_decay: 0.4,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.001, weight_decay: 0.8,  start_lr: 0.001, final_lr: 0.001, final_weight_decay: 0.8,  warmup: 0.0 } }
      # lr = 3e-3
      - { type: linear, pooling: mean, optimization: { lr: 0.003, weight_decay: 0.01, start_lr: 0.003, final_lr: 0.003, final_weight_decay: 0.01, warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.003, weight_decay: 0.1,  start_lr: 0.003, final_lr: 0.003, final_weight_decay: 0.1,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.003, weight_decay: 0.4,  start_lr: 0.003, final_lr: 0.003, final_weight_decay: 0.4,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.003, weight_decay: 0.8,  start_lr: 0.003, final_lr: 0.003, final_weight_decay: 0.8,  warmup: 0.0 } }
      # lr = 5e-3
      - { type: linear, pooling: mean, optimization: { lr: 0.005, weight_decay: 0.01, start_lr: 0.005, final_lr: 0.005, final_weight_decay: 0.01, warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.005, weight_decay: 0.1,  start_lr: 0.005, final_lr: 0.005, final_weight_decay: 0.1,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.005, weight_decay: 0.4,  start_lr: 0.005, final_lr: 0.005, final_weight_decay: 0.4,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.005, weight_decay: 0.8,  start_lr: 0.005, final_lr: 0.005, final_weight_decay: 0.8,  warmup: 0.0 } }
      # NOTE: lr=1.6e-1 group removed to match paper spec:
      # Joseph 2026 Appendix B lists 5 lr × 4 wd = 20 configs (Sonia email also confirms 20).
      # Removed the highest-lr group (0.16), which is the most likely to diverge and least likely
      # to be in the paper's actual grid. Remaining 5 × 4 = 20 configs.

  data:
    dataset_type: VideoDataset
    dataset_train: /data/hyuntak/project/2026/2027_cvpr/vjepa2/data_csv/IntPhys1/IntPhys1_2way_train.csv
    dataset_val:   /data/hyuntak/project/2026/2027_cvpr/vjepa2/data_csv/IntPhys1/IntPhys1_2way_val.csv
    num_classes: 2
    resolution: 256
    resize_mode: resize                 # no crop -- preserves full IntPhys 1 FoV (round-2 audit)
    frames_per_clip: 16                 # paper (Sonia): 16 frames per clip, keystone-centered.
    frame_step: 1
    num_segments: 1
    num_views_per_segment: 1
    uniform_sampling: false             # disabled -- superseded by center_sampling.
    center_sampling: true               # contiguous 16-frame window at video midpoint = [42..57]
                                        # (native 100 frames). Prior: IntPhys break-point tends
                                        # near mid-video; uniform sampling dilutes the physics
                                        # signal by hopping every ~6 frames.

  optimization:
    batch_size: 8
    num_epochs: 200                     # cached-feature linear probe = ms/epoch.
                                        # 20 was way too short: peak-layer train acc stuck at
                                        # ~60% (underfitting) even though a linear probe on
                                        # 1024-dim features over 288 samples should overfit to
                                        # ~100% train easily. Bumping to 200 for convergence.
    use_bfloat16: false
    save_optimizer: false
    cache_features: true
    cache_pooling: mean                 # spatiotemporal MEAN only (D). Paper (Sonia clarification)
                                        # uses mean pool. Prev 'pooled' cached mean||max (2D) even
                                        # though probes.pooling='mean' only used the mean half.
    cache_max_gb: 100
    # default_head: values here are overridden per-probe by the explicit start_lr/final_lr/final_wd
    # above. Kept as fallback for any downstream head that omits its own schedule.
    default_head: { start_lr: 0.0, final_lr: 0.0, final_weight_decay: 0.0 }

model_kwargs:
  checkpoint: /data/hyuntak/project/2026/2027_cvpr/vjepa2/checkpoint/models--facebook--vjepa2-vitl-fpc64-256/snapshots/b3c1679b7c34d3255ef3547f27c7b226aefab26f/original/model.pth
  module_name: evals.analysis.modelcustom.vit_encoder_multilayer
  pretrain_kwargs:
    encoder:
      checkpoint_key: target_encoder    # EMA teacher (standard eval convention)
      model_name: vit_large
      patch_size: 16
      tubelet_size: 2
      uniform_power: true
      use_rope: true
      img_temporal_dim_size: null
  wrapper_kwargs:
    max_frames: 128
    use_pos_embed: false
