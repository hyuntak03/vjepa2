# =============================================================================
# IntPhys 2 Main — 논문 Table 2 V-JEPA 2-h (Overall 57.51) 재현용 (2026-09-19)
#   vjepa2_vith_intphys2_main.yaml 에서 세 가지만 바꿨다 (analysis/intphys2/PROTOCOL_CHECK_2026-09-14.md §3):
#     1. model.dtype float32 + model.autocast bfloat16 (공식 = fp32 가중치 + bf16 autocast)
#     2. context_length_sweep = 논문 본문 (4..14) ∪ 공식 vjepa_2.yaml (12..42) — C 의 해석이 둘로 갈려서 둘 다 돈다
#     3. evaluation.ddp: true (torchrun 8 GPU)
#   열별 최고 C 선택 (Table 2 방식) 은 per_video.csv 에서 사후 계산한다.
# =============================================================================
# =============================================================================
# IntPhys 2 — 논문 프로토콜 그대로 재현 (V-JEPA 2 ViT-H, Main split)
#
#   Bordes et al., "IntPhys 2: Benchmarking Intuitive Physics Understanding In
#   Complex Synthetic Environments", Appendix D.
#
# 실행:
#   python -m analysis.intphys2.eval --config configs/analysis/intphys2/vjepa2_vith_intphys2_main.yaml
#   torchrun --nproc-per-node=4 -m analysis.intphys2.eval --config <이 파일>   # evaluation.ddp: true 필요
#
# 논문 프로토콜 (App. D.1, 식 1/2)
#   Surprise_w = d( p(f(V_{w:w+C})), f'(V_{w+C:w+M}) )
#     w = window 시작 프레임, C = context 길이, M = window 크기, T = M - C = 예측 길이
#   AvgSurprise = mean_w,  MaxSurprise = max_w
#     -> "We use average surprise unless specified otherwise" (D.1)
#   채점: SceneIndex 안에서 surprise(impossible) > surprise(possible) 이면 정답
#
# ★ 논문이 제안한 growing-context (Fig. 8B)
#   기존 프로토콜(Fig. 8A)은 window 가 커지면 예측이 영상 뒤쪽에서야 시작돼서
#   위반 사건을 놓친다. 그래서 M 을 "최대" window 로 보고, 첫 window 에 대해
#   context 를 2,4,...,C-2 로 키워가며 예측을 추가한다.
#     "we propose to consider the window size M as a maximal size, and also proceed
#      with all predictions using smaller ones, by progressively growing the context
#      size. This ensures that every frame (apart from the first one) is predicted"
#   공식 구현의 max_context_mode 와 동일하다
#     (IntPhys2/prediction_evals/evals/intphys2/eval.py:230-257,
#      loss = torch.hstack([loss_beginning, loss]))
#   -> surprise.protocol: growing
#
# 하이퍼파라미터 (App. D.3 Table 8, V-JEPA 2 행)
#   window size 48 / prediction length -1 (window 끝까지) / framerate 6
#   context length 는 여러 개를 돌려 최댓값을 보고한다 (D.3 마지막 문단).
#   논문 본문의 4,6,8,10,12,14 는 M=16 기준이고, 공식 vjepa_2.yaml 은 M=48 이라
#   3배한 12,18,24,30,36,42 를 쓴다. 여기서도 그걸 따른다.
#
# ⚠️ 논문 자신도 지적하듯 "report the maximal accuracy" 는 평가셋에서 하이퍼파라미터를
#    고르는 것이라 노이즈가 있으면 성능이 부풀려진다 (D.3 마지막 문장). summary.json 의
#    sweep.per_context_length 에 C 별 값이 전부 남으니 같이 볼 것.
# =============================================================================

tag: bench_intphys2_main_videomae2g
folder: /data/hyuntak/project/2026/2027_cvpr/vjepa2/z_research/Benchmarks/exp_results/intphys2

data:
  root: /data2/local_datasets/world/Benchmark/IntPhys2   # Benchmarks 세트 스테이징 (vll3/vll5)
  dataset_variant: intphys2
  split: Main                     # Debug(60) | Main(1012) | HeldOut(344, 라벨 없음)

  # 프레임 샘플링. 원본은 60fps 이고 공식 config 는 frame_step 10 -> 정확히 6fps.
  #   IntPhys2/prediction_evals/evals/intphys2/intphys2_dataset.py:112
  #     frame_indices = np.arange(0, len(vr), self.frame_step)
  # frame_step 이 있으면 target_fps 보다 우선한다 (공식과 인덱스가 정확히 일치).
  frame_step: 10
  target_fps: 6.0                 # frame_step 을 지우면 이 값으로 폴백

  img_size: 224                   # patch 14 라 224 고정 (256 은 격자가 안 떨어진다)
  # 공식 make_transforms(random_resize_aspect_ratio=[1,1], random_resize_scale=[1,1],
  # crop_size=256) 은 512x512 전체를 256 으로 줄일 뿐 잘라내지 않는다.
  # crop_margin_ratio: 1.0 이면 Resize(256) + CenterCrop(256) = 전체 리사이즈로 동일.
  crop_margin_ratio: 1.0
  min_frames: 8
  decord_threads: 2

model:
  family: videomae2
  checkpoint: /data/hyuntak/project/2026/2027_cvpr/vjepa2/checkpoint/videomae2/models--OpenGVLab--VideoMAE2/snapshots/706cc172d65ebd4dedbee3f9c0183a93df9fa125/mae-g/vit_g_hybrid_pt_1200e.pth
  arch_name: vit_giant_patch14
  img_size: 224
  patch_size: 14
  tubelet_size: 2
  # window_size 는 surprise.window_size 에서 자동으로 채워진다 (48).
  use_rope: true
  uniform_power: false

  # 역할 배치는 공식 wrapper 와 동일하게 맞춘다:
  #   context <- encoder(online), target <- target_encoder(EMA)
  #   IntPhys2/prediction_evals/app/vjepa/modelcustom/default_wrapper.py
  #     h = self.target_encoder(x, full_mask)   # checkpoint_key: target_encoder
  #     context = self.encoder(x, masks_enc)    # checkpoint_key: encoder
  dual_encoder: true
  context_encoder_key: encoder
  target_encoder_key: target_encoder

  predictor: { embed_dim: 384, depth: 12, num_heads: 12, num_mask_tokens: 10 }
  dtype: float32
  autocast: bfloat16

surprise:
  # ★ 공식 IntPhys2 코드가 모델마다 config 를 나눠 둔다 (2026-09-21 확인):
  #     IntPhys2/prediction_evals/evals/intphys2/configs/videomaev2.yaml
  #       resolution 224 / frames_per_clip 16 / context_lengths [4,6,8,10,12,14] / frame_steps 10
  #     같은 폴더 vjepa_2.yaml 은 resolution 256 / frames_per_clip 48 / context [12,18,...,42].
  #   즉 M 도 해상도도 **데이터셋이 아니라 모델을 따라간다**. VideoMAEv2 는 RoPE 가 없고
  #   위치 임베딩이 sinusoid 표라 16 을 벗어나면 외삽이 되기 때문이다.
  window_size: 16                # ★ 공식 videomaev2.yaml frames_per_clip: 16 (사전학습 길이)                 # M — Table 8
  # prediction length -1 (= window 끝까지) 는 T = M - C 로 이미 그 동작이다.
  context_length_sweep: [4, 6, 8, 10, 12, 14]   # ★ 공식 videomaev2.yaml 그대로
  context_length: 8              # sweep 이 있으면 안 쓰인다
  stride: 2                       # 공식 config 의 stride_sliding_window: 2
  protocol: growing               # ★ Fig. 8B / max_context_mode
  distance: l1
  loss_exp: 1.0
  target_layer_norm: false       # 타깃이 정규화 픽셀이라 LN 을 걸지 않는다         # 공식도 target 에만 LN 을 건다 (preds 는 주석 처리돼 있다)
  aggregation: avg                # D.1 "We use average surprise unless specified otherwise"
  mask_index: 0                   # ckpt 에서 mask_tokens[0] 만 학습돼 있다 (1~9 는 전부 0)
  context_forward_mode: masked    # context encoder 가 context 토큰만 보게 한다 (train.py:435-438)
  max_window_batch: 2             # M=48 은 window 당 6144 토큰. ViT-H 라 L 의 절반으로.

evaluation:
  compute_pairwise: true
  compute_auroc: true
  pairing: type_matched           # SceneIndex x pair_id 안에서 1 possible + 1 impossible
  breakdown_by: [condition, difficulty, camera]
  ddp: true
  num_workers: 6
  prefetch_factor: 2
  pin_memory: true
  verbose: true
  log_every_videos: 25
  limit_videos: null

output:
  save_per_video: true
  save_per_window: true           # surprise-over-time 곡선 (Fig. 9) 을 그리려면 필요
  save_config: true
  plot_breakdowns: true
  plot_context_sweep: true
  plot_scene_curves: false
  scene_curve_indices: null
