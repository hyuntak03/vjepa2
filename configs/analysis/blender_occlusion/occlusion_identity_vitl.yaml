# =============================================================================
# OCCLUSION IDENTITY — V-JEPA 2 ViT-L (frozen encoder + predictor)
#
#   frame(0-idx):  0 ─ 7 │ ... │ 20 ──── 31 │ 32 ──── 39
#                  가시            슬랩 뒤      predictor 출력 구간
#
# 구조: features 에서 window(프레임 범위) x encoder 조합으로 "source" 를 정의하고,
#       experiments 리스트의 각 항목이 독립된 probing 실험 하나가 된다.
#       비싼 forward 는 전체에서 한 번만 돌고 토큰 캐시를 공유한다.
#
# 실행:
#   bash z_scripts/blender_occlusion/run.sh
#   python -m evals.analysis_vlm.occlusion_identity.eval --config <this> \
#          --device cuda:0 [--only exp1_linear_transfer] [--limit 8 --smoke]
#
# 토큰 산수 (ViT-L, 256px/patch16 -> S=256, tubelet 2): 8프레임 = 4 tubelet x 256
#   = 1024 tokens = "4 x N, D". 40프레임 전체 = 5120, context 32프레임 = 4096.
#
# 은닉 커버리지 (possible 291 scene, frames.csv). entry_frame 17~31 / reappear 33~35
# 라 window 가 뒤로 갈수록 은닉률이 오른다:
#     [ 0, 8) 은닉 0.000, 전부은닉   0/291   <- 완전 가시. probe fit 용
#     [20,28) 은닉 0.629, 전부은닉 119/291
#     [22,30) 은닉 0.736, 전부은닉 162/291
#     [24,32) 은닉 0.844, 전부은닉 191/291   <- "안 보이는데 읽히나" 에 가장 깨끗
# =============================================================================

tag: occlusion_identity_vitl
output_dir: /data/hyuntak/project/2026/2027_cvpr/vjepa2/z_exp/blender_occlusion/results/vitl

# -----------------------------------------------------------------------------
data:
  root: /local_datasets/world/blender_occlusion_dataset
  index_csv: index.csv
  n_frames: 40
  resolution: 256

  targets:                           # 분류 타깃. column/before_column 은 index.csv 컬럼명
    - name: shape
      column: shape_after            # 리빌 후 실제 렌더된 것
      before_column: shape           # occlusion 이전 정체성 (은닉 구간의 정답)
      classes: [bar, cross, cube, ell, ring, sphere, star, triangle]
    - name: color
      column: color_after
      before_column: color
      classes: ["#3CB44B", "#42D4F4", "#4363D8", "#911EB4",
                "#E6194B", "#F032E6", "#F58231", "#FFE119"]

  eval_variants:  [possible, imp_shape, imp_color]
  extra_variants: [imp_vanish]       # frames 32~39 물체 소멸 -> 리빌 후 라벨 정의 불가

  split:                             # mode: column (index.csv 의 split) | ratio (scene 기준 재분할)
    mode: column
    column: split
    train_value: train
    val_value: test
    group_by: scene_id
    train_frac: 0.5                  # mode: ratio 일 때만
    seed: 0

# -----------------------------------------------------------------------------
model:                               # schema = analysis.intphys2.model.build_from_config
  checkpoint: /data/hyuntak/project/2026/2027_cvpr/vjepa2/checkpoint/models--facebook--vjepa2-vitl-fpc64-256/snapshots/b3c1679b7c34d3255ef3547f27c7b226aefab26f/original/model.pth
  arch_name: vit_large
  img_size: 256
  patch_size: 16
  tubelet_size: 2
  window_size: 40                    # = data.n_frames
  use_rope: true
  uniform_power: false
  dual_encoder: true                 # train-faithful: context=online encoder, target=EMA
  context_encoder_key: encoder
  target_encoder_key: target_encoder
  predictor: { embed_dim: 384, depth: 12, num_heads: 12, num_mask_tokens: 10 }
  dtype: bfloat16

# -----------------------------------------------------------------------------
features:
  context_length: 32                 # frames 0..31 = context, 32..39 = predictor 출력
  mask_index: 0                      # 릴리즈 체크포인트에서 학습된 mask token 은 [0] 뿐
  # NOTE: encoder feature 의 affine-free LayerNorm 은 config 노브가 아니라 코드에 고정돼
  # 있다 (forward.py 의 _ln). app/vjepa/train.py:431-432 가 predictor 를
  # F.layer_norm(target_encoder(clip)) 에 회귀시키므로, 인코더 출력에 같은 LN 을 씌워야
  # predictor 출력과 같은 공간에 놓이고 head 이식이 성립한다. 끄면 조용히 깨진다.
  batch_size: 4
  num_workers: 6
  cache_dtype: float16
  cache_dir: /data/hyuntak/project/2026/2027_cvpr/vjepa2/z_exp/blender_occlusion/cache
                                     # attentive probe 는 토큰이 필요해서 pooled 가 아니라
                                     # 토큰을 캐시한다. base 시퀀스 단위로 저장해 겹치는
                                     # window 끼리 공유 -> 아래 구성 기준 약 29 GiB.

  # ---------------------------------------------------------------------------
  # windows = "영상의 어느 구간 토큰을 읽을 것인가"
  # 이름은 1-indexed(사람이 세는 방식), 값은 0-indexed 반개구간 [f0, f1) (코드가 쓰는 방식).
  #
  #   이름                값        사람 기준 프레임   프레임수  토큰    이 구간이 뭐냐
  #   visible_f1to8     [0, 8)      1 ~ 8 번째        8      1024   공이 100% 보임 (291/291 scene)
  #   occluded_f23to30  [22,30)    23 ~ 30 번째       8      1024   공이 슬랩 뒤 (은닉률 0.74,
  #                                                                 162/291 은 8프레임 내내 은닉)
  #   future_f33to40    [32,40)    33 ~ 40 번째       8      1024   predictor 가 예측하는 구간
  #   whole_f1to40      [0, 40)     1 ~ 40 번째      40      5120   클립 전체
  #   context_f1to32    [0, 32)     1 ~ 32 번째      32      4096   context 전체
  windows:
    visible_f1to8:    [0, 8]
    occluded_f23to30: [22, 30]
    future_f33to40:   [32, 40]
    whole_f1to40:     [0, 40]
    context_f1to32:   [0, 32]

  # ---------------------------------------------------------------------------
  # sources = (어느 인코더에) x (몇 프레임을 넣고) x (어느 구간 토큰을 읽는가)
  # 이름 규칙:  <인코더><넣은 프레임 수>__<읽은 토큰 구간>
  #
  # 인코더 3종:
  #   tgt   target encoder (EMA teacher). predictor 가 맞추도록 학습된 쪽.
  #   ctx   context encoder (online). predictor 에 실제로 입력되는 쪽.
  #   pred  predictor. context 만 보고 미래 8프레임을 상상한 출력.
  #
  # "넣은 프레임 수" 가 왜 중요한가:
  #   인코더는 causal mask 가 없는 완전 bidirectional 이다. 40프레임을 넣으면 23~30 구간
  #   토큰도 공이 보이던 1~20 프레임을 그냥 attend 한다. 그래서 8프레임'만' 넣은 버전
  #   (tgt8 / ctx8) 을 짝으로 둔다 — 그 경로를 끊은 대조군이고, 두 값을 비교하면
  #   "그 구간 픽셀에서 온 정보" 와 "문맥에서 attention 으로 흘러온 정보" 가 분리된다.
  #
  # 구현 메모: ctx32 는 context_encoder(clip40, masks=ctx_idx) 로 얻는다. 미래 토큰을
  #   transformer 이전에 버리므로 context_encoder(clip[:32]) 와 bit-identical 임을
  #   확인했고 (maxdiff 0.0), predictor 용 forward 를 그대로 재활용해 비용이 0 이다.
  #
  #                    넣은 프레임 = 전체        넣은 프레임 = 그 구간만(8f)
  #   target(EMA)      tgt40__*                 tgt8__*
  #   context(online)  ctx32__*                 ctx8__*
  sources:
    # ---- target encoder, 40프레임 입력 --------------------------------------
    - {name: tgt40__whole,     encoder: target,          window: whole_f1to40}
    - {name: tgt40__visible,   encoder: target,          window: visible_f1to8}
    - {name: tgt40__occluded,  encoder: target,          window: occluded_f23to30}
    - {name: tgt40__future,    encoder: target,          window: future_f33to40}
    # ---- target encoder, 그 8프레임만 입력 ----------------------------------
    - {name: tgt8__visible,    encoder: isolated_target, window: visible_f1to8}
    - {name: tgt8__occluded,   encoder: isolated_target, window: occluded_f23to30}
    # ---- context encoder, 32프레임 입력 -------------------------------------
    - {name: ctx32__context,   encoder: ctx_masked,      window: context_f1to32}
    - {name: ctx32__visible,   encoder: ctx_masked,      window: visible_f1to8}
    - {name: ctx32__occluded,  encoder: ctx_masked,      window: occluded_f23to30}
    # ---- context encoder, 그 8프레임만 입력 ---------------------------------
    - {name: ctx8__visible,    encoder: isolated_ctx,    window: visible_f1to8}
    - {name: ctx8__occluded,   encoder: isolated_ctx,    window: occluded_f23to30}
    # ---- predictor ----------------------------------------------------------
    - {name: pred__future,     encoder: predictor,       window: future_f33to40}

# -----------------------------------------------------------------------------
# =============================================================================
# experiments — 항목 하나가 독립된 실험. title/question/expect/read_as 는 결과
# summary.txt 맨 위에 그대로 찍히므로, 나중에 결과만 봐도 "뭘 물어본 실험인지" 가 남는다.
#
# 필드:
#   name / title / question / expect / read_as   설명. 결과 파일에 출력됨
#   fit_on              head 를 학습할 source (하나)
#   fit_labels          before(가림 이전 물체) | after(리빌 후 물체)
#   fit_variants        학습에 쓸 variant
#   apply_to            학습된 head 를 frozen 상태로 그대로 적용할 source 들
#   probe               {type: linear, pooling: mean, pre_norm: true}
#                       {type: attentive, num_heads: 16, num_probe_blocks: 1}
#   optimization        num_epochs / batch_size / lr / weight_decay (AdamW, 상수 lr)
#   independent_probes  apply_to 의 각 source 에 자체 head 도 따로 학습 -> 디코딩 상한
#   targets             (선택) data.targets 중 쓸 것. 생략하면 shape+color 둘 다
# =============================================================================
experiments:

  - name: exp1_target_40f
    title: "target encoder + 40프레임 전체 — 기준선"
    question: >
      영상 전체를 통째로 넣었을 때 물체의 shape/color 가 표현에서 얼마나 읽히는가.
      이후 모든 실험의 비교 기준이 된다.
    expect: >
      가장 높게 나와야 정상. 단 mean pooling 이라 24px 공이 256개 spatial token 으로
      희석되므로, 특히 color 는 절대값이 낮게 나올 수 있다.
    read_as: >
      apply_to 의 네 source 는 인코더도 입력도 동일하고 '읽은 토큰 구간' 만 다르다.
      따라서 네 값의 차이는 순수하게 구간 차이다.
    fit_on: tgt40__whole
    fit_labels: before
    fit_variants: [possible]
    apply_to: [tgt40__whole, tgt40__visible, tgt40__occluded, tgt40__future]
    probe: {type: linear, pooling: mean, pre_norm: true}
    optimization: {num_epochs: 200, batch_size: 16, lr: 0.001, weight_decay: 0.01}
    independent_probes: true

  - name: exp2_ctx_visible8f
    title: "context encoder + 1~8 프레임만 — 물체가 보일 때의 상한"
    question: >
      공이 100% 보이는 8프레임만 넣었을 때 정체성이 얼마나 읽히는가.
      다른 프레임이 입력에 아예 없으므로 '순수하게 그 픽셀에서 읽은 값' 이다.
    expect: >
      이 값이 낮으면 그 아래 실험들의 해석이 전부 무의미해진다. 먼저 확인할 것.
    read_as: >
      ctx32__visible 과 비교하면 '입력 길이' 효과만 분리된다(인코더 동일).
      tgt8__visible 과 비교하면 'EMA vs online 인코더' 효과만 분리된다(입력 동일).
    fit_on: ctx8__visible
    fit_labels: before
    fit_variants: [possible]
    apply_to: [ctx8__visible, ctx32__visible, tgt8__visible, tgt40__visible]
    probe: {type: linear, pooling: mean, pre_norm: true}
    optimization: {num_epochs: 200, batch_size: 16, lr: 0.001, weight_decay: 0.01}
    independent_probes: true

  - name: exp3_ctx_occluded
    title: "가려진 구간(23~30프레임) 토큰에 정체성이 남아 있는가"
    question: >
      공이 슬랩 뒤에 있어 화면에 안 보이는 구간의 토큰에서도 shape/color 가 읽히는가.
      읽힌다면 그 정보는 어디서 왔는가.
    expect: >
      ctx32__occluded(32프레임 입력)는 높고, ctx8__occluded(그 8프레임만 입력)는
      chance(0.125) 여야 한다. 그 8프레임 화면에는 물체가 실제로 없기 때문이다.
    read_as: >
      두 값의 격차가 곧 '문맥에서 attention 으로 흘러온 정보' 의 크기다.
      ctx8 쪽이 chance 보다 유의하게 높으면 슬랩/그림자가 뭔가 흘리고 있다는 뜻이므로
      데이터셋을 의심해야 한다. hidOnly 컬럼(8프레임 내내 완전 은닉된 162 scene)을 볼 것.
      주의: 여기서 높게 나오더라도 '물체 영속성을 추적한다' 는 주장은 못 한다.
      평범한 temporal attention 으로 설명 가능하기 때문이다.
    fit_on: ctx32__occluded
    fit_labels: before
    fit_variants: [possible]
    apply_to: [ctx32__occluded, ctx8__occluded, tgt40__occluded, tgt8__occluded]
    probe: {type: linear, pooling: mean, pre_norm: true}
    optimization: {num_epochs: 200, batch_size: 16, lr: 0.001, weight_decay: 0.01}
    independent_probes: true

  - name: exp4_predictor_presence
    title: "predictor 가 상상한 미래(33~40)에 정체성 정보가 존재하는가"
    question: >
      predictor 출력만으로 shape/color 를 맞출 수 있는가. 존재 여부만 본다
      (인코딩 방식이 같은지는 exp5 가 본다).
    expect: >
      chance(0.125)보다 확실히 높아야 predictor 가 정체성을 미래로 전파한다고 말할 수 있다.
    read_as: >
      predictor 는 공유 context 만 보므로 한 scene 의 4개 variant 에서 출력이 완전히
      동일하다(편차 0.0 확인). 따라서 정답 라벨은 반드시 before 이고, 4개 variant 의
      acc_before 가 전부 같은 값으로 찍히면 파이프라인이 정상 동작한 것이다.
      future__target 은 '실제로 렌더된 33~40' 이라 predictor 값의 천장 역할을 한다.
    fit_on: pred__future
    fit_labels: before
    fit_variants: [possible]
    apply_to: [pred__future, tgt40__future]
    probe: {type: linear, pooling: mean, pre_norm: true}
    optimization: {num_epochs: 200, batch_size: 16, lr: 0.001, weight_decay: 0.01}
    independent_probes: true

  - name: exp5_transfer_to_predictor
    title: "같은 정보가 같은 방식으로 encoding 되는가 (head 이식)"
    question: >
      물체가 보이는 1~8 프레임에서 학습한 linear head 를 frozen 그대로 predictor 의
      상상 미래에 적용했을 때도 읽히는가. 정보의 '존재' 가 아니라 '표현 형식의 동일성' 을 본다.
    expect: >
      이식값이 pred__future 의 indep(자체 학습 상한)에 가까울수록, predictor 가 정체성을
      인코더와 같은 방향으로 써 둔다는 뜻이다.
    read_as: >
      acc_before 가 주 지표. indep 과의 격차가 '정보는 있는데 인코딩 방식이 다르다' 의 크기다.
      acc_after 는 imp_shape/imp_color 에서 붕괴해야 정상인데, 이는 predictor 가 바뀐 물체를
      알 수 없으므로 구조상 당연한 결과다 — 모델에 대한 발견이 아니라 정합성 확인으로 읽을 것.
      fit 을 target encoder 로 하는 것이 필수다: predictor 는
      F.layer_norm(target_encoder(clip)) 에 회귀하도록 학습됐으므로(app/vjepa/train.py:431-432)
      context encoder 로 fit 하면 두 표현이 서로 다른 공간에 놓인다.
    fit_on: tgt8__visible
    fit_labels: before
    fit_variants: [possible]
    apply_to: [tgt8__visible, pred__future, tgt40__future, ctx32__occluded, tgt40__occluded]
    probe: {type: linear, pooling: mean, pre_norm: true}
    optimization: {num_epochs: 200, batch_size: 16, lr: 0.001, weight_decay: 0.01}
    independent_probes: true

# -----------------------------------------------------------------------------
report:
  save_features: false
