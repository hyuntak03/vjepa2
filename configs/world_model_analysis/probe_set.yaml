# =============================================================================
# PROBE SET — 표현 probing (정보가 존재하는가 / 인코더 head 가 predictor 에서도 통하는가)
#
# 데이터: /local_datasets/world/world_analysis/blender_probe_set  (2026-08-15 재렌더본)
#   1024 video, 40 frames @ 8fps, 256x256, obj 24px (프레임당 토큰 2.25/256)
#   가림 없음 (occluder = 0 전부)  <- occlusion 셋과의 핵심 차이
#   정지 512 / 이동 512 (speed_px_f 0 / 2 / 3 / 4)
#   shape 8종 x128, color 8종 x128, floor_color 8종 x128 완전 균등
#   라벨 상호정보량 확인: shape-color 0.000 / shape-floor 0.000 / color-floor 0.000
#     -> 배경 바닥색을 읽어서 물체 라벨을 맞히는 교란이 없다. chance = 최빈 = 0.125.
#   위 값은 재렌더본에서 전부 다시 검증했다 (스키마·분포 모두 이전과 동일).
#   dataset_info.json 도 같은 값을 명시한다:
#     context_frames [0,31] / target_frames [32,39] / obj_px 24 / speeds [2,3,4]
#
# ⚠️ 이전 렌더(2026-08-13)로 낸 결과와 토큰 캐시는 아래로 보관해 두었다.
#     결과  z_exp/world_model_analysis/results/_previous_probe_set_20260813/
#     캐시  /local_datasets/world/world_analysis/cache/_previous_20260813/probe_set_v2_vitl
#     문서  z_world_model_analysis/probe_set_2026-08-13_PREVIOUS-DATA.md
#   video_id 1024개가 옛/새 완전히 같아서 TokenCache.matches() 가 그냥 통과한다
#   (video_ids / 토큰 수 / dtype 만 비교한다). 캐시를 치우지 않으면 재렌더 후에도
#   옛 feature 를 조용히 재사용하므로, 데이터를 다시 만들면 캐시도 반드시 같이 치울 것.
#
# ⚠️ row_id 가 비디오당 고유하다 (1024개). 같은 물체를 여러 크기로 렌더한 반복이 없으므로
#    split.group_by 는 row_id 로 충분하다. 만약 나중에 크기 반복이 생기면 그때 묶어야 한다.
#
# 프레임 구간 (0-idx 반개구간, 이름은 사람이 세는 1-idx)
#   f1to8   [0,8)    1~8    물체가 잘 보이는 앞 구간
#   f33to40 [32,40)  33~40  predictor 가 예측하는 구간 (= target_start=32..39)
#   8프레임 = 4 tubelet x 256 spatial = 1024 tokens ("4 x N, D")
#
# 실행:  bash z_scripts/world_model_analysis/run_probe_set.sh
# =============================================================================

eval_name: world_model_analysis   # evals/main.py 가 이 이름으로
                                  # evals/world_model_analysis/eval.py::main 을 호출한다
tag: probe_set_v2_vitl
output_dir: /data/hyuntak/project/2026/2027_cvpr/vjepa2/z_exp/world_model_analysis/results/probe_set_v2

data:
  root: /local_datasets/world/world_analysis/blender_probe_set
  index_csv: index.csv
  n_frames: 40
  resolution: 256

  group_column: is_static           # 결과 표의 기본 행 구분. '1'=정지 / '0'=이동
  eval_groups: ["1", "0"]           # ⚠️ 코드가 읽지 않는 키다. per_group 행은 데이터에
                                    #    실제로 있는 group_column 값에서 자동으로 나온다.
                                    #    평가 대상을 실제로 좁히려면 probing.eval_variants 를 쓸 것.
  strata: [speed_px_f]              # ⚠️ Rec.strata 에 실리기만 하고 리포트에는 안 나온다.
                                    #    speed 별로 쪼개 보려면 지금은 group_column 을 바꿔야 한다.

  split:
    mode: ratio                     # index.csv 의 split 컬럼을 무시하고 재분할
    group_by: row_id                # row_id 가 비디오당 고유하므로 사실상 비디오 단위.
                                    # (occlusion 과 달리 여기엔 context/future 를 공유하는
                                    #  짝이 없어서 더 묶을 것이 없다.)
    train_frac: 0.5
    seed: 0
    stratify_by: is_static          # 정지/이동 각각 50/50. 층별 학습(fit_groups)을 쓸 때
                                    # 비율이 흔들리지 않도록 고정.

model:
  checkpoint: /data/hyuntak/project/2026/2027_cvpr/vjepa2/checkpoint/models--facebook--vjepa2-vitl-fpc64-256/snapshots/b3c1679b7c34d3255ef3547f27c7b226aefab26f/original/model.pth
  arch_name: vit_large
  img_size: 256
  patch_size: 16
  tubelet_size: 2
  window_size: 40
  use_rope: true
  uniform_power: false
  dual_encoder: true                # context=online encoder, target=EMA (train-faithful)
  context_encoder_key: encoder
  target_encoder_key: target_encoder
  predictor: { embed_dim: 384, depth: 12, num_heads: 12, num_mask_tokens: 10 }
  dtype: bfloat16

features:
  context_length: 32                # 1~32 가 context, 33~40 이 predictor 출력 구간
  mask_index: 0
  batch_size: 4
  num_workers: 6
  cache_dtype: float16
  cache_dir: /local_datasets/world/world_analysis/cache
                                    # attentive probe 는 토큰 집합이 필요해서 pooled 가 아니라
                                    # 토큰을 캐시한다. base 시퀀스 단위 저장으로 겹치는 window 공유.
                                    #
                                    # ⚠️ 여기는 반드시 로컬 디스크여야 한다. 위 경로는
                                    #    /data2 (xfs, 여유 328G) 로 가는 symlink 다.
                                    #    /data 는 NFS 라 쓰기가 57MB/s 뿐이고 (/data2 는 319MB/s,
                                    #    로컬 nvme 는 1.9GB/s) 이 셋의 캐시가 21.5GB 라
                                    #    NFS 에 두면 쓰기에만 6분 넘게 쓴다. 실측으로 확인함.
                                    #    nvme(/)는 더 빠르지만 여유가 59G 뿐이라 occlusion(35.7G)
                                    #    까지 같이 두기엔 모자라서 /data2 를 쓴다.

# =============================================================================
# PROBING — occlusion_v2.yaml 과 완전히 같은 4축 스키마
#
#   model    context | target | predictor
#              context   = context_encoder (online). predictor 에 입력되는 쪽
#              target    = target_encoder (EMA). predictor 가 맞추도록 학습된 쪽
#              predictor = predictor 출력. input/frames 자동 고정 (context 32f -> 33~40)
#   input    full | window
#              full   = 40프레임 클립 전체를 넣고 frames 구간 토큰만 읽는다
#              window = frames 구간 프레임'만' 독립 클립으로 넣는다 (문맥 경로 차단 대조군)
#   frames   [시작, 끝]  1-idx 양끝 포함. tubelet(2) 정렬 필수.
#              [1,32] -> 4096 tokens (16N, D)   [33,40] / [1,8] -> 1024 tokens (4N, D)
#              context 모델은 [*,32] 이내여야 한다.
#   train    ind | {model/input/frames}
#              ind  = 그 표현 자체로 학습·평가 (= 정보 존재 여부)
#              스펙 = 거기서 학습한 head 를 frozen 그대로 이 표현에 적용 (= 이식)
#   fit_groups (선택) 학습에 쓸 group_column 값. 생략하면 eval_groups 전체.
#              ["0"]=이동만 / ["1"]=정지만 -> 운동 상태 간 일반화를 본다.
#
# ⚠️ 이 데이터셋에는 위반(impossible) 변이가 없다. 따라서 surprise 채점은 불가능하고
#    probing 만 한다. 가림도 없어서(occluder=0) occlusion 셋과의 대조군 역할을 한다.
# =============================================================================
probing:
  enabled: true
  probe: attentive
  optim:  attn_default

  probes:
    attentive: { type: attentive, num_heads: 16, num_probe_blocks: 4 }   # 49.3M
    linear:    { type: linear, pooling: mean, pre_norm: true }           # 8K
  optims:
    attn_default: { num_epochs: 50,  batch_size: 16, lr: 0.0001, weight_decay: 0.05 }
    linear_conv:  { num_epochs: 400, batch_size: 16, lr: 0.001,  weight_decay: 0.01 }

  # 변이가 없으므로 before/after 구분이 없다. column 을 그대로 정답으로 쓴다.
  targets:
    shape: { column: shape,
             classes: [bar, cross, cube, ell, ring, sphere, star, triangle] }
    color: { column: color,
             classes: ["#3CB44B","#42D4F4","#4363D8","#911EB4",
                       "#E6194B","#F032E6","#F58231","#FFE119"] }

  # ── fit_groups sweep ──────────────────────────────────────────────────────
  # 아래 runs 를 이 목록의 각 그룹으로 한 번씩 반복 실행한다.
  # 학습은 항상 한쪽(이동 또는 정지) 안에서만 하고, 평가는 양쪽 다 낸다
  # (per_group 표에 '0'/'1' 이 모두 찍히므로 분포 내/밖을 같이 볼 수 있다).
  # null 로 두면 전체(이동+정지)로 한 번만 학습한다.
  fit_groups_sweep: [["0"], ["1"]]

  # ── runs — train 1개당 head 1개, eval 목록만큼 평가 ─────────────────────────
  # ★ head 는 train 스펙마다 딱 한 번만 학습되고, eval 에 나열한 모든 표현에
  #   frozen 상태로 적용된다. 같은 표현에서 학습한 head 를 두 번 만들지 않는다.
  #   ('self' = train 표현 자기 자신에서의 성능 = 정보 존재 여부 = 상한)
  runs:
    # 1. context encoder 출력 (16N, D) — 정보 존재 여부만
    - train: { model: context, input: full, frames: [1, 32] }
      eval:  [ self ]

    # 2. target encoder 예측 구간 (4N, D) 에서 학습한 head 하나로
    #    (a) 자기 자신 = 상한, (b) predictor 출력 이식  두 결과를 동시에 낸다
    - train: { model: target, input: full, frames: [33, 40] }
      eval:  [ self, { model: predictor } ]

    # 3. predictor 출력 (4N, D) 자체 학습 = predictor 의 정보 존재 여부(천장)
    - train: { model: predictor }
      eval:  [ self ]

    # (선택) 대조군 — window 입력으로 문맥 경로를 끊었을 때
    # - train: { model: target, input: window, frames: [33, 40] }
    #   eval:  [ self, { model: predictor } ]

report:
  confusion: true
  save_features: false
