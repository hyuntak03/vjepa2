# =============================================================================
# PROTOCOL — Attentive probing, z / p / h 세 지점에서 정체성을 읽는다
#
#   bash z_research/scripts/run.sh attn_probe v8 vith
#
#   z = context encoder   frames [1,16]   (raw 0~45)   2048 tokens
#   p = predictor 출력    frames [17,32]  (raw 48~93)  2048 tokens   <- 자동 고정
#   h = target encoder    frames [17,32]  (raw 48~93)  2048 tokens   <- 상한/대조군
#   2048 = (16 / tubelet 2) x (256/16)^2.  세 지점이 전부 같은 shape 라 직접 비교된다.
#
# 읽는 법
#   정보손실 = (h self) - (p self)      predictor 안에서 사라진 양
#   정렬손실 = (p self) - (h->p)        h 로 학습한 head 가 p 에서 못 읽는 양
#
#   확립된 수치 (v8, shape/color): z 100/94.5 · h 100/96.6 · p 90.2/70.7 · h->p 48.0/49.9
#   가림 조건만:                    z 100/93.1 · h 100/96.8 · p 82.0/54.5 · h->p 14.8/14.8 (chance)
#   ★ env(배경) 대조군이 핵심이다. 같은 가림 조건에서 env 는 z/h/p self 100% 에
#     h->p 이식도 99.2% 로 멀쩡하다. "가림이 표현을 전반적으로 망가뜨린다" 도,
#     "p 와 h 가 서로 다른 공간에 산다" 도 아니다 — 물체 정체성만 선택적으로 무너진다.
#
# ⚠️ 이 분해는 *증상*이다. 기전은 alpha 분해를 볼 것:
#     z_world_model_analysis/PREDICTOR_HEDGING_2026-08-26.md
#     python z_world_model_analysis/alpha_hedging.py   (캐시만, GPU 불필요)
#
# ── 이 프로토콜이 데이터셋에 요구하는 것 ─────────────────────────────────────
#   index_probe.csv 가 있어야 한다:  python z_scripts/world_model_analysis/build_probe_index.py <셋>
#   필요한 컬럼: probe_type(obj/empty/imp), condition, shape_pre, color_pre, env
#   아래 data: 가 datasets.md 의 index_csv / type_column / group_column 을 덮어쓴다.
#
# ── 지켜야 할 것 ─────────────────────────────────────────────────────────────
# 1) 가능(possible) 변이만 — block_types: [obj]. 불가능을 넣으면 세 표현이 전부 오염된다:
#      contextF 는 미래 토큰을 transformer 이전에 떨궈 imp_ab 가 pos_a 와 비트 단위 동일
#      pred 도 입력이 context 뿐이라 동일 (같은 텐서를 라벨만 바꿔 두 번 넣는 셈)
#      targetF 는 라벨이 _pre 인데 렌더는 _post 라 인코더가 정확할수록 0점
#    obj 만 남기면 shape_pre == shape_post 가 보장돼 _pre 를 라벨로 써도 안전하다.
# 2) split 은 block 단위 — block 안 4개는 context/future 를 2x2 로 공유한다.
# 3) dtype 은 bfloat16 — probing 관례다. surprise 의 fp32+fp16autocast 와 섞지 말 것.
#
# ⚠️ 재현성 — p self 는 30ep 로 수렴하지 않아 DDP allreduce 순서 때문에 실행마다
#    최대 20pt 흔들린다 (shape 90.2 / 80.7 / 90.5). train_acc = 1.000 인 셀
#    (contextF, targetF)은 비트 단위로 재현된다. **대조는 이식 줄에 한해 읽을 것.**
#    결정론이 필요하면 GPUS=1, 또는 z_world_model_analysis/p_self_confusion.py (ddp=False).
#
# ⚠️ split.stratify_by 가 condition 이라 조건은 균등하지만 **클래스는 아니다**.
#    실측 v8 color: yellow train 28 / green 68 (2.4배). yellow 가 가림에서 recall 21% 인 게
#    표현 탓인지 표본 탓인지 아직 안 갈렸다. shape 은 40~58 로 그나마 고르다.
#
# ⚠️ 교란 — occluded 조건에만 가림막이 장면에 추가로 있다. "가려짐"과 "가림막이
#    화면에 있음"이 아직 분리되지 않았다.
# =============================================================================
eval_name: world_model_analysis

data:
  n_frames: 32                    # surprise_c16t32 와 같은 프레임 배치 (stride 는 datasets.md)
  resolution: 256
  index_csv: index_probe.csv      # ★ datasets.md 의 index.csv 를 덮어쓴다
  type_column: probe_type         # ★ obj / empty / imp  (build_probe_index.py 산출)
  group_column: condition         # ★ per_group 표의 행 = 이 실험의 핵심 축 (4조건)
  # ⚠️ fit_variants / eval_variants 는 group_column 값으로 거르는 키라 여기서는 못 쓴다.
  #    probing.block_types: [obj] 가 "가능 + 물체 있음"만 남기는 같은 역할을 한다.
  split:
    mode: ratio
    group_by: block_id            # block 안 4개는 context/future 를 2x2 로 공유한다
    train_frac: 0.5
    seed: 0
    stratify_by: condition        # 조건은 균등해진다 (클래스는 아니다 — 위 경고 참고)

model:
  img_size: 256
  patch_size: 16
  tubelet_size: 2
  window_size: 32                 # = data.n_frames. predictor RoPE grid_depth 가 여기서 정해진다
  use_rope: true
  uniform_power: false
  dual_encoder: true
  context_encoder_key: encoder
  target_encoder_key: target_encoder
  predictor: { embed_dim: 384, depth: 12, num_heads: 12, num_mask_tokens: 10 }
  dtype: bfloat16                 # ★ probing 관례

features:                         # ⚠️ 없으면 surprise 로 폴백해 cache_dir KeyError 로 죽는다
  context_length: 16              # 1~16 이 context, 17~32 가 predictor 출력 구간
  mask_index: 0
  # ⚠️ batch_size 는 4 가 최적이다. **키우면 오히려 느려진다** — 실측(ViT-H, v10, 4090):
  #    bs 4 -> 118 ms/clip · 8 -> 141 · 12 -> 146 · 16 -> 152 · 24 -> 143.
  #    32프레임 클립 하나가 이미 GPU 를 채워서, 배치를 키워도 얻는 게 없고 VRAM 만 쓴다
  #    (peak 2.9 -> 5.5 GiB). "GPU 를 더 쓰자"고 올리지 말 것.
  batch_size: 4
  # 디코딩(PNG 32장, 단일 스레드 172 ms/clip)을 forward 와 겹치는 워커 수.
  # 0 = 자동 = min(8, 할당 CPU / world_size). 실측 8워커에서 38 ms/clip 로
  # forward(118) 아래로 내려가 완전히 숨는다. 16 은 과다구독으로 52 ms 로 악화.
  decode_workers: 0
  prefetch_batches: 2             # 미리 디코딩해 둘 배치 수
  cache_dtype: float16
  # ⚠️ 반드시 로컬 디스크. /data 는 NFS(쓰기 57MB/s)라 셋당 약 40GB 캐시를 두면 10분을 버린다.
  #    아래는 /data2(xfs) 로 가는 symlink. 캐시 이름은 tag = <cache_tag>_<모델> 이다.
  cache_dir: /local_datasets/world/world_analysis/cache

probing:
  enabled: true
  probe: attentive
  optim:  attn_30
  probes:
    # ⚠️ num_probe_blocks 는 **cross-attention 앞에 얹는 self-attention 층 수**다.
    #    depth=1 이면 cross-attention 하나 = V-JEPA 의 attentive pooler 그대로(분야 표준).
    #    depth=4 는 2048 토큰 self-attention 3층이 붙어 비용이 ~100배인데,
    #    2026-08-30 실측(v10, shape, pooled)에서 **더 나빴다**:
    #        p self   depth4 94.69 / depth1 96.35   train_acc 0.961 -> 0.998
    #        sta+occ  depth4 82.70 / depth1 87.53
    #        fit      depth4 418.7s(8GPU) / depth1 204.7s(1GPU)   -> 처리량 ~16배
    #    과대용량이 수렴을 방해했다 (§7-3 의 포화 경고와 같은 뿌리).
    attentive: { type: attentive, num_heads: 16, num_probe_blocks: 1 }
    linear:    { type: linear, pooling: mean, pre_norm: true }
  optims:
    attn_30:  { num_epochs: 35,  batch_size: 16, lr: 0.0001, weight_decay: 0.05 }
  targets:
    shape: { column: shape_pre,
             classes: [capsule, cone, cube, cylinder, narrowcap, pyramid, sphere, torus] }
    color: { column: color_pre,
             classes: [blue, cyan, green, magenta, orange, purple, red, yellow] }

    env:   { column: env,
             classes: [checker_steel, concrete_brick, grass_hewn, hex_rust] }

  block_types: [obj]              # v8 기준 768개 (조건당 192). empty 256 / imp 1024 제외
  # 첫 항목 null = pooled(4조건 전부로 head 하나). 나머지 넷 = 조건별 head.
  # ★ 한 번에 같이 돌려야 같은 split/캐시 위에서 직접 비교된다.
  #
  # ⚠️ fit_groups_sweep 는 **학습 마스크만** 제한한다. 평가는 여전히 4조건 전부를 돈다
  #    (eval.py: fit_m = train_m & group_mask -> for g in ds.groups).
  #    그래서 조건별 head 는 4x4 학습→평가 행렬을 준다. 비대각선이 핵심이다 —
  #    가림으로 학습한 head 가 비가림을 읽어내면 정체성 부호화가 조건 간 공유된다는 뜻이고,
  #    그러면 pooled 의 낙차는 "공용 head 의 타협" 이 아니라 정보 문제로 좁혀진다.
  #
  # ⚠️ 표본이 1/4 로 준다. v10 은 조건별 378개(8-way 클래스당 47.2, min 36)라 쓸 만하지만
  #    v8 은 97개(클래스당 12.1, min 8)라 얇다. **pooled 대각선과 조건별 대각선의 차이가
  #    곧 표본 감소의 대가**이니 그걸 먼저 재고 조건 간 차이를 읽을 것.
  #
  # 비용: target 당 head 3 -> 15개. 토큰 캐시는 공유하므로 feature 재추출은 없다.
  # auto = 데이터의 group_column 값을 읽어 [null, [g1], [g2], ...] 를 만든다.
  # 조건 구성이 다른 데이터셋(v10_flat 은 2조건, v11 은 6조건)에도 그대로 쓰인다.
  # probing 대상(block_types)이 없는 group 은 자동으로 빠진다 — 학습셋 0 이면 eval.py 가 죽는다.
  fit_groups_sweep: auto

  # ── runs — train 1개당 head 1개, eval 목록만큼 frozen 적용 ───────────────────
  runs:
    # 1. context encoder (z) — 문맥 표현에 정보가 있는가
    - train: { model: context, input: full, frames: [1, 16] }
      eval:  [ self ]
    # 2. target encoder (h) 에서 학습한 head 하나로
    #    자기 자신(=상한)과 predictor 이식을 동시에 낸다  <- 정렬손실은 여기서 나온다
    - train: { model: target, input: full, frames: [17, 32] }
      eval:  [ self ]
      # eval:  [ self, { model: predictor } ]
    # 3. predictor (p) 자체 학습 = predictor 안의 정보 존재 여부(천장)
    - train: { model: predictor }
      eval:  [ self ]
