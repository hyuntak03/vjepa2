# =============================================================================
# IntPhys 1 layer-wise LINEAR PROBING — V-JEPA 2 ViT-L
# "Interpreting Physics in Video World Models" 재현 (Appendix B 그대로)
#
# 논문이 명시한 것 (Appendix B, p13 전문)
#   "For all experiments, we trained linear probes of the form f(hℓ) = W hℓ + b
#    on spatiotemporally pooled activations from each layer ℓ ∈ {0,...,n−1} of the
#    frozen n-layer encoder. We performed a hyperparameter sweep over 20
#    configurations, with learning rates {10⁻⁴, 3×10⁻⁴, 10⁻³, 3×10⁻³, 5×10⁻³}
#    and weight decay {0.01, 0.1, 0.4, 0.8}, selecting the best model based on
#    validation performance. We used 5-fold grouped cross-validation and report
#    results as mean ± standard deviation across folds."
#   §3.2 : "linear probes on mean-pooled space–time patches", "probe the residual
#           stream at every layer"
#   §4.1 : IntPhys 에서 matched possible / impossible 쌍의 이진 분류
#   C.11 : "IntPhys: Binary logistic regression (possible vs. impossible),
#           trained with cross-entropy loss"
#
# 논문이 침묵하는 것 -> 아래 값으로 채웠고, 근거를 같이 적어둔다
#   optimizer   : Appendix B 는 언급 없음. 논문에서 optimizer 를 명시한 유일한 곳이
#                 C.11 의 "Adam" 이라 adam 을 쓴다. wd 가 0.8까지 가므로 AdamW(decoupled)
#                 와 결과가 실제로 갈린다 -> 논문에 있는 쪽을 따른다.
#   epochs      : Appendix B 는 언급 없음. C.11 의 IntPhys 값 50 을 쓴다.
#   schedule    : 언급 없음 -> 상수 lr/wd, warmup 없음 (start=lr=final).
#   frame 샘플링: 언급 없음 -> keystone(위반 프레임) 중심 16프레임.
#                 IntPhys 는 possible/impossible 이 breakpoint 한 프레임에서만 갈리는데
#                 tick 이 17~89 (median 52) 로 흩어져 있어, 영상 중앙을 자르면 약 60%가
#                 breakpoint 를 놓친다. 균등 샘플링도 마찬가지다.
#
# 데이터: /local_datasets/world/world_analysis/IntPhys1_dev_videos (360 video, 100f, 288²)
#   z_scripts/analysis/build_intphys1_probing_data.py 가
#   data_csv/IntPhys1_dev/{keystones.json, cv/{train,val}_fold{0..4}.csv} 를 만든다.
#   라벨 1 = impossible. fold 는 quadruplet 단위 (90 quad -> fold 당 18 quad = 72 video).
#
# 실행 (5-fold 를 돌리며 __TAG__/__TRAIN_CSV__/__VAL_CSV__ 를 치환):
#   bash z_scripts/run_5fold.sh configs/analysis/probing/intphys1_vitl.yaml
# =============================================================================
eval_name: analysis_vlm
folder: /data/hyuntak/project/2026/2027_cvpr/vjepa2/configs/analysis/probing/logs
num_workers: 8
resume_checkpoint: false
val_only: false
tag: __TAG__

experiment:
  analysis:
    model: vjepa
    stages:
      vision_encoder: all           # 모든 layer ℓ ∈ {0..23} 의 residual stream
    plot: true
    plot_pez: [0.2, 0.4]            # Physics Emergence Zone 밴드 (논문 Fig 1)

    # ---- Appendix B: lr 5개 x wd 4개 = 20 configs -------------------------
    # 전부 상수 스케줄 (start_lr = lr = final_lr, warmup 0).
    probes:
      - { type: linear, pooling: mean, optimization: { lr: 0.0001, weight_decay: 0.01, start_lr: 0.0001, final_lr: 0.0001, final_weight_decay: 0.01, warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.0001, weight_decay: 0.1,  start_lr: 0.0001, final_lr: 0.0001, final_weight_decay: 0.1,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.0001, weight_decay: 0.4,  start_lr: 0.0001, final_lr: 0.0001, final_weight_decay: 0.4,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.0001, weight_decay: 0.8,  start_lr: 0.0001, final_lr: 0.0001, final_weight_decay: 0.8,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.0003, weight_decay: 0.01, start_lr: 0.0003, final_lr: 0.0003, final_weight_decay: 0.01, warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.0003, weight_decay: 0.1,  start_lr: 0.0003, final_lr: 0.0003, final_weight_decay: 0.1,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.0003, weight_decay: 0.4,  start_lr: 0.0003, final_lr: 0.0003, final_weight_decay: 0.4,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.0003, weight_decay: 0.8,  start_lr: 0.0003, final_lr: 0.0003, final_weight_decay: 0.8,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.001,  weight_decay: 0.01, start_lr: 0.001,  final_lr: 0.001,  final_weight_decay: 0.01, warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.001,  weight_decay: 0.1,  start_lr: 0.001,  final_lr: 0.001,  final_weight_decay: 0.1,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.001,  weight_decay: 0.4,  start_lr: 0.001,  final_lr: 0.001,  final_weight_decay: 0.4,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.001,  weight_decay: 0.8,  start_lr: 0.001,  final_lr: 0.001,  final_weight_decay: 0.8,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.003,  weight_decay: 0.01, start_lr: 0.003,  final_lr: 0.003,  final_weight_decay: 0.01, warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.003,  weight_decay: 0.1,  start_lr: 0.003,  final_lr: 0.003,  final_weight_decay: 0.1,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.003,  weight_decay: 0.4,  start_lr: 0.003,  final_lr: 0.003,  final_weight_decay: 0.4,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.003,  weight_decay: 0.8,  start_lr: 0.003,  final_lr: 0.003,  final_weight_decay: 0.8,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.005,  weight_decay: 0.01, start_lr: 0.005,  final_lr: 0.005,  final_weight_decay: 0.01, warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.005,  weight_decay: 0.1,  start_lr: 0.005,  final_lr: 0.005,  final_weight_decay: 0.1,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.005,  weight_decay: 0.4,  start_lr: 0.005,  final_lr: 0.005,  final_weight_decay: 0.4,  warmup: 0.0 } }
      - { type: linear, pooling: mean, optimization: { lr: 0.005,  weight_decay: 0.8,  start_lr: 0.005,  final_lr: 0.005,  final_weight_decay: 0.8,  warmup: 0.0 } }

  data:
    dataset_type: VideoDataset
    dataset_train: __TRAIN_CSV__     # data_csv/IntPhys1_dev/cv/train_fold{k}.csv
    dataset_val:   __VAL_CSV__       # data_csv/IntPhys1_dev/cv/val_fold{k}.csv
    num_classes: 2                   # possible(0) vs impossible(1)
    resolution: 256
    resize_mode: resize              # 288² -> 256² 직접 리사이즈 (정사각이라 왜곡 없음)
    frames_per_clip: 16
    frame_step: 1                    # keystone 중심 16프레임 연속
    num_segments: 1
    num_views_per_segment: 1
    uniform_sampling: false
    center_sampling: false
    keystones_json: /data/hyuntak/project/2026/2027_cvpr/vjepa2/data_csv/IntPhys1_dev/keystones.json

  optimization:
    batch_size: 8
    num_epochs: 50                   # C.11 (IntPhys)
    optimizer: adam                  # C.11. 생략하면 AdamW 가 기본이라 명시한다
    use_bfloat16: false              # 이름과 달리 fp16 autocast 로 매핑된다.
                                     # fused sum-of-losses backward 와 겹치면 GradScaler 가
                                     # 한 probe 만 발산해도 전체를 얼려버린다. fp32 로 둔다.
    save_optimizer: false
    cache_features: true             # layer x HP 를 매번 forward 하지 않도록 pooled feature 캐시
    cache_pooling: mean              # §3.2 "mean-pooled space-time patches"
    cache_max_gb: 100
    eval_metric: per_video           # 논문 Fig 1 기준. 영상 하나하나의 이진 분류 정확도, chance 50%
    default_head: { start_lr: 0.0, final_lr: 0.0, final_weight_decay: 0.0 }

model_kwargs:
  checkpoint: /data/hyuntak/project/2026/2027_cvpr/vjepa2/checkpoint/models--facebook--vjepa2-vitl-fpc64-256/snapshots/b3c1679b7c34d3255ef3547f27c7b226aefab26f/original/model.pth
  module_name: evals.analysis.modelcustom.vit_encoder_multilayer
  pretrain_kwargs:
    encoder:
      checkpoint_key: target_encoder
      model_name: vit_large          # 24 layer, d=1024
      patch_size: 16
      tubelet_size: 2
      uniform_power: true
      use_rope: true
      img_temporal_dim_size: null
  wrapper_kwargs:
    max_frames: 128
    use_pos_embed: false
    apply_encoder_norm: false        # forward hook 으로 residual stream x_N 을 그대로 읽는다.
                                     # true 면 intermediate 마다 self.norm 을 먹이는 stock 경로가
                                     # 되는데, 그건 concat-wrapper 규약이지 layer-wise probing 이
                                     # 아니다 (§3.2 "probe the residual stream at every layer").
